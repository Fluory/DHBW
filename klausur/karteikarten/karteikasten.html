alwirtschaft", "q": "Ein Rohstoff hat einen Verbrauchswert von 43,75 Mio. € bei 90 Mio. € Gesamtwert. Einordnung?", "options": ["A-Gut (48,61 %)", "B-Gut (48,61 %)", "A-Gut (43,75 %)", "C-Gut, weil nur 1 von 10 Positionen"], "correct": 0, "explain": "43,75 / 90 = 48,61 % des Werts – fast die Hälfte, also eindeutig A (Musterklausur 7a)."}, {"topic": "Marketing: Analyse", "q": "Marktvolumen Tische 150 Mio. €, Umsatz der Miller KG 12 Mio. €. Marktanteil?", "options": ["12 %", "8 %", "0,8", "80 %"], "correct": 1, "explain": "Marktanteil = 12 · 100 / 150 = 8 %."}, {"topic": "Marketing: Analyse", "q": "Miller hat 8 % Marktanteil, der größte Konkurrent 10 %. Relativer Marktanteil?", "options": ["80 %", "0,8", "1,25", "−2 %"], "correct": 1, "explain": "Eigener MA / MA des größten Konkurrenten = 8 / 10 = 0,8, als Dezimalzahl."}, {"topic": "Marketing: Analyse", "q": "Ein Produkt hat einen hohen relativen Marktanteil in einem stagnierenden Markt und bringt Geldüberschüsse. BCG-Feld?", "options": ["Poor Dog", "Star", "Question Mark", "Cash Cow"], "correct": 3, "explain": "Hoher Marktanteil + geringes Wachstum = Cash Cow: halten und abschöpfen."}, {"topic": "Marketing: Strategie", "q": "Ein Fahrradhersteller verkauft sein bisheriges Rad nun auch in Frankreich. Ansoff-Strategie?", "options": ["Produktentwicklung", "Diversifikation", "Marktdurchdringung", "Marktentwicklung"], "correct": 3, "explain": "Altes Produkt, neuer Markt (neue Region) = Marktentwicklung."}, {"topic": "Marketing: Strategie", "q": "Yamaha baut Motorräder und Pianos. Welche Diversifikation?", "options": ["Vertikal", "Keine, das ist Differenzierung", "Lateral", "Horizontal"], "correct": 2, "explain": "Kein sachlicher Zusammenhang zwischen den Produkten = laterale Diversifikation."}, {"topic": "Marketing: Kommunikation", "q": "Medium A: 10.000 €, 900.000 Nutzer, 60 % Zielgruppe. Medium B: 7.000 €, 500.000 Nutzer, 70 % Zielgruppe. Welches hat den niedrigeren TKP?", "options": ["A mit 11,11 €", "B mit 20,00 €", "B mit 14,00 €", "A mit 18,52 €"], "correct": 3, "explain": "TKP A = 10.000 / 540.000 · 1.000 = 18,52 €; B = 7.000 / 350.000 · 1.000 = 20,00 €."}, {"topic": "Marketing: Distribution", "q": "Reisender: 45.400 € Fixkosten + 2 % Provision. Handelsvertreter: 4 % Provision. Erwarteter Umsatz 3 Mio. €. Was ist günstiger?", "options": ["Reisender (kritischer Umsatz 2,27 Mio. €)", "Handelsvertreter, er hat keine Fixkosten", "Handelsvertreter (kritischer Umsatz 2,27 Mio. €)", "Beide gleich teuer"], "correct": 0, "explain": "U<sub>krit<\/sub> = 45.400 / 0,02 = 2,27 Mio. €. Bei 3 Mio. €: Reisender 105.400 €, Vertreter 120.000 €."}, {"topic": "Marketing: Kontrolle", "q": "Werbebedingter Mehrumsatz 30.000 €, Werbekosten 10.000 €. Werberendite?", "options": ["33,3 %", "300 %", "200 %", "20.000 €"], "correct": 1, "explain": "Werberendite = 30.000 / 10.000 · 100 = 300 %; der Werbegewinn wäre 20.000 €."}, {"topic": "Marketing: Preis", "q": "Ein Hersteller führt eine Spielkonsole teuer ein und senkt den Preis später schrittweise. Strategie?", "options": ["Mengenrabatt", "Penetration", "Preisbindung", "Skimming"], "correct": 3, "explain": "Hoch starten, dann senken = Abschöpfungsstrategie (Skimming)."}]}};

  {id:"wi", name:"Wirtschaftsinformatik", exam:"2026-12-09", dur:"48 Min"},
  {id:"prog", name:"Programmierung", exam:"2026-12-11", dur:"120 Min"},
  {id:"recht", name:"Recht", exam:"2026-12-14", dur:"60 Min"},
  {id:"bwl", name:"BWL + Marketing", exam:"2026-12-16", dur:"120 Min"},
  {id:"mathe", name:"Mathe I", exam:"2026-12-18", dur:"120 Min"}
].filter(s => DATA[s.id]);
const PLAN_HTML = "<h2>Deine Lernseiten<\/h2><p>Pro Fach eine Seite mit Erklärungen, Achtung-Kästen und Übungen mit Lösungen. Hier lernst du den Stoff, im Karteikasten fragst du ihn ab.<\/p><div class=\"tbl\"><table><thead><tr><th>Fach<\/th><th>Klausur<\/th><th>Link<\/th><\/tr><\/thead><tbody><tr><td>Grundlagen IT<\/td><td class=\"num\">07.12.<\/td><td><a href=\"https://claude.ai/artifact/3tiqe3o9EDHk9ViDJ5f4Jf\" target=\"_blank\" rel=\"noopener\">Lernseite öffnen<\/a><\/td><\/tr><tr><td>Wirtschaftsinformatik<\/td><td class=\"num\">09.12.<\/td><td><a href=\"https://claude.ai/artifact/8fM9j8ZGQCW8LLHsng2EGo\" target=\"_blank\" rel=\"noopener\">Lernseite öffnen<\/a><\/td><\/tr><tr><td>Programmierung<\/td><td class=\"num\">11.12.<\/td><td><a href=\"https://claude.ai/artifact/V99JgocAmPZqLpNjAyCiiP\" target=\"_blank\" rel=\"noopener\">Lernseite öffnen<\/a><\/td><\/tr><tr><td>Recht<\/td><td class=\"num\">14.12.<\/td><td><a href=\"https://claude.ai/artifact/LJNfrjV9LrWEhp9mpMPrBF\" target=\"_blank\" rel=\"noopener\">Lernseite öffnen<\/a><\/td><\/tr><tr><td>BWL<\/td><td class=\"num\">16.12.<\/td><td><a href=\"https://claude.ai/artifact/VgQbsUCk9G8YUggDEXdKda\" target=\"_blank\" rel=\"noopener\">Lernseite öffnen<\/a><\/td><\/tr><tr><td>Marketing (mit BWL)<\/td><td class=\"num\">16.12.<\/td><td><a href=\"https://claude.ai/artifact/WX6BQrQVeKYCm3yYVTrxfW\" target=\"_blank\" rel=\"noopener\">Lernseite öffnen<\/a><\/td><\/tr><tr><td>Mathe I<\/td><td class=\"num\">18.12.<\/td><td><a href=\"https://claude.ai/artifact/EuFPJF3hRsDqAQm9SJTaS2\" target=\"_blank\" rel=\"noopener\">Lernseite öffnen<\/a><\/td><\/tr><\/tbody><\/table><\/div><p class=\"note\">Ablauf pro Thema: 1. Lernseite lesen und Beispiel mitrechnen. 2. Übungen Stufe 1–2 ohne Lösung. 3. Hier im Karteikasten abfragen. 4. Später Stufe 3–4 und Quiz.<\/p><h2>So lernst du (für alle Fächer)<\/h2>\n<ul>\n  <li><b>Abfragen statt durchlesen.<\/b> Erst selbst antworten, dann nachschauen. Das ist der Grund für die Karteikarten: Was du dir aus dem Kopf holst, bleibt hängen. Nur lesen fühlt sich gut an, bleibt aber kaum.<\/li>\n  <li><b>Jeden Tag ein bisschen statt einmal viel.<\/b> Täglich 15 Minuten Karteikarten. „Nicht gewusst“ kommt beim nächsten Mal zuerst dran, „sitzt“ zuletzt.<\/li>\n  <li><b>Rechnen und Code nur mit dem Stift.<\/b> Aufgabe lesen, Lösung zuhalten, selbst rechnen, dann vergleichen. Lösungen nur anschauen bringt bei Mathe, GIT und Programmierung fast nichts.<\/li>\n  <li><b>25 Minuten lernen, 5 Minuten Pause<\/b> (Pomodoro). Nach 4 Runden eine lange Pause. Wenn es frustriert: Pause machen, dann eine leichtere Aufgabe.<\/li>\n  <li><b>Fehlerliste.<\/b> Jeder Fehler kommt mit einem Satz („Warum falsch?“) auf einen Zettel. Den gehst du vor der Klausur durch.<\/li>\n  <li><b>Probeklausur unter Zeit.<\/b> In der letzten Woche vor jeder Klausur einmal mit Wecker, ohne Hilfen.<\/li>\n<\/ul>\n\n<h2>Pro Fach<\/h2>\n<h3>Grundlagen IT · 07.12. · 48 Min<\/h3>\n<p>Zwei Hälften: <b>Rechnen<\/b> (Zahlensysteme, Zweierkomplement, Wahrheitstabellen, Boolesche Ausdrücke vereinfachen) und <b>Wissen<\/b> (Cloud, Speicher, Von Neumann, Datenstrukturen, SQL). Rechnen täglich 2–3 kleine Aufgaben, Wissen über Karteikarten. 48 Minuten sind knapp, also auf Tempo üben.<\/p>\n<h3>Wirtschaftsinformatik · 09.12. · 48 Min<\/h3>\n<p>Viele <b>Begriffe<\/b> → Karteikarten. Dazu <b>Modelle selbst zeichnen<\/b>: EPK und ER-Modell auf Papier, dann mit der Lösung vergleichen. Die offiziellen Klausurhinweise auf der Lernseite sind deine Checkliste.<\/p>\n<h3>Programmierung · 11.12. · 120 Min<\/h3>\n<p><b>Code lesen vor Code schreiben.<\/b> Bei jeder Schleife eine Rundentabelle machen (Runde, Variable, Ausgabe). Erst „Was gibt das aus?“ üben (Quiz), dann kleine Funktionen selbst tippen und ausführen. Jeden Tag eine Aufgabe ist besser als fünf am Wochenende.<\/p>\n<h3>Recht · 14.12. · 60 Min<\/h3>\n<p>Recht ist <b>Fälle lösen<\/b>. Schema lernen (Anspruch → Voraussetzungen → Ergebnis, Gutachtenstil). Paragraphen mit Karteikarten, dann jeden Fall laut durchsprechen: „A könnte gegen B einen Anspruch aus § 433 II BGB haben, wenn …“.<\/p>\n<h3>BWL + Marketing · 16.12. · 120 Min<\/h3>\n<p>Mischung aus <b>Begriffen<\/b> (Karteikarten) und <b>Rechnungen<\/b> (Kennzahlen, Nutzwertanalyse, Break-even, ROI). Kap. 8 und 10 kannst du laut Dozentin weglassen, Schwerpunkt sind Kap. 3, 6 und 9. Die Formelsammlung in der Zusammenfassung auswendig, die Musterklausur 2025 zweimal rechnen: einmal jetzt, einmal kurz vor der Klausur.<\/p>\n<h3>Mathe I · 18.12. · 120 Min<\/h3>\n<p><b>Rezepte<\/b> lernen (z. B. Grenzwert-Taktik, welches Konvergenzkriterium), dann viele Aufgaben rechnen. Nach jedem Mathe-Termin am selben Abend 30 Minuten die neuen Aufgaben. Am Ende die Probeklausur aus dem Mathe-Kurs-PDF unter Zeit.<\/p>\n\n<h2>Plan für die nächsten 4 Wochen<\/h2>\n<p>Jeden Tag: <b>15 Min Karteikarten<\/b> (gemischt) + <b>1 Hauptblock<\/b> (60–90 Min) + nach Vorlesungstagen <b>20–30 Min Nachbereitung<\/b> des Fachs von heute. Die Reihenfolge folgt den Klausuren: Was zuerst geschrieben wird, kommt zuerst dran. BWL und Mathe laufen über die Nachbereitung mit, weil dort noch Vorlesungen kommen.<\/p>\n<div class=\"tbl\"><table>\n  <thead><tr><th>Woche<\/th><th>Hauptblock<\/th><th>Nebenbei<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"num\">09.–15.11.<\/td><td><b>GIT<\/b> komplett einmal durch (Lernseite, alle Kapitel). Studientag 11.11.: GIT-Übungen Stufe 1–2.<\/td><td>Mathe/Recht/BWL nachbereiten, WI-Karteikarten<\/td><\/tr>\n    <tr><td class=\"num\">16.–22.11.<\/td><td><b>WI<\/b> komplett durch, EPK und ER zeichnen. Zweimal in der Woche GIT-Rechnen.<\/td><td>Programmierung VL1–4 im Quiz<\/td><\/tr>\n    <tr><td class=\"num\">23.–29.11.<\/td><td><b>Programmierung<\/b> VL1–7: jeden Tag eine Aufgabe tippen. Studientag 25.11.: GIT-Probeklausur.<\/td><td>Recht: ein Fall pro Tag<\/td><\/tr>\n    <tr><td class=\"num\">30.11.–06.12.<\/td><td><b>GIT + WI Endspurt:<\/b> Probeklausuren unter Zeit, nur noch Wackelkandidaten. 03./04.12. Prüfungsvorbereitung.<\/td><td>Programmierung weiter täglich<\/td><\/tr>\n  <\/tbody>\n<\/table><\/div>\n<h3>Klausurphase<\/h3>\n<div class=\"tbl\"><table>\n  <thead><tr><th>Tage<\/th><th>Fokus<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td class=\"num\">07.12.<\/td><td>Klausur GIT, abends WI wiederholen<\/td><\/tr>\n    <tr><td class=\"num\">08.12.<\/td><td>WI: Karteikarten „Klausurpunkte“, ein EPK, ein ER-Modell<\/td><\/tr>\n    <tr><td class=\"num\">09.–10.12.<\/td><td>Klausur WI, dann Programmierung: Probeaufgaben unter Zeit<\/td><\/tr>\n    <tr><td class=\"num\">11.–13.12.<\/td><td>Klausur Programmierung, dann Recht: Fälle, Schema<\/td><\/tr>\n    <tr><td class=\"num\">14.–15.12.<\/td><td>Klausur Recht, dann BWL: Musterklausur, Formeln, Marketing-Karten<\/td><\/tr>\n    <tr><td class=\"num\">16.–17.12.<\/td><td>Klausur BWL, dann Mathe: Probeklausur und Fehlerliste<\/td><\/tr>\n    <tr><td class=\"num\">18.12.<\/td><td>Klausur Mathe. Danach ist bis 28.12. nur noch das LPK-Portfolio offen.<\/td><\/tr>\n  <\/tbody>\n<\/table><\/div>\n<p class=\"note\">Zwischen den Klausuren liegen nur 1–2 Tage. Deshalb müssen Recht, BWL und Mathe vor dem 07.12. schon einmal gelernt sein: über die tägliche Nachbereitung und die Karteikarten.<\/p>\n\n<h2>Stand deiner Lernunterlagen (06.11.)<\/h2>\n<div class=\"tbl\"><table>\n  <thead><tr><th>Fach<\/th><th>Stand<\/th><th>Was noch fehlt<\/th><\/tr><\/thead>\n  <tbody>\n    <tr><td>Grundlagen IT<\/td><td><span class=\"st ok\">fertig<\/span><\/td><td>Nichts, die Vorlesung ist abgeschlossen. Lernseite mit 11 Kapiteln, Zusammenfassung, Aufgaben und Lösungen.<\/td><\/tr>\n    <tr><td>Wirtschaftsinformatik<\/td><td><span class=\"st ok\">fertig<\/span><\/td><td>Nichts, die Vorlesung ist abgeschlossen. Lernseite mit offiziellen Klausurhinweisen.<\/td><\/tr>\n    <tr><td>Programmierung<\/td><td><span class=\"st part\">bis VL 7<\/span><\/td><td>Die restlichen Termine bis 27.11. Der Kaffeeshop (VL 7) ist schon drin.<\/td><\/tr>\n    <tr><td>Recht<\/td><td><span class=\"st part\">Skript komplett<\/span><\/td><td>Die Lernseite deckt das ganze Skript ab. Die 4 Termine bis 23.11. werden danach abgeglichen.<\/td><\/tr>\n    <tr><td>BWL<\/td><td><span class=\"st part\">Skript komplett<\/span><\/td><td>Die Zusammenfassung hat Kap. 1–10, Folien bis Kap. 7 sind da. Laut „Könnte drankommen“ fallen Kap. 8 und 10 weg, von Kap. 7 bleiben nur Kennzahlen und Balanced Scorecard.<\/td><\/tr>\n    <tr><td>Marketing<\/td><td><span class=\"st part\">aus dem Skript<\/span><\/td><td>Die Vorlesung beginnt erst am 18.11. (6 Termine bis 01.12.). Die Lernseite ist aus Skript und Musterklausur vorbereitet und wird nach den Terminen abgeglichen.<\/td><\/tr>\n    <tr><td>Mathe I<\/td><td><span class=\"st part\">bis 04.11.<\/span><\/td><td>Noch 8 Termine bis 02.12. (u. a. Differential- und Integralrechnung).<\/td><\/tr>\n  <\/tbody>\n<\/table><\/div>\n";

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const st = {
  subj: store.get("kk-subj", SUBJECTS[0].id),
  mode: store.get("kk-mode", "cards"),
  topic: "", examOnly:false, weakOnly:false,
  boxes: store.get("kk-boxes", {}),
  deck: [], idx: 0, flipped: false,
  quiz: null
};
if (!SUBJECTS.some(s => s.id === st.subj)) st.subj = SUBJECTS[0].id;
if (!["cards","quiz","plan"].includes(st.mode)) st.mode = "cards";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const daysTo = iso => { const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(iso+"T00:00:00") - t) / 864e5); };
const fmtDate = iso => { const [y,m,d] = iso.split("-"); return d+"."+m+"."; };
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const cardId = (s, i) => s + ":" + i;
const boxOf = id => st.boxes[id] || 0; // 0 neu, 1 nicht gewusst, 2 unsicher, 3 sitzt

function renderSubjects(){
  $("#subjects").innerHTML = SUBJECTS.map(s => {
    const d = daysTo(s.exam);
    const when = d > 0 ? "in " + d + " Tagen" : d === 0 ? "heute" : "vorbei";
    return '<button class="subj" aria-pressed="'+(s.id===st.subj)+'" data-s="'+s.id+'">'+esc(s.name)+'<small>Klausur '+fmtDate(s.exam)+' · '+when+'</small></button>';
  }).join("");
  document.querySelectorAll(".subj").forEach(b => b.onclick = () => { st.subj = b.dataset.s; store.set("kk-subj", st.subj); st.topic=""; st.quiz=null; if (st.mode==="plan") st.mode="cards"; render(); });
}
function renderModes(){
  document.querySelectorAll(".mode").forEach(b => {
    b.setAttribute("aria-selected", b.dataset.mode === st.mode);
    b.onclick = () => { st.mode = b.dataset.mode; store.set("kk-mode", st.mode); render(); };
  });
}

/* ---------- Karteikarten ---------- */
function buildDeck(){
  const cards = DATA[st.subj].cards.map((c,i) => ({...c, id: cardId(st.subj,i)}));
  let list = cards.filter(c => (!st.topic || c.topic === st.topic) && (!st.examOnly || c.exam) && (!st.weakOnly || [1,2].includes(boxOf(c.id))));
  // schwache Karten zuerst, innerhalb der Box gemischt
  const order = [1,0,2,3];
  st.deck = order.flatMap(b => shuffle(list.filter(c => boxOf(c.id) === b)));
  st.idx = 0; st.flipped = false;
}
function renderCards(){
  const all = DATA[st.subj].cards;
  const topics = [...new Set(all.map(c => c.topic))];
  const counts = [0,0,0,0];
  all.forEach((c,i) => counts[boxOf(cardId(st.subj,i))]++);
  const v = $("#view");
  v.innerHTML =
    '<div class="boxes">'+
      '<div class="box b1"><b>'+(counts[1])+'</b><span>nicht gewusst</span></div>'+
      '<div class="box b2"><b>'+(counts[2])+'</b><span>unsicher</span></div>'+
      '<div class="box b3"><b>'+(counts[3])+'</b><span>sitzt · '+counts[0]+' neu</span></div>'+
    '</div>'+
    '<div class="bar">'+
      '<select id="topic" aria-label="Thema"><option value="">Alle Themen ('+all.length+')</option>'+
        topics.map(t => '<option'+(t===st.topic?' selected':'')+' value="'+esc(t)+'">'+esc(t)+' ('+all.filter(c=>c.topic===t).length+')</option>').join("")+
      '</select>'+
      '<button class="chip" id="f-exam" aria-pressed="'+st.examOnly+'">Nur Klausurpunkte</button>'+
      '<button class="chip" id="f-weak" aria-pressed="'+st.weakOnly+'">Nur Wackelkandidaten</button>'+
    '</div>'+
    '<div id="cardzone"></div>';
  $("#topic").onchange = e => { st.topic = e.target.value; buildDeck(); renderCard(); };
  $("#f-exam").onclick = () => { st.examOnly = !st.examOnly; renderCards(); };
  $("#f-weak").onclick = () => { st.weakOnly = !st.weakOnly; renderCards(); };
  buildDeck(); renderCard();
}
function renderCard(){
  const z = $("#cardzone");
  if (!st.deck.length){
    z.innerHTML = '<div class="empty">Für diese Auswahl gibt es keine Karten. '+(st.weakOnly ? 'Super, keine Wackelkandidaten mehr.' : '')+'</div>';
    return;
  }
  if (st.idx >= st.deck.length){
    z.innerHTML = '<div class="empty"><p><b>Runde geschafft: '+st.deck.length+' Karten.</b></p><p>Mach 5 Minuten Pause. Danach am besten nur die Wackelkandidaten wiederholen.</p><p><button class="btn primary" id="again">Neue Runde</button></p></div>';
    $("#again").onclick = () => renderCards();
    return;
  }
  const c = st.deck[st.idx];
  z.innerHTML =
    '<div class="count">Karte '+(st.idx+1)+' von '+st.deck.length+'</div>'+
    '<div class="progress"><i style="width:'+(st.idx/st.deck.length*100)+'%"></i></div>'+
    '<div class="card" id="card" tabindex="0" role="button" aria-label="Karte umdrehen">'+
      '<div class="meta"><span>'+esc(c.topic)+'</span>'+(c.exam?'<span class="ex">Klausurpunkt</span>':'')+'</div>'+
      '<div class="front">'+c.front+'</div>'+
      (st.flipped ? '<div class="back">'+c.back+'</div>' : '<div class="hint">Erst selbst antworten, laut oder im Kopf. Dann tippen zum Umdrehen (oder Leertaste).</div>')+
    '</div>'+
    (st.flipped ?
      '<div class="rate"><button class="r1" data-b="1">Nicht gewusst</button><button class="r2" data-b="2">Unsicher</button><button class="r3" data-b="3">Wusste ich</button></div>'
      : '<div class="rate"><button class="btn" id="skip">Überspringen</button><button class="btn primary" id="flip" style="grid-column:span 2">Antwort zeigen</button></div>');
  const flip = () => { st.flipped = true; renderCard(); };
  $("#card").onclick = () => { if (!st.flipped) flip(); };
  if (!st.flipped){ $("#flip").onclick = flip; $("#skip").onclick = () => { st.idx++; renderCard(); }; }
  else document.querySelectorAll(".rate button").forEach(b => b.onclick = () => rate(+b.dataset.b));
}
function rate(b){
  const c = st.deck[st.idx];
  st.boxes[c.id] = b; store.set("kk-boxes", st.boxes);
  st.idx++; st.flipped = false;
  const all = DATA[st.subj].cards; const counts=[0,0,0,0];
  all.forEach((x,i) => counts[boxOf(cardId(st.subj,i))]++);
  const bx = document.querySelectorAll(".box b");
  if (bx.length===3){ bx[0].textContent=counts[1]; bx[1].textContent=counts[2]; bx[2].textContent=counts[3]; bx[2].nextElementSibling.textContent="sitzt · "+counts[0]+" neu"; }
  renderCard();
}
document.addEventListener("keydown", e => {
  if (st.mode !== "cards" || !$("#card") || e.target.tagName === "SELECT") return;
  if (e.key === " " || e.key === "Enter"){ if (!st.flipped){ e.preventDefault(); st.flipped = true; renderCard(); } }
  else if (st.flipped && ["1","2","3"].includes(e.key)) rate(+e.key);
});

/* ---------- Quiz ---------- */
function startQuiz(n, only){
  const qs = DATA[st.subj].quiz.map((q,i) => ({...q, i}));
  const pool = only ? qs.filter(q => only.includes(q.i)) : qs;
  st.quiz = { list: shuffle(pool).slice(0, n || pool.length), pos: 0, answers: [] };
  renderQuiz();
}
function renderQuiz(){
  const v = $("#view"); const all = DATA[st.subj].quiz;
  const best = store.get("kk-best-"+st.subj, null);
  if (!st.quiz){
    v.innerHTML = '<p>'+all.length+' Fragen zu '+esc(SUBJECTS.find(s=>s.id===st.subj).name)+'. Du bekommst sofort Rückmeldung mit Erklärung.</p>'+
      (best ? '<p class="note">Dein bestes Ergebnis bisher: '+best.r+' von '+best.n+' richtig.</p>' : '')+
      '<div class="bar"><button class="btn primary" id="q10">10 zufällige Fragen</button><button class="btn" id="qall">Alle '+all.length+' Fragen</button></div>';
    $("#q10").onclick = () => startQuiz(10);
    $("#qall").onclick = () => startQuiz(0);
    return;
  }
  const Q = st.quiz;
  if (Q.pos >= Q.list.length){
    const right = Q.answers.filter(a => a.ok).length, n = Q.list.length;
    const wrongIdx = Q.answers.filter(a => !a.ok).map(a => a.i);
    if (!best || right/n > best.r/best.n) store.set("kk-best-"+st.subj, {r:right, n});
    const pct = Math.round(right/n*100);
    v.innerHTML = '<div class="result"><div class="big">'+right+' / '+n+'</div><p>'+
      (pct >= 80 ? 'Stark. Das sitzt schon gut.' : pct >= 50 ? 'Bestanden-Niveau. Die falschen Fragen jetzt direkt wiederholen.' : 'Noch wackelig. Erst die Karteikarten zum Thema, dann das Quiz nochmal.')+'</p>'+
      '<div class="bar" style="justify-content:center">'+(wrongIdx.length ? '<button class="btn primary" id="qw">Falsche wiederholen ('+wrongIdx.length+')</button>' : '')+'<button class="btn" id="qn">Neues Quiz</button></div></div>';
    if (wrongIdx.length) $("#qw").onclick = () => startQuiz(0, wrongIdx);
    $("#qn").onclick = () => { st.quiz = null; renderQuiz(); };
    return;
  }
  const q = Q.list[Q.pos]; const ans = Q.answers[Q.pos];
  v.innerHTML =
    '<div class="count">Frage '+(Q.pos+1)+' von '+Q.list.length+' · '+esc(q.topic)+'</div>'+
    '<div class="progress"><i style="width:'+(Q.pos/Q.list.length*100)+'%"></i></div>'+
    '<p class="q">'+q.q+'</p>'+
    (q.code ? '<pre><code>'+esc(q.code)+'</code></pre>' : '')+
    '<div class="opts">'+q.options.map((o,k) => {
      let cls = "opt";
      if (ans){ if (k === q.correct) cls += " right"; else if (k === ans.pick) cls += " wrong"; }
      return '<button class="'+cls+'" data-k="'+k+'"'+(ans?' disabled':'')+'><span class="k">'+"ABCD"[k]+'</span><span>'+o+'</span></button>';
    }).join("")+'</div>'+
    (ans ? '<div class="explain"><b>'+(ans.ok ? 'Richtig.' : 'Leider falsch. Richtig ist '+"ABCD"[q.correct]+'.')+'</b> '+q.explain+'</div><div class="bar" style="margin-top:12px"><button class="btn primary" id="next">'+(Q.pos+1 < Q.list.length ? 'Nächste Frage' : 'Ergebnis ansehen')+'</button></div>' : '');
  if (!ans) document.querySelectorAll(".opt").forEach(b => b.onclick = () => { const k=+b.dataset.k; Q.answers[Q.pos] = {pick:k, ok:k===q.correct, i:q.i}; renderQuiz(); });
  else $("#next").onclick = () => { Q.pos++; renderQuiz(); };
}

/* ---------- Plan ---------- */
function renderPlan(){ $("#view").innerHTML = '<div class="plan">'+PLAN_HTML+'</div>'; }

function render(){
  renderSubjects(); renderModes();
  if (st.mode === "cards") renderCards();
  else if (st.mode === "quiz") renderQuiz();
  else renderPlan();
}
render();
</script>
