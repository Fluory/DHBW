<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: eine ruhige Spalte; oben Fachwahl, darunter Modus (Karten / Quiz / Plan), Karte als einziges hervorgehobenes Objekt */
:root{
  --bg:#ffffff; --paper:#f6f7fb; --ink:#22262f; --muted:#5d6472; --line:#e3e6ee;
  --accent:#4f5fa8; --accent-soft:#eceefa; --signal:#b4652a; --signal-soft:#f8ede4;
  --ok:#2f6f9f; --ok-soft:#e6f0f8; --bad:#b4472a; --bad-soft:#f9e8e3;
  --display:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
header h1{font:700 1.6rem/1.2 var(--display);margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.95rem}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:18px 0 12px}
.subj{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font:500 .95rem var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.subj small{font:400 .72rem var(--mono);color:var(--muted);letter-spacing:.02em}
.subj[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.subj[aria-pressed="true"] small{color:var(--accent)}
.modes{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 18px}
.mode{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:500 .95rem var(--body);color:var(--muted);cursor:pointer;margin-bottom:-1px}
.mode[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select{font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.chip{font:500 .8rem var(--body);border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--signal-soft);border-color:var(--signal);color:var(--signal)}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
.box{background:var(--paper);border-radius:10px;padding:8px 10px}
.box b{display:block;font:600 1.15rem var(--mono);font-variant-numeric:tabular-nums}
.box span{font-size:.78rem;color:var(--muted)}
.box.b1 b{color:var(--bad)} .box.b2 b{color:var(--signal)} .box.b3 b{color:var(--ok)}
.card{border:1px solid var(--line);border-radius:14px;background:var(--bg);box-shadow:0 1px 2px rgba(34,38,47,.05),0 8px 24px rgba(79,95,168,.08);padding:22px 20px;min-height:220px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.card .meta{display:flex;justify-content:space-between;gap:8px;font:400 .75rem var(--mono);color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.card .meta .ex{color:var(--signal)}
.card .front{font:600 1.2rem/1.4 var(--display);text-wrap:balance}
.card .back{border-top:1px dashed var(--line);padding-top:12px;font-size:1rem}
.card .hint{margin-top:auto;font-size:.8rem;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rate button,.btn{font:500 .92rem var(--body);border-radius:10px;padding:11px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.rate .r1{border-color:var(--bad);color:var(--bad)} .rate .r2{border-color:var(--signal);color:var(--signal)} .rate .r3{border-color:var(--ok);color:var(--ok)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.count{font:400 .82rem var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
code{font:500 .9em var(--mono);background:var(--paper);padding:1px 4px;border-radius:4px}
pre{font:400 .86rem/1.5 var(--mono);background:var(--paper);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:0}
.q{font:600 1.1rem/1.45 var(--display);margin:0 0 12px;text-wrap:balance}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;font:400 .98rem/1.45 var(--body);border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg);color:var(--ink);cursor:pointer;display:flex;gap:10px}
.opt .k{font:500 .85rem var(--mono);color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.explain{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--paper);font-size:.95rem}
.progress{height:6px;background:var(--paper);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.result{text-align:center;padding:28px 12px}
.result .big{font:700 2.6rem var(--mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.plan h2{font:700 1.2rem var(--display);margin:28px 0 8px}
.plan h3{font:600 1.02rem var(--display);margin:18px 0 4px}
.plan p,.plan li{max-width:66ch}
.plan ul{padding-left:20px;margin:6px 0}
.tbl{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .78rem var(--body);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.st{display:inline-block;font:500 .75rem var(--body);padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.part{background:var(--signal-soft);color:var(--signal)} .st.no{background:var(--bad-soft);color:var(--bad)}
.note{font-size:.85rem;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
@media (max-width:420px){.card .front{font-size:1.08rem}.subj{padding:7px 10px}}
@media (prefers-reduced-motion:no-preference){.card,.opt{transition:border-color .15s,background .15s}}
</style>

<script>
const DATA = {"git": {"cards": [{"topic": "Information", "front": "Was ist der Unterschied zwischen <b>Daten<\/b> und <b>Information<\/b>?", "back": "Daten = Fakten ohne Bedeutung (z. B. 7). Erst mit Kontext werden sie Information: „7 °C in Deutschland“ heißt kalt, „7 °F in den USA“ heißt sehr kalt.", "exam": true}, {"topic": "Information", "front": "Nenne die <b>drei Sichtweisen<\/b> der Digitalisierung.", "back": "betriebswirtschaftlich · gesellschaftlich · technisch.<br>Technisch = analoge Signale werden <b>zeit- und wertediskret<\/b> (binär), z. B. 44 100 Messungen pro Sekunde.", "exam": true}, {"topic": "Information", "front": "Nenne die <b>Phasen der Digitalisierung<\/b> mit Beispiel.", "back": "1 einzelne Funktion (Rechnung automatisch) → 2 Funktionsbereich (Rechnungswesen) → 3 integrierter Prozess (Auftragsbearbeitung) → 4 1:1 überbetrieblich (lieferantengeführte Bestände) → heute m:n (B2B-Marktplätze).", "exam": true}, {"topic": "IT-Infrastruktur", "front": "Nenne die <b>sieben Hauptkomponenten<\/b> einer IT-Infrastruktur.", "back": "1 Hardware · 2 Betriebssysteme · 3 Datenverwaltung (DBMS) · 4 Netzwerke · 5 Anwendungssysteme (ERP) · 6 Internet als Plattform · 7 Beratung/Systemintegratoren.<br>Oft vergessen: 6 und 7!", "exam": true}, {"topic": "IT-Infrastruktur", "front": "Was ist <b>Client-Server<\/b>, was ist <b>N-Tier<\/b>?", "back": "Client = Eingabestelle des Benutzers, Server = hält gemeinsame Daten und Dienste.<br>2-Tier: Client ↔ Server. N-Tier: Client → Webserver → Anwendungsserver → Datenbank.", "exam": true}, {"topic": "IT-Infrastruktur", "front": "IaaS, PaaS, SaaS – je ein Beispiel?", "back": "IaaS: virtuellen Server mieten, Linux selbst installieren (AWS).<br>PaaS: nur eigenen Code hochladen (Google App Engine).<br>SaaS: fertige Software im Browser (Salesforce).", "exam": true}, {"topic": "Moore", "front": "Was hat <b>Moore<\/b> 1965 wirklich gesagt?", "back": "Die <b>Anzahl der Transistoren<\/b> pro Chip verdoppelt sich jährlich, später korrigiert: alle <b>2 Jahre<\/b>.<br>Es geht um die Anzahl, nicht um Größe oder Leistung.", "exam": true}, {"topic": "Moore", "front": "Nenne die <b>drei Interpretationen<\/b> des Mooreschen Gesetzes.", "back": "Alle <b>18 Monate<\/b>: 1) Leistung der Mikroprozessoren verdoppelt sich, 2) Leistung der Computer verdoppelt sich, 3) Preis der Informationsverarbeitung <b>halbiert<\/b> sich.", "exam": true}, {"topic": "Moore", "front": "Rechnen: Verdopplung alle 2 Jahre – Faktor nach 10 Jahren?", "back": "10 / 2 = 5 Verdopplungen → 2⁵ = <b>32-fach<\/b>.<br>Formel: Faktor = 2<sup>t/T<\/sup>.", "exam": false}, {"topic": "Zahlen", "front": "Stellenwerte für 8 Bit auswendig?", "back": "128 64 32 16 8 4 2 1.<br>Hex: A=10, B=11, C=12, D=13, E=14, F=15. 16er-Potenzen: 1, 16, 256, 4096.", "exam": true}, {"topic": "Zahlen", "front": "Wie rechnest du <b>dezimal → binär<\/b>? (Beispiel 235)", "back": "Restwertmethode: immer durch 2 teilen, Reste <b>von unten nach oben<\/b> lesen.<br>235 → <code>1110 1011<\/code>₂.", "exam": true}, {"topic": "Zahlen", "front": "1011 0110₂ = ? (dezimal, ohne Vorzeichen)", "back": "Stellenwerte über die Einsen addieren: 128 + 32 + 16 + 4 + 2 = <b>182<\/b>.", "exam": true}, {"topic": "Zahlen", "front": "Binär → Oktal/Hex: Wie gruppierst du?", "back": "Immer <b>von rechts<\/b> gruppieren: Oktal 3 Bit, Hex 4 Bit.<br>100₁₀ = 0110 0100 → 001|100|100 = <b>144₈<\/b> (nicht 344!), 0110|0100 = 64₁₆.", "exam": true}, {"topic": "Zahlen", "front": "Zweierkomplement von −25 in 8 Bit?", "back": "1) 25 = <code>0001 1001<\/code> 2) invertieren: <code>1110 0110<\/code> 3) +1: <code>1110 0111<\/code>.<br>Probe: −128 + 64 + 32 + 4 + 2 + 1 = −25 ✓", "exam": true}, {"topic": "Zahlen", "front": "Wie liest du <code>1111 0001<\/code> im Zweierkomplement?", "back": "Erstes Bit 1 → negativ. −128-Probe: −128 + 64 + 32 + 16 + 1 = <b>−15<\/b>.<br>Achtung: Nicht 241 und das Minus nicht vergessen!", "exam": true}, {"topic": "Zahlen", "front": "Wie rechnest du 42 − 17 in 8 Bit?", "back": "a − b = a + (−b). Komplement von <b>17<\/b> (der Zahl hinter dem Minus): <code>1110 1111<\/code>.<br><code>0010 1010<\/code> + <code>1110 1111<\/code> = (1)<code>0001 1001<\/code> → Übertrag weg → <b>25<\/b>.", "exam": true}, {"topic": "Zahlen", "front": "Wann ist ein <b>Überlauf<\/b>? (8 Bit Zweierkomplement)", "back": "Wenn das Ergebnis nicht in −128 … +127 passt. Faustregel: plus + plus ergibt minus (oder minus + minus ergibt plus).<br>90 + 60 = 150 → <code>1001 0110<\/code> = −106 → Überlauf.", "exam": true}, {"topic": "Zahlen", "front": "Wertebereiche bei 8 Bit?", "back": "Ohne Vorzeichen: 0 … 255.<br>Zweierkomplement: <b>−128 … +127<\/b> (nur eine Null).<br>Vorzeichen-Betrag und Einerkomplement: −127 … +127 (zwei Nullen).", "exam": true}, {"topic": "Zahlen", "front": "4,375₁₀ als binäre Kommazahl?", "back": "4 = 100. Nachkomma immer ×2: 0,375→0,75 (0) → 1,5 (1) → 1,0 (1).<br>Ergebnis: <b>100,011₂<\/b>.", "exam": true}, {"topic": "Logik", "front": "AND, OR, XOR in einem Satz?", "back": "AND (∧): nur 1, wenn <b>alle<\/b> 1 sind.<br>OR (∨): nur 0, wenn <b>alle<\/b> 0 sind.<br>XOR (⊕): 1, wenn die Eingänge <b>verschieden<\/b> sind.", "exam": true}, {"topic": "Logik", "front": "Rezept: Wahrheitstabelle → DNF", "back": "1) Nur Zeilen mit Y = 1 nehmen. 2) Pro Zeile ein ∧-Term: 1 → Variable, 0 → ¬Variable. 3) Alle Terme mit ∨ verbinden.<br>Zeile 1 0 1 → (A ∧ ¬B ∧ C).", "exam": true}, {"topic": "Logik", "front": "<b>Kernregel<\/b> zum Vereinfachen?", "back": "Zwei Terme unterscheiden sich nur in <b>einer<\/b> Variablen → sie fällt weg.<br>(A ∧ B) ∨ (A ∧ ¬B) = A ∧ (B ∨ ¬B) = A ∧ 1 = <b>A<\/b>.", "exam": true}, {"topic": "Logik", "front": "Vereinfache: (¬A ∧ B) ∨ (A ∧ B)", "back": "B ausklammern: B ∧ (¬A ∨ A) = B ∧ 1 = <b>B<\/b>.", "exam": true}, {"topic": "Logik", "front": "<b>Absorption<\/b>: A ∨ (A ∧ B) = ?", "back": "<b>A<\/b>. Ist A = 1, ist alles 1. Ist A = 0, ist auch A ∧ B = 0.<br>Ebenso: A ∧ (A ∨ B) = A.", "exam": true}, {"topic": "Logik", "front": "<b>De Morgan<\/b>: ¬(A ∧ B) und ¬(A ∨ B)?", "back": "¬(A ∧ B) = ¬A ∨ ¬B.<br>¬(A ∨ B) = ¬A ∧ ¬B.<br>Merke: Negation über die Klammer → ∧ wird ∨ (und umgekehrt), jede Variable wird negiert.", "exam": true}, {"topic": "Logik", "front": "Vereinfache: (¬A ∧ ¬B) ∨ (¬A ∧ B) ∨ (A ∧ ¬B)", "back": "Term ¬A∧¬B zweimal nutzen (x ∨ x = x):<br>mit ¬A∧B → ¬A; mit A∧¬B → ¬B.<br>Ergebnis: <b>¬A ∨ ¬B<\/b> (= NAND).", "exam": true}, {"topic": "Logik", "front": "Vereinfache die Alarmanlage: (S∧¬T∧F) ∨ (S∧T∧¬F) ∨ (S∧T∧F)", "back": "S∧T∧F mit beiden kombinieren: → S∧F und S∧T.<br>(S∧F) ∨ (S∧T) = <b>S ∧ (T ∨ F)<\/b>.", "exam": true}, {"topic": "Logik", "front": "Welche Muster erkennst du sofort?", "back": "(¬A ∧ B) ∨ (A ∧ ¬B) = <b>XOR<\/b>.<br>(¬A ∧ ¬B) ∨ (A ∧ B) = <b>XNOR<\/b> (ein Gatter statt fünf).", "exam": true}, {"topic": "Logik", "front": "Halbaddierer: welche Gatter?", "back": "Summe s = <b>XOR<\/b> (1+1 → 0), Übertrag c = <b>AND<\/b>.<br>Volladdierer = 2 Halbaddierer + 1 OR.", "exam": true}, {"topic": "Programmierung", "front": "Algorithmus, Programm, Prozess – Unterschied?", "back": "Algorithmus: Handlungsvorschrift, endet in <b>endlicher Zeit<\/b> (Rezept).<br>Programm: Umsetzung in einer Sprache, darf endlos laufen (Webserver).<br>Prozess: <b>laufendes<\/b> Programm mit Daten (Browser im Taskmanager).", "exam": true}, {"topic": "Programmierung", "front": "Compiler vs. Interpreter?", "back": "Compiler: übersetzt <b>vorab das ganze<\/b> Programm in Maschinencode.<br>Interpreter: übersetzt <b>zur Laufzeit<\/b> Befehl für Befehl (ggf. über Bytecode, Java/Python).", "exam": true}, {"topic": "Programmierung", "front": "Was liefert fakrek(4)? Was braucht jede Rekursion?", "back": "4 · 3 · 2 · 1 = <b>24<\/b>.<br>Jede Rekursion braucht eine <b>Abbruchbedingung<\/b>, sonst läuft der Aufrufstapel über.", "exam": true}, {"topic": "Datenstrukturen", "front": "Stack: Prinzip und Operationen?", "back": "<b>LIFO<\/b> (Tellerstapel). push(x) legt oben drauf, pop() nimmt oben weg, top() liest nur.<br>Fehlerfall: pop/top auf leerem Stack.", "exam": true}, {"topic": "Datenstrukturen", "front": "Queue: Prinzip und Operationen?", "back": "<b>FIFO<\/b> (Supermarktkasse). put(x) hinten rein, get() vorne raus.<br>Fehlerfall: get() auf leerer Queue.", "exam": true}, {"topic": "Datenstrukturen", "front": "Stack durchspielen: push(4), push(8), push(2), pop(), push(5), top(), pop(), pop()", "back": "Ausgaben: 2, 5 (top, bleibt), 5, 8.<br>Am Ende liegt nur noch <b>[4]<\/b>.", "exam": true}, {"topic": "Datenstrukturen", "front": "Array vs. verkettete Liste – je Vor- und Nachteil?", "back": "Array: + direkter Zugriff über Index (a[5]) · − feste Länge, Einfügen nur durch Umkopieren.<br>Liste: + Einfügen/Löschen durch Zeiger umhängen · − Suche ab dem Kopf.", "exam": true}, {"topic": "Datenstrukturen", "front": "Geordneten Binärbaum aufbauen: Regel?", "back": "Immer an der Wurzel starten: kleiner → links, größer → rechts, bis ein freier Platz kommt.<br>Probe: von links nach rechts gelesen = sortiert.", "exam": true}, {"topic": "Datenstrukturen", "front": "Knoten mit zwei Kindern löschen?", "back": "Ersetzen durch den <b>größten im linken<\/b> Teilbaum (1× links, dann ganz rechts) oder den <b>kleinsten im rechten<\/b> Teilbaum (1× rechts, dann ganz links).", "exam": true}, {"topic": "Suchen/Sortieren", "front": "Lineare vs. binäre Suche?", "back": "Linear: keine Voraussetzung, <b>O(n)<\/b>.<br>Binär: Daten müssen <b>sortiert<\/b> sein, Mitte prüfen, Hälfte wegwerfen, <b>O(log n)<\/b>.", "exam": true}, {"topic": "Suchen/Sortieren", "front": "Wie viele Schritte braucht die binäre Suche höchstens?", "back": "Kleinstes k mit 2<sup>k<\/sup> > n.<br>n = 1 000 → 2¹⁰ = 1 024 → <b>10<\/b> Schritte. n = 500 → 2⁹ = 512 → 9.", "exam": true}, {"topic": "Suchen/Sortieren", "front": "Bubble Sort: Was steht nach dem 1. Durchlauf fest?", "back": "Das <b>größte<\/b> Element steht <b>hinten<\/b>. Nachbarn vergleichen und tauschen. Aufwand <b>O(n²)<\/b>.<br>[5,1,4,2,8] → nach Durchlauf 1: [1,4,2,5,8].", "exam": true}, {"topic": "Suchen/Sortieren", "front": "Merge Sort: Prinzip und Aufwand?", "back": "Teile und Herrsche, rekursiv: in der Mitte teilen bis Einzelelemente, dann sortiert <b>zusammenführen<\/b> (Merge). Aufwand <b>O(n log n)<\/b>.", "exam": true}, {"topic": "Suchen/Sortieren", "front": "O-Notation zuordnen: O(1), O(log n), O(n), O(n log n), O(n²)", "back": "O(1): Zugriff a[5] · O(log n): binäre Suche · O(n): lineare Suche · O(n log n): Merge Sort · O(n²): Bubble Sort.<br>n verdoppelt → O(n²) wird 4-mal so lang.", "exam": true}, {"topic": "Rechnerarchitektur", "front": "Kern der <b>Von-Neumann<\/b>-Architektur?", "back": "Programme und Daten liegen binär im <b>selben Speicher<\/b> und laufen über <b>einen gemeinsamen Bus<\/b>.<br>Merke: 1 Speicher, 1 Bus.", "exam": true}, {"topic": "Rechnerarchitektur", "front": "Die <b>fünf Komponenten<\/b> des Von-Neumann-Rechners?", "back": "Rechenwerk (ALU) · Steuerwerk · Speicherwerk (Programme + Daten) · Ein-/Ausgabewerk · Bussystem.<br>Steuer- + Rechenwerk = CPU. Den Bus nicht vergessen!", "exam": true}, {"topic": "Rechnerarchitektur", "front": "Die <b>fünf Phasen<\/b> des Von-Neumann-Zyklus?", "back": "1 FETCH · 2 DECODE · 3 FETCH OPERANDS · 4 EXECUTE · 5 UPDATE INSTRUCTION POINTER.", "exam": true}, {"topic": "Rechnerarchitektur", "front": "Was ist die <b>Harvard<\/b>-Architektur?", "back": "Getrennte Speicher <b>und<\/b> getrennte Busse für Befehle und Daten. Befehl und Daten gleichzeitig holen → schneller, aber teurer.<br>Einsatz: Mikrocontroller (Arduino), Signalverarbeitung.", "exam": true}, {"topic": "Rechnerarchitektur", "front": "Von Neumann: Pro und Contra?", "back": "Pro: einfacher, billiger.<br>Contra 1: <b>Flaschenhals<\/b> = der gemeinsame Bus (Befehl und Daten nacheinander, min. 2 Takte).<br>Contra 2: Sicherheit (Buffer Overflow, Code als Daten getarnt).", "exam": true}, {"topic": "Rechnerarchitektur", "front": "Steuer-, Adress-, Datenbus beim Lesen?", "back": "Steuerbus: Lesebefehl · Adressbus: <b>wo<\/b> (Adresse der Zelle) · Datenbus: <b>was<\/b> (die Daten zur CPU).", "exam": true}, {"topic": "Speicher/RAID", "front": "Speicherhierarchie von oben nach unten?", "back": "Register → L1 → L2 → L3 → RAM | SSD/Flash → Festplatte → Band/Cloud.<br>Nach unten: langsamer, größer, billiger pro Bit. Grenze volatil/persistent: zwischen RAM und Flash.", "exam": true}, {"topic": "Speicher/RAID", "front": "Warum hilft ein kleiner <b>Cache<\/b>?", "back": "Wegen der <b>Lokalität<\/b>: Das Nächste liegt meist direkt neben dem Letzten. Beispiele: Schleifen, Arrays.<br>Fehlt etwas im Cache: Cache-Miss → aus dem RAM nachladen.", "exam": true}, {"topic": "Speicher/RAID", "front": "Adressleitungen ↔ Speichergröße?", "back": "n Leitungen → 2ⁿ Byte. 2¹⁰ = 1 KB, 2²⁰ = 1 MB, 2³⁰ = 1 GB.<br>32 Leitungen → 4 GB. 16 GB = 2⁴·2³⁰ = 2³⁴ → 34 Leitungen.", "exam": true}, {"topic": "Speicher/RAID", "front": "RAID 0, 1, 5, 6: Prinzip, min. Platten, Ausfälle?", "back": "RAID 0: Striping, 2 Platten, <b>0<\/b> Ausfälle.<br>RAID 1: Spiegelung, 2, 1.<br>RAID 5: Striping + Parität, 3, 1.<br>RAID 6: doppelte Parität, 4, 2.", "exam": true}, {"topic": "Speicher/RAID", "front": "Nutzkapazität: 5 Platten à 4 TB?", "back": "RAID 0: 5·4 = <b>20 TB<\/b> · RAID 5: (5−1)·4 = <b>16 TB<\/b> · RAID 6: (5−2)·4 = <b>12 TB<\/b>.", "exam": true}, {"topic": "Datenbanken/SQL", "front": "Probleme des <b>Dateiansatzes<\/b>?", "back": "Redundanz/Inkonsistenz (alte Adresse im Vertrieb) · Abhängigkeit Programm–Daten · fehlender Datenaustausch · mangelnde Datensicherheit.", "exam": true}, {"topic": "Datenbanken/SQL", "front": "DB, DBMS, Datenbanksystem, Data Dictionary?", "back": "DB = Daten. DBMS = Software, die sie verwaltet. Datenbanksystem = DB + DBMS.<br>Data Dictionary = Katalog der <b>Metadaten<\/b> (welche Tabellen, Attribute, Datentypen).", "exam": true}, {"topic": "Datenbanken/SQL", "front": "ER-Modell (Chen): Symbole?", "back": "Rechteck = Entitätstyp · Raute = Beziehung · Ellipse = Attribut · unterstrichen = Schlüssel.<br>Beispiel: Student – besucht (m:n) – Vorlesung.", "exam": true}, {"topic": "Datenbanken/SQL", "front": "Beziehungen in Tabellen umsetzen?", "back": "1:n → Fremdschlüssel auf der <b>n-Seite<\/b>.<br>1:1 → Fremdschlüssel auf einer Seite.<br>m:n → eigene <b>Hilfstabelle<\/b> mit beiden Fremdschlüsseln, z. B. BESUCHT(MatrNr, VNr).", "exam": true}, {"topic": "Datenbanken/SQL", "front": "Reihenfolge beim Lesen einer SQL-Abfrage?", "back": "1 FROM (welche Tabellen) → 2 WHERE (welche Zeilen) → 3 GROUP BY (Gruppen) → 4 SELECT (Spalten/Aggregate).<br>Achtung: > und >= genau lesen!", "exam": true}, {"topic": "Datenbanken/SQL", "front": "<code>SELECT ABT, COUNT(*) FROM ANGESTELLTER GROUP BY ABT;<\/code> – was kommt raus?", "back": "Eine Zeile <b>pro Abteilung<\/b>: 1 | 1, 4 | 3, 5 | 4.<br>Ohne GROUP BY gäbe COUNT(*) nur eine Zeile: 8.", "exam": true}], "quiz": [{"topic": "Information", "q": "Was beschreibt die <b>technische<\/b> Sichtweise der Digitalisierung?", "options": ["Neue Geschäftsmodelle durch Daten", "Analoge Signale werden zeit- und wertediskret (binär) dargestellt", "Arbeitswelten werden auf eine digitale Ebene übertragen", "Analoge Signale werden zeitkontinuierlich gespeichert"], "correct": 1, "explain": "Technisch heißt digital genau diskret und binär. A ist betriebswirtschaftlich, C gesellschaftlich, D ist das Gegenteil."}, {"topic": "IT-Infrastruktur", "q": "Ein Start-up mietet virtuelle Server und installiert Linux selbst. Welches Modell ist das?", "options": ["SaaS", "PaaS", "On-Premise", "IaaS"], "correct": 3, "explain": "Bei IaaS mietest du nur Rechenleistung; Betriebssystem und Anwendungen verwaltest du selbst."}, {"topic": "Moore", "q": "Welche Aussage ist eine korrekte Interpretation des Mooreschen Gesetzes?", "options": ["Die Speicherkapazität verdoppelt sich alle 18 Monate", "Die Größe eines Transistors halbiert sich alle 2 Jahre", "Der Preis der Informationsverarbeitung halbiert sich alle 18 Monate", "Die Anzahl der Transistoren verdreifacht sich jährlich"], "correct": 2, "explain": "Interpretationen: Leistung verdoppelt bzw. Preis halbiert alle 18 Monate. Speicher, Größe und „verdreifacht“ sind die typischen Fallen."}, {"topic": "Moore", "q": "Ein Chip hat heute 1 Mrd. Transistoren. Verdopplung alle 2 Jahre. Wie viele nach 8 Jahren?", "options": ["8 Mrd.", "16 Mrd.", "4 Mrd.", "32 Mrd."], "correct": 1, "explain": "8 / 2 = 4 Verdopplungen → 2⁴ = 16-fach → 16 Mrd. (8 Mrd. wäre linear gedacht)."}, {"topic": "Zahlen", "q": "2F₁₆ = ? (dezimal)", "options": ["35", "215", "47", "42"], "correct": 2, "explain": "2·16 + F(15) = 32 + 15 = 47."}, {"topic": "Zahlen", "q": "77₁₀ = ? (8 Bit binär)", "options": ["0100 1101", "1011 0010", "0101 1001", "0100 1011"], "correct": 0, "explain": "64 + 8 + 4 + 1 = 77 → 0100 1101. Bei der Restwertmethode die Reste von unten nach oben lesen."}, {"topic": "Zahlen", "q": "1101 0110₂ = ? (oktal)", "options": ["652₈", "326₈", "D6₈", "214₈"], "correct": 1, "explain": "Von rechts in 3er-Gruppen: 11|010|110 → 3 2 6. 652 entsteht, wenn man von links gruppiert; 214 ist dezimal, D6 ist hex."}, {"topic": "Zahlen", "q": "−20 im 8-Bit-Zweierkomplement?", "options": ["1110 1011", "1001 0100", "0001 0100", "1110 1100"], "correct": 3, "explain": "20 = 0001 0100 → invertieren 1110 1011 → +1 = 1110 1100. A ist nur das Einerkomplement, B Vorzeichen-Betrag."}, {"topic": "Zahlen", "q": "Welchen Wert hat <code>1111 1010<\/code> im 8-Bit-Zweierkomplement?", "options": ["−6", "250", "6", "−5"], "correct": 0, "explain": "−128 + 64 + 32 + 16 + 8 + 2 = −6. 250 wäre ohne Vorzeichen; bei 6 fehlt das Minus; −5 entsteht, wenn man das +1 vergisst."}, {"topic": "Zahlen", "q": "50 − 70 im 8-Bit-Zweierkomplement: Ergebnis?", "options": ["0001 0100 = +20", "1110 1100 = 236", "1110 1100 = −20", "1110 1011 = −21"], "correct": 2, "explain": "0011 0010 + 1011 1010 (−70) = 1110 1100. Erstes Bit 1 → negativ: −128+64+32+8+4 = −20. +20 entsteht, wenn man −50 statt −70 bildet."}, {"topic": "Zahlen", "q": "Welche Rechnung erzeugt im 8-Bit-Zweierkomplement einen <b>Überlauf<\/b>?", "options": ["100 + (−50)", "100 + 50", "−100 + (−20)", "60 + 60"], "correct": 1, "explain": "150 > 127 passt nicht in −128 … +127. Plus + Minus läuft nie über; −120 und 120 passen."}, {"topic": "Logik", "q": "Vereinfache: (A ∧ ¬B) ∨ (A ∧ B)", "options": ["A ∧ B", "B", "1", "A"], "correct": 3, "explain": "A ausklammern: A ∧ (¬B ∨ B) = A ∧ 1 = A. B fällt weg, weil es einmal normal und einmal negiert vorkommt."}, {"topic": "Logik", "q": "Forme mit De Morgan um: ¬(A ∨ ¬B)", "options": ["¬A ∧ B", "¬A ∨ B", "A ∧ ¬B", "¬A ∧ ¬B"], "correct": 0, "explain": "∨ wird ∧, jede Variable wird negiert: ¬A ∧ ¬¬B = ¬A ∧ B. Typischer Fehler: das ∨ stehen lassen."}, {"topic": "Logik", "q": "Vereinfache: (A∧B∧¬C) ∨ (A∧B∧C) ∨ (¬A∧B∧C)", "options": ["A ∧ B ∧ C", "B ∧ (A ∨ C)", "B", "A ∨ (B ∧ C)"], "correct": 1, "explain": "A∧B∧C zweimal nutzen: mit A∧B∧¬C → A∧B, mit ¬A∧B∧C → B∧C. (A∧B) ∨ (B∧C) = B ∧ (A ∨ C)."}, {"topic": "Logik", "q": "A ∨ (A ∧ B ∧ C) = ?", "options": ["A ∧ B ∧ C", "A ∨ B ∨ C", "A", "1"], "correct": 2, "explain": "Absorption: Steckt der kurze Term A ganz im langen, fällt der lange weg."}, {"topic": "Logik", "q": "Y = 1 genau bei AB = 01, 10 und 11. Welcher Ausdruck passt?", "options": ["A ⊕ B", "A ∧ B", "¬A ∨ ¬B", "A ∨ B"], "correct": 3, "explain": "Nur bei 00 ist Y = 0 → das ist OR. XOR wäre bei 11 gleich 0."}, {"topic": "Logik", "q": "Welcher DNF-Teilausdruck gehört zur Zeile A = 1, B = 0, C = 1?", "options": ["A ∧ ¬B ∧ C", "A ∨ ¬B ∨ C", "¬A ∧ B ∧ ¬C", "A ∧ B ∧ C"], "correct": 0, "explain": "1 → Variable, 0 → negierte Variable, alles mit ∧ verbinden."}, {"topic": "Logik", "q": "Y = (A ⊕ B) ∧ C. In wie vielen der 8 Zeilen ist Y = 1?", "options": ["1", "2", "3", "4"], "correct": 1, "explain": "A ⊕ B ist in 2 von 4 Fällen 1 (01, 10), dazu muss C = 1 sein → 2 Zeilen (011, 101)."}, {"topic": "Programmierung", "q": "Ein Programm zeigt jede Sekunde die Uhrzeit an und endet nie. Was ist es?", "options": ["Ein Algorithmus", "Ein Programm, aber kein Algorithmus", "Ein Compiler", "Ein Syntaxfehler"], "correct": 1, "explain": "Ein Algorithmus muss in endlicher Zeit enden. Ein Programm darf endlos laufen."}, {"topic": "Datenstrukturen", "q": "Stack: push(1), push(2), pop(), push(3), top(). Was liefert top()?", "options": ["1", "2", "3", "Fehler"], "correct": 2, "explain": "pop() entfernt die 2, dann liegt [1, 3]. top() liest das oberste: 3 (bleibt liegen). LIFO."}, {"topic": "Datenstrukturen", "q": "Binärbaum aus 50, 30, 70, 20, 40, 60. Wo landet die 40?", "options": ["links von 20", "links von 70", "rechts von 50", "rechts von 30"], "correct": 3, "explain": "40 < 50 → links zu 30; 40 > 30 → rechts von 30."}, {"topic": "Suchen/Sortieren", "q": "Wie viele Vergleiche braucht die binäre Suche bei 200 sortierten Elementen höchstens?", "options": ["7", "8", "100", "200"], "correct": 1, "explain": "Kleinstes k mit 2ᵏ > 200: 2⁷ = 128 reicht nicht, 2⁸ = 256 → 8. 200 wäre die lineare Suche."}, {"topic": "Suchen/Sortieren", "q": "Bubble Sort auf [4, 2, 5, 1, 3]. Wie sieht das Array nach dem 1. Durchlauf aus?", "options": ["[1, 2, 3, 4, 5]", "[1, 4, 2, 5, 3]", "[2, 4, 1, 3, 5]", "[2, 1, 4, 3, 5]"], "correct": 2, "explain": "4↔2, 4<5 ok, 5↔1, 5↔3 → [2, 4, 1, 3, 5]. Das größte (5) steht hinten, nicht das kleinste vorne."}, {"topic": "Rechnerarchitektur", "q": "Was ist der Von-Neumann-<b>Flaschenhals<\/b>?", "options": ["Die ALU rechnet zu langsam", "Der Speicher ist zu klein", "Der gemeinsame Bus: Befehl und Daten müssen nacheinander geholt werden", "Es gibt zwei getrennte Speicher"], "correct": 2, "explain": "Der Engpass ist der gemeinsame Bus, nicht das Rechenwerk. Getrennte Speicher sind Harvard."}, {"topic": "Rechnerarchitektur", "q": "Welche Phase folgt im Von-Neumann-Zyklus direkt auf DECODE?", "options": ["EXECUTE", "FETCH OPERANDS", "UPDATE INSTRUCTION POINTER", "FETCH"], "correct": 1, "explain": "Reihenfolge: FETCH → DECODE → FETCH OPERANDS → EXECUTE → UPDATE INSTRUCTION POINTER."}, {"topic": "Speicher/RAID", "q": "Wie viel Speicher adressieren 22 Adressleitungen?", "options": ["4 MB", "22 MB", "44 KB", "2 MB"], "correct": 0, "explain": "2²² = 2² · 2²⁰ = 4 MB. Die Größe wächst exponentiell, nicht linear (n · 8 oder 2 · n ist falsch)."}, {"topic": "Speicher/RAID", "q": "4 Platten à 3 TB im RAID 5. Wie groß ist die Nutzkapazität?", "options": ["12 TB", "6 TB", "9 TB", "3 TB"], "correct": 2, "explain": "RAID 5: (n − 1) · C = 3 · 3 = 9 TB; eine Platte geht für Parität drauf. 12 TB wäre RAID 0, 6 TB RAID 1 oder RAID 6."}, {"topic": "Datenbanken/SQL", "q": "Abteilung 4: Zelaya 25000, Wallace 43000, Jabbar 25000. Ergebnis von <code>SELECT COUNT(*) FROM ANGESTELLTER WHERE ABT = 4 AND GEHALT > 25000;<\/code>?", "options": ["3", "2", "0", "1"], "correct": 3, "explain": "Nur Wallace verdient mehr als 25000. Bei >= wären es 3."}, {"topic": "Datenbanken/SQL", "q": "Student besucht viele Vorlesungen, eine Vorlesung hat viele Studenten. Wie setzt du das in Tabellen um?", "options": ["Fremdschlüssel VNr in STUDENT", "Fremdschlüssel MatrNr in VORLESUNG", "Eigene Hilfstabelle BESUCHT(MatrNr, VNr)", "Beide Tabellen zu einer zusammenlegen"], "correct": 2, "explain": "m:n braucht eine Verknüpfungstabelle mit beiden Fremdschlüsseln als zusammengesetztem Schlüssel."}]}, "wi": {"cards": [{"topic": "Grundlagen WI", "front": "Definition Wirtschaftsinformatik nach <b>Mertens<\/b>?", "back": "Konzeption, Entwicklung, Nutzung und Wartung von <b>Informationssystemen<\/b> sowie Management des Produktionsfaktors <b>Information<\/b> für betriebliche Aufgaben.", "exam": true}, {"topic": "Grundlagen WI", "front": "Daten, Information, Wissen – Beispiel Leuchtenhändler?", "back": "Daten: „4711 · 23“ (ohne Kontext).<br>Information: „Lagerbestand Leuchte 4711: 23 Stück“.<br>Wissen: „Unter 30 Stück und 2 Wochen Lieferzeit: heute nachbestellen.“", "exam": true}, {"topic": "Grundlagen WI", "front": "Informationssystem (IS) vs. Anwendungssystem (AS)?", "back": "AS = nur Technik: Anwendungssoftware + Basissoftware + Hardware (z. B. SAP S/4HANA).<br>IS = AS <b>+ Mensch<\/b>. Falle: „SAP ist ein IS“ ist falsch.", "exam": true}, {"topic": "Grundlagen WI", "front": "Die <b>4 Komponenten<\/b> des IS als sozio-technisches System?", "back": "Mensch · Aufgabe · Technik · eingebettet in die <b>Organisation<\/b>.<br>Sie beeinflussen sich gegenseitig → Software allein reicht nicht.", "exam": true}, {"topic": "Grundlagen WI", "front": "System vs. Modell?", "back": "System: verknüpfte Elemente mit Grenze zur Umwelt (Grenze hängt vom Zweck ab).<br>Modell: vereinfachte, zweckorientierte Abbildung, z. B. U-Bahn-Plan. Gut = passt zum Zweck, nicht = vollständig.", "exam": true}, {"topic": "Grundlagen WI", "front": "Verhaltens- vs. gestaltungsorientierte WI?", "back": "Verhaltensorientiert: beobachten, erklären (Warum akzeptieren Leute ein CRM? → UTAUT).<br>Gestaltungsorientiert: entwerfen, bauen, testen (Prototyp kassenloser Laden).", "exam": false}, {"topic": "IS-Arten", "front": "Wofür steht <b>ERP<\/b>? Was ist es?", "back": "<b>Enterprise Resource Planning<\/b>. Modulares, integriertes IS für alle operativen Tätigkeiten auf einer <b>gemeinsamen Datenbasis<\/b>. Beispiel: SAP S/4HANA.", "exam": true}, {"topic": "IS-Arten", "front": "Klassifikation nach <b>Reichweite<\/b>?", "back": "innerbetrieblich (Lohnabrechnung) · zwischenbetrieblich B2B (Lieferantenportal, EDI) · endkundenorientiert B2C (Onlineshop).<br>B2B + B2C = überbetrieblich.", "exam": true}, {"topic": "IS-Arten", "front": "Die <b>3 Anwendungszwecke<\/b> (Synonyme)?", "back": "Transaktion = Systems of <b>Record<\/b> (Auftrag buchen).<br>Entscheidungsunterstützung = Systems of <b>Insight<\/b> (BI-Dashboard).<br>Interaktion/Zusammenarbeit = Systems of <b>Engagement<\/b> (Teams, Chat).", "exam": true}, {"topic": "IS-Arten", "front": "CRM und SCM in einem Satz?", "back": "CRM: dauerhafte, profitable Kundenbeziehungen aufbauen; zuerst ein BWL-Konzept, von IS unterstützt (Salesforce).<br>SCM: ganze Lieferkette gestalten, dämpft den <b>Bullwhip-Effekt<\/b>.", "exam": true}, {"topic": "IS-Arten", "front": "Horizontale vs. vertikale Integration?", "back": "Horizontal: ein Auftrag läuft <b>ohne Neuerfassung<\/b> durch Vertrieb → Lager → Buchhaltung.<br>Vertikal: Daten werden <b>verdichtet<\/b> und nach oben gereicht (Umsatz je Monat fürs Management).", "exam": true}, {"topic": "IS-Arten", "front": "Was ist ein <b>Medienbruch<\/b>?", "back": "Daten wechseln das Medium und werden neu erfasst: Auftrag per E-Mail → in Excel abgetippt → in der Produktion neu eingegeben.<br>Folge: Doppelarbeit, Tippfehler, Verzögerung.", "exam": true}, {"topic": "EPK", "front": "Was ist ein Geschäftsprozess?", "back": "Sachlogisch-zeitliche Folge von Tätigkeiten. Startet mit einem Ereignis, endet mit einem Ergebnis, oft über Abteilungsgrenzen.<br>Arten: Kern-, Management-, Unterstützungsprozess.", "exam": true}, {"topic": "EPK", "front": "EPK-Grundelemente: Ereignis und Funktion?", "back": "Ereignis (Sechseck) = Zustand: „Auftrag eingegangen“.<br>Funktion (abgerundetes Rechteck) = Tätigkeit: „Auftrag prüfen“.", "exam": true}, {"topic": "EPK", "front": "Konnektoren XOR, OR, AND?", "back": "XOR: <b>genau ein<\/b> Pfad (vorrätig / nicht vorrätig).<br>OR (∨): <b>mindestens einer<\/b>, auch beide (Post und/oder E-Mail).<br>AND (∧): <b>alle<\/b> parallel.", "exam": true}, {"topic": "EPK", "front": "Die <b>6 EPK-Regeln<\/b>?", "back": "1 Start und Ende sind Ereignisse · 2 Ereignis und Funktion wechseln sich ab · 3 je eine Kante rein/raus · 4 nur Funktionen entscheiden · 5 zusammenführen wie aufgeteilt · 6 richtig benennen.", "exam": true}, {"topic": "EPK", "front": "Darf nach einem <b>Ereignis<\/b> ein XOR folgen?", "back": "Als <b>Split nein<\/b> – ein Ereignis kann nicht entscheiden (Regel 4). AND-Split ist erlaubt. Ein XOR-<b>Join<\/b> nach Ereignissen ist erlaubt.", "exam": true}, {"topic": "EPK", "front": "Warum kein XOR-Split mit AND-Join?", "back": "Nach XOR kommt nur <b>ein<\/b> Zweig an, das AND wartet auf <b>alle<\/b> → wartet ewig (Deadlock). Richtig: XOR-Split → XOR-Join (Regel 5).", "exam": true}, {"topic": "EPK", "front": "Typische EPK-Fehler erkennen?", "back": "Ereignis entscheidet (Regel 4) · Funktion folgt auf Funktion (Regel 2) · falscher Join (Regel 5) · Tätigkeit als Ereignis benannt (Regel 6) · Start ist eine Funktion (Regel 1).", "exam": true}, {"topic": "EPK", "front": "Prozessmodell vs. Datenmodell?", "back": "Prozessmodell (EPK) = <b>dynamisch<\/b>: Was passiert wann, wer macht es?<br>Datenmodell (ER) = <b>statisch<\/b>: Welche Daten gibt es? Vorgehen: Ist-Modell → Soll-Modell → Umsetzung.", "exam": true}, {"topic": "EPK", "front": "Was hängt die <b>eEPK<\/b> an Funktionen?", "back": "Organisationseinheit, Rolle, Informationsobjekt, Dokument, Anwendungssystem, Prozesswegweiser (Verweis auf Teilprozess).<br>Zuordnungen = Linien <b>ohne Pfeil<\/b>.", "exam": false}, {"topic": "ER-Modell", "front": "Die 3 <b>Anomalien<\/b> durch Redundanz?", "back": "Einfüge-: neue Leuchte, nie bestellt – wohin?<br>Änderungs-: Kunde zieht um, eine von drei Zeilen vergessen.<br>Lösch-: Auftrag gelöscht → Kunde Schulz KG ganz weg.", "exam": true}, {"topic": "ER-Modell", "front": "Stufen des Datenbankentwurfs?", "back": "1 konzeptionell → <b>ER-Modell<\/b> · 2 logisch → <b>Relationenmodell<\/b> (Primär-/Fremdschlüssel) · 3 physisch → SQL im DBMS.", "exam": true}, {"topic": "ER-Modell", "front": "Chen-Notation: Symbole?", "back": "Rechteck = Entity-Typ · Raute = Relationship · Ellipse = Attribut · unterstrichen = Schlüssel.<br>Faustregel: Entity-Typen sind Substantive, Relationships Verben.", "exam": true}, {"topic": "ER-Modell", "front": "Kardinalitäten mit Beispiel?", "back": "1:1 Mitarbeiter – PC · 1:n Mitarbeiter betreut Kunden · n:m Kunde bucht Reise.<br>Immer in <b>beide<\/b> Richtungen fragen!", "exam": true}, {"topic": "ER-Modell", "front": "1:n im Relationenmodell?", "back": "Fremdschlüssel auf die <b>n-Seite<\/b>: Auftrag(Auftrags-Nr, Datum, Kunden-Nr↑).<br>Merke: Der Fremdschlüssel steht dort, wo er nur einen Wert hat.", "exam": true}, {"topic": "ER-Modell", "front": "n:m im Relationenmodell?", "back": "<b>Eigene Relation<\/b>, beide Fremdschlüssel bilden zusammen den Primärschlüssel; Beziehungsattribute wandern mit: enthält(Auftrags-Nr↑, Artikel-Nr↑, Menge).<br>Falle: „n:m über einen Fremdschlüssel“ ist falsch.", "exam": true}, {"topic": "ER-Modell", "front": "Wohin gehört ein Attribut wie <b>Buchungsdatum<\/b> oder <b>Menge<\/b>?", "back": "An die <b>Raute<\/b> (Relationship), weil es erst zur Kombination gehört (Kunde + Reise, Auftrag + Artikel).", "exam": true}, {"topic": "ER-Modell", "front": "DB, DBMS, DBS?", "back": "DB = gespeicherter Datenbestand. DBMS = Software, die ihn verwaltet (MySQL). DBS = DB + DBMS.<br>Referentielle Integrität: kein Auftrag mit unbekannter Kundennummer.", "exam": true}, {"topic": "Geschäftsmodell & Organisation", "front": "Die <b>3 Elemente<\/b>, die die Anforderungen an ein IS bestimmen?", "back": "<b>Geschäftsmodell<\/b> · <b>Unternehmensaufbau<\/b> · <b>Geschäftsprozesse<\/b>.<br>„Erst das Unternehmen verstehen, dann das System beurteilen.“ (offizielle Beispielfrage)", "exam": true}, {"topic": "Geschäftsmodell & Organisation", "front": "Aufbauorganisation vs. Ablauforganisation?", "back": "Aufbau (Wo?): hierarchisches Gerüst, Abteilungen, wer ist wem unterstellt → Organigramm.<br>Ablauf (Wie?): die (abteilungsübergreifenden) Prozesse zur Leistungserstellung. (offizielle Beispielfrage)", "exam": true}, {"topic": "Geschäftsmodell & Organisation", "front": "Die <b>9 Felder<\/b> des Business Model Canvas?", "back": "Schlüsselpartner · Schlüsselaktivitäten · Schlüsselressourcen · Wertversprechen · Kundenbeziehungen · Kanäle · Kundensegmente · Kostenstruktur · Einnahmequellen.", "exam": true}, {"topic": "Geschäftsmodell & Organisation", "front": "Canvas Spotify: Wertversprechen, Kundensegmente, Einnahmen, Partner?", "back": "Wert: jede Musik jederzeit, Premium ohne Werbung · Segmente: Gratis-Hörer, Premium-Abonnenten, Werbekunden · Einnahmen: Abos, Werbung · Partner: Plattenfirmen, Künstler.", "exam": true}, {"topic": "Geschäftsmodell & Organisation", "front": "Transferaufgabe Canvas <b>Pokémon Go<\/b>: Was weißt du von der Folie?", "back": "Location-based Game mit GPS und Augmented Reality, über 1 Mrd. Downloads.<br>Erlösmodell: Freemium bzw. Free-to-play – Spielen gratis, Einnahmen durch Kauf von Spielwährung.<br>In der Klausur: Wertversprechen, Schlüsselpartner, Kundensegmente, Einnahmequellen mit je 2 Einträgen begründen.", "exam": true}, {"topic": "Geschäftsmodell & Organisation", "front": "4 Kernelemente eines Geschäftsmodells (Shafer)?", "back": "Kunden · Wertversprechen · Wertschöpfung · Erlösmodell.<br>Ein Geschäftsmodell = wie eine Organisation Werte schafft, vermittelt und erfasst.", "exam": true}, {"topic": "Geschäftsmodell & Organisation", "front": "Warum braucht die Sonnenschein AG ein CRM?", "back": "Viele Kunden buchen nur einmal. Feedback wird gesammelt, fließt aber nicht in den Newsletter (alle bekommen denselben).<br>Info entsteht im Kundenservice, entschieden wird im Marketing → integrierte Kundendaten nötig.", "exam": true}, {"topic": "Informationsmanagement", "front": "Lebenszyklus eines IS?", "back": "Planen → Beschaffen → Einführen → Betreiben.<br>Einführen = <b>Projekt<\/b> (einmalig). Betreiben = <b>Daueraufgabe<\/b>. Neuer Funktionswunsch = neues Projekt.", "exam": true}, {"topic": "Informationsmanagement", "front": "Die <b>3 Ebenen<\/b> des Informationsmanagements?", "back": "Strategisch: Infrastruktur als Ganzes planen (CRM ja/nein → Geschäftsleitung).<br>Administrativ: Projekt-, Lebenszyklusmanagement.<br>Operativ: Betrieb, Problemmanagement, Benutzerservice.", "exam": true}, {"topic": "Informationsmanagement", "front": "Standard- vs. Individualsoftware?", "back": "Standard: + günstig, schnell, erprobt · − nur Customizing, Abhängigkeit vom Anbieter.<br>Individual: + passt genau, Wettbewerbsvorteil · − teuer, dauert lange.<br>CRM → meist Standard.", "exam": true}, {"topic": "Informationsmanagement", "front": "Lastenheft vs. Pflichtenheft?", "back": "Lastenheft: Anforderungen des <b>Auftraggebers<\/b> (das Was), Grundlage der Lieferantenauswahl.<br>Pflichtenheft: wie der <b>Lieferant<\/b> es umsetzt. Merke: Lasten trägt der Kunde.", "exam": true}, {"topic": "Informationsmanagement", "front": "Projekt nach DIN 69901 + die <b>5 PM-Phasen<\/b>?", "back": "Projekt = Vorhaben mit <b>Einmaligkeit<\/b> der Bedingungen (Ziel, Zeit, Budget).<br>Phasen: Initialisieren → Definieren → Planen → Steuern → Abschließen.", "exam": true}, {"topic": "Informationsmanagement", "front": "Was heißt <b>SMART<\/b>?", "back": "Spezifisch · Messbar · Akzeptiert · Realistisch · Terminiert.<br>Beispiel: „CRM in 9 Monaten produktiv, max. 150 000 €“.", "exam": true}, {"topic": "Informationsmanagement", "front": "Scrum: Rollen und Ablauf?", "back": "Product Owner pflegt/priorisiert das Backlog · Scrum Master räumt Hindernisse weg · Developers organisieren sich selbst.<br>Sprint max. 1 Monat, Daily Scrum 15 Min., Ergebnis = Inkrement.", "exam": true}, {"topic": "Informationsmanagement", "front": "Stacey-Matrix: wann klassisch, wann agil?", "back": "Klare Anforderungen + bekannte Technik (einfach/kompliziert) → <b>klassisch<\/b>.<br>Unklar (komplex) → <b>agil<\/b> (Scrum). Chaotisch → erst ausprobieren.", "exam": true}, {"topic": "Informationsmanagement", "front": "Support-Level und SLA?", "back": "1st Level: Erstkontakt, Ticket · 2nd Level: erfahrener · 3rd Level: Spezialteams.<br>SLA regelt Leistung + Qualität (z. B. 99,5 % Verfügbarkeit, Antwort ≤ 4 Std.). Neue Funktionen regelt <b>kein<\/b> SLA.", "exam": true}, {"topic": "Informationsmanagement", "front": "Explizites vs. implizites Wissen?", "back": "Explizit: aufschreibbar (Handbuch, Schnittstellenbeschreibung).<br>Implizit: „klebrig“, schwer aufzuschreiben (Gespür der Expertin, wo der Fehler steckt).", "exam": false}, {"topic": "BI & Data Science", "front": "Objektiver Bedarf, subjektiver Bedarf, Nachfrage, Angebot?", "back": "Objektiv: was die <b>Aufgabe<\/b> erfordert · Subjektiv: was die Person für nötig hält · Nachfrage: was sie tatsächlich <b>anfragt<\/b> · Angebot: was verfügbar ist.<br>Push: System liefert · Pull: Nutzer holt.", "exam": true}, {"topic": "BI & Data Science", "front": "Aufbau eines BI-Systems?", "back": "OLTP-Systeme + externe Daten → <b>ETL<\/b> (extrahieren, transformieren, laden) → <b>Data Warehouse<\/b> (aktuell + historisch, aggregiert) → Data Marts → Berichte.", "exam": true}, {"topic": "BI & Data Science", "front": "Die 4 Transformationsschritte im ETL?", "back": "Bereinigung (Datumsformat) · Harmonisierung („Spanien“ = „ES“) · Verdichtung (Umsatz je Produktgruppe) · Anreicherung (Deckungsbeitrag berechnen).", "exam": true}, {"topic": "BI & Data Science", "front": "Die <b>4 Analysestufen<\/b>?", "back": "1 deskriptiv: Was ist passiert? · 2 diagnostisch: Warum? · 3 prädiktiv: Was wird passieren? · 4 präskriptiv: Was sollen wir tun?<br>BI vor allem 1–2, Data Science 3–4.", "exam": true}, {"topic": "BI & Data Science", "front": "Die <b>6 CRISP-DM<\/b>-Phasen?", "back": "Business Understanding → Data Understanding → Data Preparation → Modelling → Evaluation → Deployment.<br>Mit Rücksprüngen, kein Wasserfall.", "exam": true}, {"topic": "BI & Data Science", "front": "Regression, Klassifikation oder Clustering?", "back": "Zielspalte mit <b>Zahl<\/b> → Regression (Buchungen Juli 2027).<br>Zielspalte mit <b>Kategorie<\/b> → Klassifikation (storniert ja/nein).<br><b>Keine<\/b> Zielspalte → Clustering (Kundengruppen).", "exam": true}, {"topic": "Digitale Transformation & GenAI", "front": "Die <b>3 Stufen<\/b> bis zur Digitalen Transformation?", "back": "1 Informationen digitalisieren (Katalog als PDF) → 2 Prozesse digitalisieren (Buchung landet ohne Abtippen im CRM) → 3 Digitale Transformation: <b>Geschäftsmodell<\/b> ändert sich (App vermittelt Ausflüge und verdient mit).", "exam": true}, {"topic": "Digitale Transformation & GenAI", "front": "Die <b>4 Kräfte<\/b> der Digitalen Transformation?", "back": "Digitale Daten · Automatisierung · Vernetzung · Digitaler Kundenzugang (Portale buchen am Veranstalter vorbei).", "exam": true}, {"topic": "Digitale Transformation & GenAI", "front": "Die 3 Geschäftsmodellmuster mit Beispiel?", "back": "Freemium: Basis gratis (Spotify) · Plattform: bringt Anbieter und Kunden zusammen (Etsy, Airbnb) · Produkt als Service: Nutzung statt Besitz (Licht als Service, Druckluft je Menge).", "exam": true}, {"topic": "Digitale Transformation & GenAI", "front": "Chatbot, RAG, Agent – Unterschied?", "back": "Chatbot: antwortet aus dem Training.<br>RAG: sucht Stellen in eigenen Dokumenten und gibt sie im Prompt mit (Modell wird <b>nicht<\/b> neu trainiert).<br>Agent: plant und <b>handelt<\/b> mit Werkzeugen (bucht um).", "exam": true}, {"topic": "Digitale Transformation & GenAI", "front": "LLM: Token, Halluzination, Bausteine eines Agenten?", "back": "Token = Textbaustein („Reise“ + „ziel“). Halluzination = plausibel, aber falsch.<br>Agent = Sprachmodell + Anweisung/Prompt + Werkzeuge. Haftung bleibt beim Unternehmen (Air Canada).", "exam": true}, {"topic": "Digitale Transformation & GenAI", "front": "IoT und Industrie 4.0?", "back": "IoT: physische Objekte über Internettechnik vernetzt (Disney MagicBand).<br>Industrie 4.0: IoT in der Fertigung, cyber-physische Systeme, Ziel: Losgröße 1 zu Kosten der Massenfertigung.", "exam": false}, {"topic": "ML-Praxis (Tag 3)", "front": "Train/Test-Split und Overfitting? (Tag 3, nicht klausurrelevant)", "back": "1 000 Buchungen → 800 Training, 200 Test.<br>Overfitting: im Training sehr gut, auf neuen Daten schlecht (auswendig gelernt).", "exam": false}], "quiz": [{"topic": "IS-Arten", "q": "Wofür steht im Kontext der Informationssysteme die Abkürzung <b>ERP<\/b>?", "options": ["Entity Relationship Program", "Enterprise Resource Planning", "Ecological Resource Planning", "Equal Relationship Program"], "correct": 1, "explain": "Offizielle Beispielaufgabe: Enterprise Resource Planning, das integrierte IS mit gemeinsamer Datenbasis."}, {"topic": "Grundlagen WI", "q": "Welche vier Komponenten hat ein IS als sozio-technisches System?", "options": ["Daten, Information, Wissen, Weisheit", "Hardware, Software, Daten, Netzwerk", "Mensch, Aufgabe, Technik, Organisation", "Konzeption, Entwicklung, Nutzung, Wartung"], "correct": 2, "explain": "Mensch, Aufgabe, Technik, eingebettet in die Organisation. D ist die Mertens-Definition der WI."}, {"topic": "Grundlagen WI", "q": "„SAP S/4HANA ist ein Informationssystem.“ Stimmt das?", "options": ["Ja, weil es Informationen verarbeitet", "Nein, es ist ein Anwendungssystem; erst mit Menschen entsteht ein IS", "Ja, weil es ein ERP-System ist", "Nein, es ist nur Basissoftware"], "correct": 1, "explain": "Software + Hardware = Anwendungssystem. IS = AS + Mensch (sozio-technisch auch Aufgabe, Organisation)."}, {"topic": "Grundlagen WI", "q": "Welches Beispiel liegt auf der Stufe <b>Wissen<\/b>?", "options": ["„4711 · 23“", "„Lagerbestand Leuchte 4711: 23 Stück“", "„Leuchte 4711“", "„Unter 30 Stück: heute nachbestellen“"], "correct": 3, "explain": "Wissen ermöglicht Handeln. A und C sind Daten, B ist Information."}, {"topic": "IS-Arten", "q": "Ein Auftrag läuft ohne Neuerfassung durch Vertrieb, Lager und Buchhaltung. Was ist das?", "options": ["Horizontale Integration", "Vertikale Integration", "Medienbruch", "Bullwhip-Effekt"], "correct": 0, "explain": "Horizontal = entlang des Prozesses. Vertikal = Daten verdichten und nach oben reichen."}, {"topic": "IS-Arten", "q": "Welcher Begriff ist ein Synonym für Entscheidungsunterstützungssysteme?", "options": ["Systems of Record", "Systems of Engagement", "OLTP-Systeme", "Systems of Insight"], "correct": 3, "explain": "Record = Transaktion, Insight = Entscheidung, Engagement = Interaktion."}, {"topic": "EPK", "q": "Welche Benennung passt zu einem <b>Ereignis<\/b>?", "options": ["„Rechnung erstellen“", "„Rechnung erstellt“", "„Buchhaltung“", "„Rechnungserstellung durch Buchhaltung“"], "correct": 1, "explain": "Ereignisse sind Zustände („erstellt“), Funktionen Tätigkeiten („erstellen“). „Buchhaltung“ ist eine Organisationseinheit."}, {"topic": "EPK", "q": "Die Rechnung kann per Post, per E-Mail oder auf beiden Wegen verschickt werden. Welcher Konnektor?", "options": ["OR (∨)", "XOR", "AND (∧)", "kein Konnektor, zwei Kanten reichen"], "correct": 0, "explain": "Mindestens einer, auch beide = inklusives Oder. XOR schließt „beide“ aus; zwei Kanten ohne Konnektor verletzen Regel 3."}, {"topic": "EPK", "q": "Direkt nach dem Ereignis „Kundenauftrag eingegangen“ folgt ein XOR-Split. Welche Regel ist verletzt?", "options": ["Regel 1: Start und Ende sind Ereignisse", "Regel 6: richtig benennen", "Regel 4: nur Funktionen entscheiden", "Keine, das ist erlaubt"], "correct": 2, "explain": "Ein Ereignis kann nicht entscheiden. Erst eine Funktion wie „Auftrag prüfen“, dann XOR."}, {"topic": "EPK", "q": "Ein XOR-Split wird mit einem AND-Join zusammengeführt. Was passiert?", "options": ["Alles in Ordnung, beide Pfade laufen parallel", "Deadlock: das AND wartet ewig auf den zweiten Pfad", "Der Prozess endet sofort", "Das AND wird automatisch zum OR"], "correct": 1, "explain": "Nach XOR kommt nur ein Zweig an, AND wartet auf alle. Regel 5: XOR-Split → XOR-Join."}, {"topic": "EPK", "q": "Welche Aussage über eine EPK ist richtig?", "options": ["Sie zeigt, welche Daten es gibt und wie sie zusammenhängen", "Sie beginnt meist mit einer Funktion", "Funktionen folgen direkt aufeinander", "Sie beginnt und endet mit einem Ereignis"], "correct": 3, "explain": "Regel 1. A beschreibt das Datenmodell (ER), B und C verletzen Regel 1 und 2."}, {"topic": "ER-Modell", "q": "Wie wird eine <b>n:m<\/b>-Beziehung im Relationenmodell abgebildet?", "options": ["Fremdschlüssel auf der n-Seite", "Fremdschlüssel auf der 1-Seite", "Eigene Relation mit beiden Fremdschlüsseln als gemeinsamem Primärschlüssel", "Gar nicht, n:m ist verboten"], "correct": 2, "explain": "Ein einzelner Fremdschlüssel reicht nur bei 1:n und 1:1. Bei n:m braucht es eine eigene Relation."}, {"topic": "ER-Modell", "q": "Kunde (1) erteilt (n) Auftrag. Wohin kommt der Fremdschlüssel?", "options": ["Kunden-Nr. in die Relation Auftrag", "Auftrags-Nr. in die Relation Kunde", "In eine eigene Relation „erteilt“", "In beide Relationen"], "correct": 0, "explain": "Fremdschlüssel auf die n-Seite. In Kunde müsste sonst eine Liste von Aufträgen stehen."}, {"topic": "ER-Modell", "q": "Ein Auftrag wird gelöscht – dabei verschwindet die einzige Info über den Kunden Schulz KG. Welche Anomalie?", "options": ["Einfügeanomalie", "Änderungsanomalie", "Integritätsanomalie", "Löschanomalie"], "correct": 3, "explain": "Beim Löschen gehen ungewollt andere Informationen verloren."}, {"topic": "ER-Modell", "q": "Wie wird ein Relationship (Beziehungstyp) im Chen-ER-Modell gezeichnet?", "options": ["Rechteck", "Raute", "Ellipse", "Sechseck"], "correct": 1, "explain": "Rechteck = Entity-Typ, Ellipse = Attribut, Sechseck = EPK-Ereignis."}, {"topic": "Geschäftsmodell & Organisation", "q": "Welche 3 Elemente nehmen Einfluss auf die Anforderungen an ein IS?", "options": ["Hardware, Software, Netzwerk", "Geschäftsmodell, Unternehmensaufbau, Prozesse", "Budget, Zeit, Personal", "Lastenheft, Pflichtenheft, SLA"], "correct": 1, "explain": "Offizielle Beispielfrage. Anforderungen kommen nicht aus der verfügbaren Technik."}, {"topic": "Geschäftsmodell & Organisation", "q": "Was legt fest, <b>wer wem unterstellt<\/b> ist?", "options": ["Ablauforganisation", "Geschäftsprozess", "Aufbauorganisation", "Business Model Canvas"], "correct": 2, "explain": "Weisungsbeziehungen = Aufbauorganisation (Organigramm). Die Ablauforganisation regelt die Prozesse."}, {"topic": "Geschäftsmodell & Organisation", "q": "In welchem Canvas-Feld steht „Wofür sind Kunden wirklich bereit zu zahlen?“", "options": ["Wertversprechen", "Kostenstruktur", "Kundenbeziehungen", "Einnahmequellen"], "correct": 3, "explain": "Leitfrage des Feldes Einnahmequellen. Bei Pokémon Go z. B. der Kauf von Spielwährung."}, {"topic": "Informationsmanagement", "q": "Welche Tätigkeit ist nach DIN 69901 ein <b>Projekt<\/b>?", "options": ["Die Server ziehen in die Cloud um", "Der Helpdesk beantwortet Tickets", "Die monatliche Gehaltsabrechnung", "Dienstags Sicherheitsupdates einspielen"], "correct": 0, "explain": "Einmalig, mit Ziel und Begrenzung. Die anderen sind Routine, also Daueraufgaben."}, {"topic": "Informationsmanagement", "q": "Welches Dokument enthält die Anforderungen des Auftraggebers und ist Grundlage der Lieferantenauswahl?", "options": ["Pflichtenheft", "Service Level Agreement", "Lastenheft", "Projektauftrag"], "correct": 2, "explain": "Lastenheft = das Was des Kunden. Das Pflichtenheft schreibt der Lieferant."}, {"topic": "Informationsmanagement", "q": "Welche Aussage zu Scrum ist richtig?", "options": ["Der gesamte Projektplan steht vor dem Start fest", "Der Product Owner pflegt und priorisiert das Product Backlog", "Der Scrum Master teilt den Developers die Aufgaben zu", "Ein Sprint dauert mindestens drei Monate"], "correct": 1, "explain": "Scrum plant rollierend; der Scrum Master räumt Hindernisse weg; ein Sprint dauert höchstens einen Monat."}, {"topic": "Informationsmanagement", "q": "Was ist <b>Open Source<\/b>?", "options": ["Ein Betriebsmodell wie SaaS", "Software, die nur On-Premise laufen darf", "Ein Vertrag über Service-Qualität", "Eine Lizenzform mit offenem Quellcode; Betrieb selbst oder in der Cloud möglich"], "correct": 3, "explain": "Klassische Falle: Open Source ist eine Lizenzform, kein Betriebsmodell."}, {"topic": "BI & Data Science", "q": "„Wie viele Buchungen gibt es nächsten Juli für Kreta?“ Welche Methode?", "options": ["Klassifikation", "Regression", "Clustering", "Deskriptiver Bericht"], "correct": 1, "explain": "Die Zielspalte ist eine Zahl → Regression. Klassifikation wäre z. B. „storniert ja/nein“."}, {"topic": "BI & Data Science", "q": "„Warum sind die Buchungen für Spanien gesunken?“ Welche Analysestufe?", "options": ["deskriptiv", "prädiktiv", "diagnostisch", "präskriptiv"], "correct": 2, "explain": "Warum? = diagnostisch (BI mit OLAP, Drill-down). Was ist passiert? wäre deskriptiv."}, {"topic": "BI & Data Science", "q": "Eine Managerin fragt bei der IT einen Bericht an. Was ist das?", "options": ["Objektiver Informationsbedarf", "Subjektiver Informationsbedarf", "Informationsangebot", "Informationsnachfrage"], "correct": 3, "explain": "Was tatsächlich angefragt wird = Nachfrage. Objektiv ist, was die Aufgabe erfordert."}, {"topic": "Digitale Transformation & GenAI", "q": "Die Sonnenschein AG stellt ihren Katalog als PDF online. Welche Stufe ist das?", "options": ["Stufe 1: Informationen digitalisieren", "Stufe 2: Prozesse digitalisieren", "Stufe 3: Digitale Transformation", "Industrie 4.0"], "correct": 0, "explain": "Nur das Medium ändert sich. Transformation ändert das Geschäftsmodell."}, {"topic": "Digitale Transformation & GenAI", "q": "Was macht <b>RAG<\/b>?", "options": ["Es trainiert das Sprachmodell mit den Firmendokumenten neu", "Es bucht selbstständig Flüge um", "Es sucht passende Stellen in eigenen Dokumenten und gibt sie im Prompt mit", "Es verhindert Halluzinationen garantiert"], "correct": 2, "explain": "RAG verändert das Modell nicht. Neu trainieren wäre Feinabstimmung, Handeln macht ein Agent."}, {"topic": "Digitale Transformation & GenAI", "q": "Ein Kompressorhersteller berechnet je gelieferter Menge Druckluft statt Anlagen zu verkaufen. Welches Muster?", "options": ["Freemium", "Plattform", "Digitaler Kundenzugang", "Produkt als Service"], "correct": 3, "explain": "Nutzung bzw. Ergebnis statt Besitz (Kaeser „Sigma Air Utility“)."}]}, "prog": {"cards": [{"topic": "VL1 Grundlagen", "front": "Was ist ein <b>Algorithmus<\/b>? Welche 4 Anforderungen gibt es?", "back": "Eine Schrittfolge, die ein Problem systematisch löst, unabhängig von der Sprache.<br>Anforderungen: Endlichkeit, Ausführbarkeit, Korrektheit, Effizienz.", "exam": true}, {"topic": "VL1 Grundlagen", "front": "<b>determiniert<\/b> vs. <b>deterministisch<\/b>", "back": "determiniert: gleiche Eingabe → immer <b>gleiches Ergebnis<\/b>.<br>deterministisch: der <b>nächste Schritt<\/b> ist immer eindeutig (es geht um den Weg).", "exam": true}, {"topic": "VL1 Grundlagen", "front": "Stack vs. Queue", "back": "Stack = LIFO (last in, first out), z. B. Zurück-Taste im Browser.<br>Queue = FIFO (first in, first out), z. B. Druckaufträge.", "exam": true}, {"topic": "VL1 Grundlagen", "front": "Interpreter, Compiler, Zwischencode: Wo steht Python?", "back": "Interpreter: Zeile für Zeile. Compiler: vorab alles in Maschinencode (C, Rust).<br>Python ist eine <b>Zwischencode-Sprache<\/b>: erst Bytecode, dann führt die VM ihn aus.", "exam": true}, {"topic": "VL1 Grundlagen", "front": "Wofür sind <code>uv<\/code>, <code>ruff<\/code> und <code>ty<\/code>?", "back": "uv: Python/Projekte/Pakete verwalten, starten (<code>uv run hallo.py<\/code>).<br>ruff: Formatierung und Stil. ty: prüft Datentypen, ohne das Programm auszuführen.", "exam": true}, {"topic": "VL2 Datentypen & Operatoren", "front": "<code>/<\/code> vs. <code>//<\/code> vs. <code>%<\/code>", "back": "<code>7 / 2<\/code> → 3.5 (immer float)<br><code>7 // 2<\/code> → 3 (abrunden)<br><code>7 % 2<\/code> → 1 (Rest)", "exam": true}, {"topic": "VL2 Datentypen & Operatoren", "front": "Was ergibt <code>-7 // 2<\/code>?", "back": "<b>-4<\/b>. <code>//<\/code> rundet ab, also zur kleineren Zahl hin (−3.5 → −4). In Java käme −3 heraus.", "exam": true}, {"topic": "VL2 Datentypen & Operatoren", "front": "Rangfolge der Operatoren (kurz)", "back": "Klammern → <code>**<\/code> → Punkt (* / // %) → Strich (+ −) → Vergleiche → not → and → or.<br>Beispiel: <code>2 + 3 * 4<\/code> → 14.", "exam": true}, {"topic": "VL2 Datentypen & Operatoren", "front": "Warum ist <code>0.1 + 0.2 == 0.3<\/code> False?", "back": "Floats sind ungenau: <code>0.1 + 0.2<\/code> ergibt 0.30000000000000004. Für Geld nimmt man <code>Decimal(\"19.99\")<\/code>.", "exam": true}, {"topic": "VL2 Datentypen & Operatoren", "front": "String-Index und Slicing bei <code>text = \"Hallo\"<\/code>", "back": "<code>text[0]<\/code> → H, <code>text[-1]<\/code> → o, <code>text[1:3]<\/code> → al (Stopp-Index nicht dabei).", "exam": true}, {"topic": "VL2 Datentypen & Operatoren", "front": "f-String mit 2 Nachkommastellen", "back": "<code>preis = 12.5<\/code><br><code>f\"Preis: {preis:.2f} €\"<\/code> → Preis: 12.50 €", "exam": true}, {"topic": "VL2 Datentypen & Operatoren", "front": "Die 4 Fehlerarten", "back": "Syntaxfehler (<code>print(\"Hi\"<\/code>), Typfehler (<code>\"Alter: \" + 36<\/code>), Laufzeitfehler (Division durch 0), Logikfehler (<code>5 + 2 / 2<\/code> → 6.0 statt 3.5, keine Meldung).", "exam": true}, {"topic": "VL3 if / match / Logik", "front": "if / elif / else: Wie viele Zweige laufen?", "back": "Genau <b>einer<\/b>: der erste Treffer. Danach prüft Python die anderen nicht mehr.<br>Darum Bereiche richtig sortieren (z. B. erst <code>&gt;= 90<\/code>, dann <code>&gt;= 50<\/code>).", "exam": true}, {"topic": "VL3 if / match / Logik", "front": "<code>match<\/code> – was ist besonders?", "back": "Vergleicht einen Wert mit festen Fällen, erster Treffer gewinnt, kein break nötig.<br><code>case \"A\" | \"B\":<\/code> = mehrere Werte, <code>case _:<\/code> = Standardfall. Bereiche (<code>&lt; 3<\/code>) gehen nicht.", "exam": true}, {"topic": "VL3 if / match / Logik", "front": "Welche Werte gelten in einer Bedingung als falsch?", "back": "<code>False, None, 0, 0.0, \"\", []<\/code>.<br>Alles andere ist wahr, auch <code>\"0\"<\/code>, <code>-1<\/code> und <code>[0]<\/code>.", "exam": true}, {"topic": "VL3 if / match / Logik", "front": "Kurzschluss bei <code>and<\/code>", "back": "Ist die linke Seite False, wird die rechte gar nicht ausgewertet.<br><code>anzahl &gt; 0 and summe / anzahl &gt; 100<\/code> → kein ZeroDivisionError. Absicherung nach vorn!", "exam": true}, {"topic": "VL3 Schleifen & range", "front": "Welche Zahlen liefert <code>range(1, 6)<\/code>?", "back": "1 2 3 4 5. <b>Start ist dabei, Stopp nicht.<\/b> Für 1 bis n: <code>range(1, n + 1)<\/code>.", "exam": true}, {"topic": "VL3 Schleifen & range", "front": "<code>range(5)<\/code>, <code>range(2, 11, 2)<\/code>, <code>range(5, 0, -1)<\/code>", "back": "range(5) → 0 1 2 3 4<br>range(2, 11, 2) → 2 4 6 8 10<br>range(5, 0, -1) → 5 4 3 2 1", "exam": true}, {"topic": "VL3 Schleifen & range", "front": "Wie liest du eine for-Schleife Runde für Runde? (Beispiel Summe)", "back": "<code>summe = 0<\/code><br><code>for i in range(1, 4): summe += i<\/code><br>Runde 1: i=1, summe=1 · Runde 2: i=2, summe=3 · Runde 3: i=3, summe=6 → <b>6<\/b>.", "exam": true}, {"topic": "VL3 Schleifen & range", "front": "while vs. for", "back": "for: über eine Folge, Anzahl bekannt (<code>for x in liste<\/code>).<br>while: solange die Bedingung wahr ist, Anzahl unbekannt (z. B. bis sich Geld verdoppelt). Zähler ändern, sonst Endlosschleife!", "exam": true}, {"topic": "VL3 Schleifen & range", "front": "break vs. continue", "back": "break: Schleife <b>sofort verlassen<\/b>.<br>continue: nur <b>diesen Durchlauf<\/b> überspringen, weiter mit dem nächsten Wert.", "exam": true}, {"topic": "VL3 Listen", "front": "Wichtige Listen-Befehle bei <code>noten = [2, 1, 3]<\/code>", "back": "<code>noten.append(4)<\/code> → [2, 1, 3, 4]<br><code>len(noten)<\/code> → 4, <code>sum<\/code> → 10, <code>noten[-1]<\/code> → 4", "exam": true}, {"topic": "VL3 Listen", "front": "<code>sorted(liste)<\/code> – ändert das die Liste?", "back": "Nein. <code>sorted<\/code> liefert eine <b>sortierte Kopie<\/b>, das Original bleibt gleich.", "exam": true}, {"topic": "VL3 Listen", "front": "Die Falle <code>[[0] * 4] * 3<\/code>", "back": "<code>* 3<\/code> kopiert nur die <b>Verweise<\/b>: 3 Pfeile auf EINE Zeile.<br><code>m[0][0] = 9<\/code> → [[9,0,0,0], [9,0,0,0], [9,0,0,0]]. Richtig: jede Zeile in einer Schleife mit append neu bauen.", "exam": true}, {"topic": "VL3 Listen", "front": "<code>b = a<\/code> bei Listen", "back": "Kopiert nichts! Zwei Namen, eine Liste. <code>b.append(4)<\/code> ändert auch <code>a<\/code>.", "exam": true}, {"topic": "VL4 Funktionen", "front": "<b>Parameter<\/b> vs. <b>Argument<\/b>", "back": "Parameter: Platzhalter in der Definition (<code>def f(name)<\/code>).<br>Argument: konkreter Wert beim Aufruf (<code>f(\"Bob\")<\/code>).", "exam": true}, {"topic": "VL4 Funktionen", "front": "<code>print<\/code> vs. <code>return<\/code>", "back": "return gibt den Wert an den Aufrufer zurück. print zeigt ihn nur an.<br>Eine Funktion ohne return liefert <b>None<\/b>.", "exam": true}, {"topic": "VL4 Funktionen", "front": "break vs. return", "back": "break verlässt nur die Schleife, der Rest der Funktion läuft weiter.<br>return beendet die <b>ganze Funktion<\/b> sofort.", "exam": true}, {"topic": "VL4 Funktionen", "front": "LEGB-Regel", "back": "Python sucht Namen von innen nach außen: Local → Enclosing → Global → Built-in. Erster Treffer gewinnt.", "exam": true}, {"topic": "VL4 Funktionen", "front": "Warum gibt <code>zaehler += 1<\/code> in einer Funktion einen Fehler?", "back": "Eine Zuweisung macht <code>zaehler<\/code> lokal. Dann wird gelesen, bevor ein Wert da ist → <b>UnboundLocalError<\/b>. Besser: als Parameter übergeben und mit return zurückgeben.", "exam": true}, {"topic": "VL4 Funktionen", "front": "Liste in einer Funktion ändern: sieht der Aufrufer das?", "back": "<code>liste[0] = 99<\/code> oder <code>append<\/code>: <b>ja<\/b> (gleiches Objekt).<br><code>liste = [7, 7]<\/code>: nein, nur lokale Neubindung.", "exam": true}, {"topic": "VL4 Funktionen", "front": "Falle: Liste als Standardwert <code>def f(x, liste=[])<\/code>", "back": "Die Liste wird einmal erzeugt und von allen Aufrufen geteilt: f(1) → [1], f(2) → [1, 2].<br>Richtig: <code>liste=None<\/code> und im Rumpf neu anlegen.", "exam": true}, {"topic": "VL4 Funktionen", "front": "Gibt es Überladung in Python?", "back": "Nein. Ein zweites <code>def<\/code> mit gleichem Namen überschreibt das erste. Stattdessen Standardwerte (<code>satz=0.19<\/code>) oder <code>*args<\/code>.", "exam": true}, {"topic": "VL4 Funktionen", "front": "Imperativ vs. applikativ", "back": "Imperativ: „Wie mache ich es?“ – Anweisungen, Variablen ändern sich, Schleifen.<br>Applikativ: „Was ist das Ergebnis?“ – Funktionen anwenden, Rekursion, keine Nebenwirkungen.", "exam": true}, {"topic": "VL4 Rekursion", "front": "Die 2 Pflichtteile einer Rekursion", "back": "1. Abbruchbedingung (Basisfall), z. B. <code>if n == 0: return 1<\/code>.<br>2. Rekursiver Aufruf mit kleinerem Argument: <code>n * fakultaet(n - 1)<\/code>.", "exam": true}, {"topic": "VL4 Rekursion", "front": "Aufrufstapel bei <code>fakultaet(3)<\/code>", "back": "Abstieg: 3·f(2) → 2·f(1) → 1·f(0) → Basisfall 1.<br>Aufstieg: 1·1 = 1, 2·1 = 2, 3·2 = <b>6<\/b>.", "exam": true}, {"topic": "VL4 Rekursion", "front": "Was passiert bei <code>fakultaet(-1)<\/code> mit <code>if n == 0<\/code>?", "back": "n wird −1, −2, … und erreicht nie 0 → <b>RecursionError<\/b> (ca. 1000 Rahmen). Robuster: <code>if n &lt;= 0<\/code>.", "exam": true}, {"topic": "VL5 Klassen & Objekte", "front": "Klasse vs. Objekt", "back": "Klasse = Bauplan (<code>class Konto:<\/code>).<br>Objekt/Instanz = konkretes Exemplar (<code>anna = Konto(\"Anna\", 100)<\/code>).", "exam": true}, {"topic": "VL5 Klassen & Objekte", "front": "Was macht <code>__init__<\/code> und was ist <code>self<\/code>?", "back": "__init__ = Konstruktor, läuft automatisch beim Erzeugen und setzt die Attribute (<code>self.kontostand = kontostand<\/code>).<br>self = das Objekt selbst (Java: this).", "exam": true}, {"topic": "VL5 Klassen & Objekte", "front": "Warum hat <code>einzahlen(self, betrag)<\/code> zwei Parameter, aber <code>anna.einzahlen(50)<\/code> nur ein Argument?", "back": "Python macht daraus <code>Konto.einzahlen(anna, 50)<\/code>. Das Objekt vor dem Punkt wird zu self.", "exam": true}, {"topic": "VL5 Klassen & Objekte", "front": "<code>__str__<\/code> vs. <code>__repr__<\/code>", "back": "__str__: lesbarer Text für Menschen, nutzt <code>print(obj)<\/code>.<br>__repr__: für Entwickler, sieht aus wie der Aufruf, z. B. <code>Konto('Anna', 100)<\/code>; nutzt die Liste.", "exam": true}, {"topic": "VL5 Klassen & Objekte", "front": "<code>konto2 = konto1<\/code> – wie viele Konten?", "back": "<b>Eins.<\/b> Nur ein zweites Namensschild. <code>konto1 is konto2<\/code> → True.", "exam": true}, {"topic": "VL5 Klassen & Objekte", "front": "Klassenattribut-Falle: <code>ben.anzahl_konten += 1<\/code>", "back": "Legt ein neues <b>Instanzattribut<\/b> nur bei ben an. Der Zähler in der Klasse bleibt gleich. Immer über den Klassennamen ändern: <code>Konto.anzahl_konten += 1<\/code>.", "exam": true}, {"topic": "VL5 Kapselung & @dataclass", "front": "Was ist eine <b>Property<\/b>?", "back": "Eine Methode, die man wie ein Attribut benutzt, ohne Klammern: <code>lena.jahresgehalt<\/code> → 50400 bei 4200 im Monat.<br>Ohne Setter nur lesbar: Zuweisung → AttributeError.", "exam": true}, {"topic": "VL5 Kapselung & @dataclass", "front": "<code>_kontostand<\/code> – ist das geschützt?", "back": "Nein, nur eine <b>Konvention<\/b> („intern“). Python prüft nichts. <code>__x<\/code> wird zu <code>_Klasse__x<\/code> (Name Mangling), schützt aber auch nicht.", "exam": true}, {"topic": "VL5 Kapselung & @dataclass", "front": "Was erzeugt <code>@dataclass<\/code>?", "back": "<code>__init__<\/code>, <code>__repr__<\/code> und <code>__eq__<\/code>. Dann vergleicht <code>==<\/code> die <b>Werte<\/b>. Ohne: == vergleicht nur, ob es dasselbe Objekt ist.", "exam": true}, {"topic": "VL5 Kapselung & @dataclass", "front": "Hat-ein vs. Ist-ein", "back": "Hat-ein (Komposition): Objekt als Attribut, z. B. Konto hat Kunde.<br>Ist-ein (Vererbung): Sparkonto ist ein Konto → <code>class Sparkonto(Konto)<\/code>.", "exam": true}, {"topic": "VL5 Kapselung & @dataclass", "front": "Die 4 OOP-Prinzipien", "back": "Kapselung, Vererbung, Polymorphismus, Abstraktion.", "exam": true}, {"topic": "VL6 Vererbung & super()", "front": "Wozu <code>super().__init__(...)<\/code>?", "back": "Legt den Teil der Oberklasse an (z. B. name, kontostand). Python ruft ihn <b>nicht<\/b> von selbst auf. Vergessen → später AttributeError, ty meldet nichts.", "exam": true}, {"topic": "VL6 Vererbung & super()", "front": "Was ist <b>Überschreiben<\/b>?", "back": "Die Unterklasse schreibt eine Methode mit gleichem Namen und gleichen Parametern neu. Mit <code>super().methode()<\/code> kann sie die alte Version mitbenutzen.", "exam": true}, {"topic": "VL6 Vererbung & super()", "front": "Überladen vs. Überschreiben", "back": "Überladen (gleiche Klasse, andere Parameter): gibt es in Python <b>nicht<\/b>.<br>Überschreiben (Unterklasse, gleiche Parameter): gibt es.", "exam": true}, {"topic": "VL6 Vererbung & super()", "front": "Methodensuche (MRO)", "back": "Erst in der Klasse des Objekts, dann in der Oberklasse, zuletzt in <code>object<\/code>. <code>Manager.__mro__<\/code> → Manager, Mitarbeiter, object.", "exam": true}, {"topic": "VL6 Vererbung & super()", "front": "<code>isinstance<\/code> vs. <code>type(x) is<\/code>", "back": "Bei <code>anna = Sparkonto(...)<\/code>:<br><code>isinstance(anna, Konto)<\/code> → True (zählt Oberklassen mit)<br><code>type(anna) is Konto<\/code> → False (nur genaue Klasse)", "exam": true}, {"topic": "VL6 Polymorphie & Abstraktion", "front": "Was ist <b>Polymorphie<\/b>?", "back": "Dieselbe Zeile Code macht je nach Objekt etwas anderes: <code>zahlungsart.bezahlen(betrag)<\/code> bucht bei Kreditkarte ab, bei Rechnungskauf schreibt es eine Rechnung.", "exam": true}, {"topic": "VL6 Polymorphie & Abstraktion", "front": "Was ist <b>Duck Typing<\/b>?", "back": "Python prüft beim Ausführen nur, ob die Methode da ist, nicht die Klasse. ty meldet trotzdem <code>invalid-argument-type<\/code>, wenn die Typangabe nicht passt.", "exam": true}, {"topic": "VL6 Polymorphie & Abstraktion", "front": "Abstrakte Klasse: wie und wozu?", "back": "<code>class Zahlungsart(ABC)<\/code> + <code>@abstractmethod<\/code>. Legt Pflichtmethoden fest. Objekt erzeugen → <b>TypeError<\/b> schon beim Erzeugen.", "exam": true}, {"topic": "VL6 Polymorphie & Abstraktion", "front": "Abstrakte Klasse vs. Fähigkeit (Interface)", "back": "Abstrakte Klasse: „ist ein“, darf Attribute und __init__ haben, eine pro Klasse.<br>Fähigkeit: „kann …“, nur abstrakte Methoden, beliebig viele: <code>class Rechnung(Dokument, Druckbar, Versendbar)<\/code>.", "exam": true}, {"topic": "VL7 Kaffeeshop", "front": "Kaffeeshop Stufe 1: Welche Klassen und Beziehungen?", "back": "Lager <i>hat viele<\/i> Produkte, Warenkorb <i>hat einen<\/i> Kunden und <i>viele<\/i> Positionen, Position <i>hat ein<\/i> Produkt + Menge. Nur Hat-ein, keine Vererbung.", "exam": true}, {"topic": "Fehlermeldungen", "front": "IndexError, NameError, TypeError – typische Auslöser", "back": "IndexError: <code>noten[5]<\/code> bei 5 Elementen.<br>NameError: Name nie zugewiesen oder Tippfehler.<br>TypeError: <code>\"Alter: \" + 36<\/code>, Argument fehlt.", "exam": true}, {"topic": "Fehlermeldungen", "front": "Welche Fehler laufen <b>ohne<\/b> Meldung durch?", "back": "Logikfehler, z. B. <code>5 + 2 / 2<\/code>, falscher Startwert, Tippfehler bei einer Attributzuweisung (<code>anna.kontostnad = 500<\/code> legt still ein neues Attribut an).", "exam": true}], "quiz": [{"topic": "VL2 Datentypen & Operatoren", "q": "Was gibt dieser Code aus?", "code": "print(7 / 2, 7 // 2, 7 % 2)", "options": ["3 3 1", "3.5 3.5 1", "3 3.5 0", "3.5 3 1"], "correct": 3, "explain": "<code>/<\/code> gibt immer float (3.5), <code>//<\/code> rundet ab (3), <code>%<\/code> ist der Rest (1)."}, {"topic": "VL2 Datentypen & Operatoren", "q": "Was gibt dieser Code aus?", "code": "text = \"Hallo\"\nprint(text[1:3], text[-1])", "options": ["all H", "al H", "al o", "Hal o"], "correct": 2, "explain": "<code>text[1:3]<\/code> nimmt Index 1 und 2 (Stopp 3 nicht dabei) → \"al\". <code>text[-1]<\/code> ist das letzte Zeichen."}, {"topic": "VL3 if / match / Logik", "q": "Was gibt dieser Code aus?", "code": "temperatur = 25\nif temperatur < 0:\n    print(\"Gefriert!\")\nelif temperatur < 20:\n    print(\"Kühl.\")\nelif temperatur < 30:\n    print(\"Angenehm.\")\nelse:\n    print(\"Heiß!\")", "options": ["Kühl.", "Heiß!", "Angenehm.", "Kühl.<br>Angenehm."], "correct": 2, "explain": "25 &lt; 20 ist falsch, 25 &lt; 30 ist wahr → \"Angenehm.\". Danach prüft Python nichts mehr."}, {"topic": "VL3 if / match / Logik", "q": "Was gibt dieser Code aus?", "code": "print(bool(\"0\"), bool(-1), bool(\"\"))", "options": ["False True True", "False False False", "True True False", "True False True"], "correct": 2, "explain": "\"0\" ist ein nicht leerer String → True, −1 ist nicht 0 → True, \"\" ist leer → False."}, {"topic": "VL3 Schleifen & range", "q": "Was gibt dieser Code aus?", "code": "for i in range(1, 5):\n    print(i, end=\" \")", "options": ["0 1 2 3 4", "2 3 4 5", "1 2 3 4", "1 2 3 4 5"], "correct": 2, "explain": "range(1, 5): Start 1 ist dabei, Stopp 5 nicht → 1 2 3 4."}, {"topic": "VL3 Schleifen & range", "q": "Was gibt dieser Code aus?", "code": "summe = 0\nfor i in range(1, 4):\n    summe += i\nprint(summe)", "options": ["4", "3", "6", "10"], "correct": 2, "explain": "i läuft 1, 2, 3 (nicht 4!). summe: 1 → 3 → 6."}, {"topic": "VL3 Schleifen & range", "q": "Was gibt dieser Code aus?", "code": "x = 0\nfor i in range(10, 0, -3):\n    x += i\nprint(i, x)", "options": ["1 18", "1 22", "0 22", "10 22"], "correct": 1, "explain": "i = 10, 7, 4, 1 → x = 10 + 7 + 4 + 1 = 22. Nach der Schleife hat i den letzten Wert 1."}, {"topic": "VL3 Schleifen & range", "q": "Was gibt dieser Code aus?", "code": "for i in range(1, 6):\n    if i == 3:\n        continue\n    print(i, end=\" \")", "options": ["1 2 4 5", "3", "1 2 3 4 5", "1 2"], "correct": 0, "explain": "continue überspringt nur den Durchlauf mit i = 3, die Schleife läuft weiter."}, {"topic": "VL3 Schleifen & range", "q": "Was gibt dieser Code aus?", "code": "for i in range(1, 11):\n    if i == 5:\n        break\n    print(i, end=\" \")", "options": ["1 2 3 4 5", "1 2 3 4 6 7 8 9 10", "5", "1 2 3 4"], "correct": 3, "explain": "Bei i = 5 beendet break die Schleife sofort, die 5 wird nicht mehr gedruckt."}, {"topic": "VL3 Schleifen & range", "q": "Was gibt dieser Code aus?", "code": "zaehler = 0\nfor i in range(3):\n    for j in range(2):\n        zaehler += 1\nprint(zaehler)", "options": ["2", "3", "5", "6"], "correct": 3, "explain": "Die äußere Schleife läuft 3-mal, die innere jedes Mal 2-mal: 3 · 2 = 6."}, {"topic": "VL3 Schleifen & range", "q": "Was gibt dieser Code aus?", "code": "a, b = 0, 1\nfor _ in range(6):\n    print(a, end=\" \")\n    a, b = b, a + b", "options": ["1 1 2 3 5 8", "0 1 1 2 3 5", "0 1 2 3 4 5", "0 1 2 4 8 16"], "correct": 1, "explain": "a, b = b, a + b schiebt beide gleichzeitig weiter: Fibonacci 0 1 1 2 3 5."}, {"topic": "VL3 Listen", "q": "Was gibt dieser Code aus?", "code": "falsch = [[0] * 4] * 3\nfalsch[0][0] = 9\nprint(falsch[2][0])", "options": ["IndexError", "9", "0", "[9, 0, 0, 0]"], "correct": 1, "explain": "<code>* 3<\/code> kopiert nur Verweise: alle 3 Zeilen sind dieselbe Liste. Also steht die 9 auch in Zeile 2."}, {"topic": "VL3 Listen", "q": "Was gibt dieser Code aus?", "code": "a = [1, 2, 3]\nb = a\nb.append(4)\nprint(a)", "options": ["[1, 2, 3]", "[1, 2, 3, 4]", "[4]", "None"], "correct": 1, "explain": "b = a kopiert nichts: zwei Namen, eine Liste. append über b ändert auch a."}, {"topic": "VL3 Listen", "q": "Was gibt dieser Code aus?", "code": "zahlen = [3, 1, 2]\ns = sorted(zahlen)\nprint(zahlen, s)", "options": ["[1, 2, 3] [1, 2, 3]", "[3, 1, 2] [1, 2, 3]", "[3, 1, 2] [3, 1, 2]", "[1, 2, 3] [3, 1, 2]"], "correct": 1, "explain": "sorted() liefert eine neue, sortierte Liste. Das Original bleibt unverändert."}, {"topic": "VL4 Funktionen", "q": "Was gibt dieser Code aus?", "code": "def verdopple(x: int) -> None:\n    print(x * 2)\n\nergebnis = verdopple(3)\nprint(ergebnis)", "options": ["6<br>None", "None<br>6", "6<br>6", "6"], "correct": 0, "explain": "verdopple druckt 6, gibt aber nichts zurück (kein return) → ergebnis ist None."}, {"topic": "VL4 Funktionen", "q": "Was gibt dieser Code aus?", "code": "def vorzeichen(x: int) -> str | None:\n    if x > 0:\n        return \"positiv\"\n\nprint(vorzeichen(5), vorzeichen(-3))", "options": ["positiv", "positiv negativ", "None None", "positiv None"], "correct": 3, "explain": "Für x = −3 gibt es kein return → die Funktion liefert None."}, {"topic": "VL4 Funktionen", "q": "Was gibt dieser Code aus?", "code": "def aendere_zahl(wert: int) -> None:\n    wert = wert + 1\n\ndef aendere_liste(liste: list[int]) -> None:\n    liste[0] = 99\n    liste = [7, 7, 7]\n\nzahl = 5\nzahlen = [1, 2, 3]\naendere_zahl(zahl)\naendere_liste(zahlen)\nprint(zahl, zahlen)", "options": ["5 [1, 2, 3]", "5 [99, 2, 3]", "5 [7, 7, 7]", "6 [99, 2, 3]"], "correct": 1, "explain": "wert = wert + 1 bindet nur lokal neu. liste[0] = 99 ändert das gemeinsame Objekt; liste = [7, 7, 7] ist wieder nur lokal."}, {"topic": "VL4 Funktionen", "q": "Was gibt dieser Code aus?", "code": "def falsch(wert: int, liste: list[int] = []) -> list[int]:\n    liste.append(wert)\n    return liste\n\nprint(falsch(1))\nprint(falsch(2))", "options": ["[2]<br>[1, 2]", "[1]<br>[1, 2]", "[1]<br>[2]", "[1, 2]<br>[1, 2]"], "correct": 1, "explain": "Der Standardwert [] wird nur einmal erzeugt und von beiden Aufrufen geteilt."}, {"topic": "VL4 Funktionen", "q": "Was gibt dieser Code aus?", "code": "def mit_return() -> None:\n    for i in range(1, 11):\n        if i == 5:\n            return\n        print(i, end=\" \")\n    print(\"Ende\")\n\nmit_return()", "options": ["1 2 3 4 5 Ende", "Ende", "1 2 3 4", "1 2 3 4 Ende"], "correct": 2, "explain": "return beendet die ganze Funktion, auch mitten in der Schleife. \"Ende\" kommt nie dran."}, {
