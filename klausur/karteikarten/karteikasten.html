"topic": "VL4 Rekursion", "q": "Was gibt dieser Code aus?", "code": "def fakultaet(n: int) -> int:\n    if n == 0:\n        return 1\n    return n * fakultaet(n - 1)\n\nprint(fakultaet(4))", "options": ["6", "RecursionError", "24", "10"], "correct": 2, "explain": "4 · 3 · 2 · 1 · 1 = 24. Der Basisfall n == 0 liefert 1."}, {"topic": "VL5 Klassen & Objekte", "q": "Was gibt dieser Code aus?", "code": "class Konto:\n    def __init__(self, inhaber: str, kontostand: int = 0) -> None:\n        self.inhaber = inhaber\n        self.kontostand = kontostand\n\n    def einzahlen(self, betrag: int) -> None:\n        self.kontostand += betrag\n\nkonto1 = Konto(\"Anna\", 100)\nkonto2 = konto1\nkonto2.einzahlen(50)\nprint(konto1.kontostand, konto1 is konto2)", "options": ["100 False", "150 True", "150 False", "100 True"], "correct": 1, "explain": "konto2 = konto1 erzeugt kein zweites Konto. Beide Namen zeigen auf dasselbe Objekt."}, {"topic": "VL5 Klassen & Objekte", "q": "Was gibt dieser Code aus?", "code": "class Konto:\n    anzahl_konten = 0\n\n    def __init__(self, inhaber: str) -> None:\n        Konto.anzahl_konten += 1\n        self.inhaber = inhaber\n\nanna = Konto(\"Anna\")\nben = Konto(\"Ben\")\nben.anzahl_konten += 1\nprint(ben.anzahl_konten, Konto.anzahl_konten, anna.anzahl_konten)", "options": ["3 2 2", "3 3 2", "2 2 2", "3 3 3"], "correct": 0, "explain": "ben.anzahl_konten += 1 legt ein neues Instanzattribut nur bei ben an (3). Die Klasse und anna bleiben bei 2."}, {"topic": "VL5 Kapselung & @dataclass", "q": "Was gibt dieser Code aus?", "code": "from dataclasses import dataclass\n\n@dataclass\nclass KundeD:\n    name: str\n\nclass KundeN:\n    def __init__(self, name: str) -> None:\n        self.name = name\n\nprint(KundeD(\"Anna\") == KundeD(\"Anna\"), KundeN(\"Anna\") == KundeN(\"Anna\"))", "options": ["True False", "False True", "True True", "False False"], "correct": 0, "explain": "@dataclass erzeugt __eq__ → Werte werden verglichen (True). Die normale Klasse vergleicht nur die Identität (False)."}, {"topic": "VL5 Kapselung & @dataclass", "q": "Was gibt dieser Code aus?", "code": "class Mitarbeiter:\n    def __init__(self, name: str, monatsgehalt: int) -> None:\n        self.name = name\n        self.monatsgehalt = monatsgehalt\n\n    @property\n    def jahresgehalt(self) -> int:\n        return self.monatsgehalt * 12\n\nlena = Mitarbeiter(\"Lena\", 4200)\nprint(lena.jahresgehalt)\nlena.monatsgehalt = 4500\nprint(lena.jahresgehalt)", "options": ["50400<br>54000", "4200<br>4500", "50400<br>50400", "TypeError"], "correct": 0, "explain": "Die Property wird bei jedem Zugriff neu berechnet: 4200 · 12 = 50400, nach der Änderung 4500 · 12 = 54000."}, {"topic": "VL6 Vererbung & super()", "q": "Was gibt dieser Code aus?", "code": "class Konto:\n    pass\n\nclass Sparkonto(Konto):\n    pass\n\nanna = Sparkonto()\nprint(isinstance(anna, Konto), type(anna) is Konto)", "options": ["False False", "True True", "False True", "True False"], "correct": 3, "explain": "isinstance zählt Oberklassen mit → True. type(...) is Konto prüft nur die genaue Klasse → False."}, {"topic": "VL6 Vererbung & super()", "q": "Was gibt dieser Code aus?", "code": "class Mitarbeiter:\n    def __init__(self, name: str) -> None:\n        self.name = name\n\nclass Manager(Mitarbeiter):\n    def __init__(self, name: str, team: int) -> None:\n        self.team = team\n\ntom = Manager(\"Tom\", 6)\nprint(tom.name)", "options": ["AttributeError", "None", "Tom", "TypeError"], "correct": 0, "explain": "Ohne super().__init__(...) wird self.name nie angelegt. Der Fehler kommt erst beim Zugriff."}, {"topic": "VL6 Polymorphie & Abstraktion", "q": "Was gibt dieser Code aus?", "code": "class Mitarbeiter:\n    def __init__(self, name: str) -> None:\n        self.name = name\n\n    def arbeiten(self) -> str:\n        return f\"{self.name} arbeitet.\"\n\nclass Entwickler(Mitarbeiter):\n    def arbeiten(self) -> str:\n        return f\"{self.name} schreibt Code.\"\n\nclass Manager(Mitarbeiter):\n    pass\n\nfor person in [Mitarbeiter(\"Sara\"), Entwickler(\"Lena\"), Manager(\"Tom\")]:\n    print(person.arbeiten())", "options": ["Sara arbeitet.<br>Lena schreibt Code.<br>Tom leitet.", "Sara arbeitet.<br>Lena arbeitet.<br>Tom arbeitet.", "AttributeError", "Sara arbeitet.<br>Lena schreibt Code.<br>Tom arbeitet."], "correct": 3, "explain": "Entwickler überschreibt arbeiten(). Manager nicht → Python findet die Methode in Mitarbeiter."}, {"topic": "VL6 Polymorphie & Abstraktion", "q": "Was gibt dieser Code aus?", "code": "class Mitarbeiter:\n    def __init__(self, gehalt: int) -> None:\n        self.gehalt = gehalt\n\n    def monatskosten(self) -> int:\n        return self.gehalt\n\nclass Manager(Mitarbeiter):\n    def __init__(self, gehalt: int, team: int) -> None:\n        super().__init__(gehalt)\n        self.team = team\n\n    def monatskosten(self) -> int:\n        return super().monatskosten() + 150 * self.team\n\nsumme = 0\nfor person in [Mitarbeiter(3600), Mitarbeiter(4200), Manager(5800, 2)]:\n    summe += person.monatskosten()\nprint(summe)", "options": ["13900", "14200", "13000", "13600"], "correct": 0, "explain": "3600 + 4200 + (5800 + 150 · 2) = 3600 + 4200 + 6100 = 13900. Manager ergänzt mit super()."}, {"topic": "VL6 Polymorphie & Abstraktion", "q": "Was gibt dieser Code aus?", "code": "from abc import ABC, abstractmethod\n\nclass Tier(ABC):\n    @abstractmethod\n    def laut(self) -> str: ...\n\n    def vorstellen(self) -> str:\n        return \"Ich sage \" + self.laut()\n\nclass Hund(Tier):\n    def laut(self) -> str:\n        return \"Wuff\"\n\nclass Katze(Tier):\n    pass\n\nprint(Hund().vorstellen())\nprint(Katze().vorstellen())", "options": ["Ich sage Wuff<br>Ich sage None", "Ich sage Wuff<br>AttributeError", "TypeError", "Ich sage Wuff<br>TypeError"], "correct": 3, "explain": "Katze setzt die abstrakte Methode laut nicht um → schon Katze() gibt einen TypeError."}, {"topic": "VL6 Vererbung & super()", "q": "Welche Aussage über Python stimmt?", "options": ["Python kann Methoden überschreiben, aber nicht überladen.", "Python kann Methoden überladen, aber nicht überschreiben.", "Python kann Methoden überladen und überschreiben.", "Python kann weder überladen noch überschreiben."], "correct": 0, "explain": "Ein zweites def mit gleichem Namen ersetzt das erste (kein Überladen). Eine Unterklasse darf eine Methode neu schreiben (Überschreiben)."}]}, "mathe": {"cards": [{"topic": "Grundlagen", "front": "Prozent als Dezimalzahl: 5 %, 2,5 %, 0,25 %", "back": "5 % = 0,05 · 2,5 % = 0,025 · 0,25 % = 0,0025.<br>Faktor bei 5 % Zinsen: 1 + i = 1,05.", "exam": true}, {"topic": "Grundlagen", "front": "Was bedeutet Σₖ₌₁³ k²?", "back": "Alle k von 1 bis 3 einsetzen und addieren: 1² + 2² + 3² = 1 + 4 + 9 = <b>14<\/b>.", "exam": true}, {"topic": "Grundlagen", "front": "Potenzregel aᵏ · bᵏ", "back": "aᵏ · bᵏ = (a·b)ᵏ.<br>Beispiel: (−1)ᵏ · (⅕)ᵏ = (−⅕)ᵏ.", "exam": true}, {"topic": "Folgen: Begriffe", "front": "Was ist eine <b>Folge<\/b>?", "back": "Eine Funktion ℕ → ℝ, also eine geordnete Liste a₁, a₂, a₃, … aₙ heißt Glied, n heißt Index.", "exam": true}, {"topic": "Folgen: Begriffe", "front": "explizit vs. rekursiv", "back": "explizit: direkte Formel, z. B. aₙ = n² → a₃ = 9.<br>rekursiv: aus dem Vorgänger, z. B. a₁ = 2, aₙ = aₙ₋₁ + 3 → 2, 5, 8, 11.", "exam": true}, {"topic": "Folgen: Begriffe", "front": "Bildungsgesetz finden: −3, 3, −3, 3, …", "back": "aₙ = (−1)ⁿ · 3 (ab n = 1). Der Faktor (−1)ⁿ macht das Vorzeichen abwechselnd (<b>alternierend<\/b>).", "exam": true}, {"topic": "Folgen: Begriffe", "front": "Bildungsgesetz finden: 1, ¼, 1/9, 1/16, …", "back": "aₙ = 1/n².", "exam": true}, {"topic": "Monotonie & Beschränktheit", "front": "streng monoton wachsend – Definition und Test", "back": "aₙ &lt; aₙ₊₁ für alle n.<br>Test: Differenz aₙ₊₁ − aₙ &gt; 0. Beispiel aₙ = n²: (n+1)² − n² = 2n + 1 &gt; 0.", "exam": true}, {"topic": "Monotonie & Beschränktheit", "front": "Ist (−1)ⁿ monoton?", "back": "Nein, die Glieder springen −1, 1, −1, 1 hin und her. Aber beschränkt: |aₙ| ≤ 1.", "exam": true}, {"topic": "Monotonie & Beschränktheit", "front": "Was heißt <b>beschränkt<\/b>?", "back": "Es gibt ein C mit |aₙ| ≤ C für alle n (die Folge bleibt in einem Streifen).<br>Beispiel 1 + 1/n: 1 &lt; aₙ ≤ 2.", "exam": true}, {"topic": "Monotonie & Beschränktheit", "front": "Ist eine konstante Folge aₙ = 7 monoton?", "back": "Ja, monoton wachsend <b>und<\/b> fallend (aber nicht streng). Sie ist beschränkt.", "exam": true}, {"topic": "Konvergenz & Grenzwerte", "front": "Konvergenz in einfachen Worten", "back": "aₙ → a heißt: Für jede noch so kleine Genauigkeit ε liegen ab einem Index n₀ <b>alle<\/b> Glieder näher als ε an a: |aₙ − a| &lt; ε.", "exam": true}, {"topic": "Konvergenz & Grenzwerte", "front": "Nullfolge, bestimmt divergent, unbestimmt divergent", "back": "Nullfolge: Grenzwert 0 (z. B. 1/n).<br>bestimmt divergent: → +∞ oder −∞ (z. B. n²).<br>unbestimmt: springt ohne Ziel (z. B. (−1)ⁿ).", "exam": true}, {"topic": "Konvergenz & Grenzwerte", "front": "Monotonie-Kriterium", "back": "monoton <b>und<\/b> beschränkt ⇒ konvergent.<br>Beschränkt allein reicht nicht: (−1)ⁿ ist beschränkt, aber divergent.", "exam": true}, {"topic": "Konvergenz & Grenzwerte", "front": "Grenzwert eines Bruchs von Polynomen (Faustregel)", "back": "Durch die höchste Potenz des Nenners teilen.<br>Grad gleich → Leitkoeffizienten teilen: (2n² − 3)/(n² + n + 1) → <b>2<\/b>.<br>Zählergrad kleiner → 0. Zählergrad größer → ±∞.", "exam": true}, {"topic": "Konvergenz & Grenzwerte", "front": "Grenzwert von (8k³ − 4k² − 8)/(6k³ + 2k − 1)?", "back": "Gleicher Grad 3 → 8/6 = <b>4/3<\/b>.", "exam": true}, {"topic": "Konvergenz & Grenzwerte", "front": "Grund-Nullfolgen", "back": "1/n → 0 und qⁿ → 0 für |q| &lt; 1, z. B. (½)ⁿ → 0. Auch e⁻ⁿ → 0.", "exam": true}, {"topic": "Konvergenz & Grenzwerte", "front": "Wachstums-Rangliste (wer gewinnt für große n?)", "back": "ln n &lt; √n &lt; n &lt; n² &lt; eⁿ.<br>Beispiel: −7n³ + 4n² + 10 → −∞, weil −7n³ dominiert.", "exam": true}, {"topic": "Arithm./geom. Folgen", "front": "Arithmetische Folge: Formeln", "back": "konstante Differenz d: aₙ = a₁ + (n − 1)·d, Sₙ = n/2 · (a₁ + aₙ).<br>a₁ = 3, d = 4: a₁₀ = 3 + 9·4 = 39, S₁₀ = 5 · 42 = 210.", "exam": true}, {"topic": "Arithm./geom. Folgen", "front": "Geometrische Folge: Formeln", "back": "konstanter Quotient q: aₙ = a₁ · qⁿ⁻¹, Sₙ = a₁ · (qⁿ − 1)/(q − 1).<br>a₁ = 2, q = 3: a₈ = 2 · 3⁷ = 4374, S₆ = 728.", "exam": true}, {"topic": "Reihen", "front": "Was ist eine <b>Reihe<\/b>?", "back": "Eine unendliche Summe Σ aₖ = a₀ + a₁ + a₂ + … Man schaut auf die <b>Teilsummen<\/b> sₙ = a₀ + … + aₙ. Haben sie einen Grenzwert s, ist die Reihe konvergent mit Summe s.", "exam": true}, {"topic": "Reihen", "front": "Teilsummen von Σₖ₌₀ (½)ᵏ", "back": "s₀ = 1, s₁ = 1,5, s₂ = 1,75, s₃ = 1,875 → Summe <b>2<\/b>.", "exam": true}, {"topic": "Reihen", "front": "Geometrische Reihe: Formel", "back": "Σₖ₌₀^∞ qᵏ = 1/(1 − q), nur für |q| &lt; 1.<br>Allgemein: <b>erstes Glied / (1 − q)<\/b>.", "exam": true}, {"topic": "Reihen", "front": "Σₖ₌₁^∞ (½)ᵏ = ?", "back": "Start bei k = 1 → erstes Glied ½. ½ / (1 − ½) = <b>1<\/b> (nicht 2!).", "exam": true}, {"topic": "Reihen", "front": "Σₖ₌₀^∞ (−1)ᵏ (⅕)ᵏ = ?", "back": "Zusammenfassen: (−⅕)ᵏ, q = −⅕, erstes Glied 1. 1/(1 + ⅕) = <b>5/6<\/b>.", "exam": true}, {"topic": "Reihen", "front": "Periodenzahl 0,3̄ als Bruch", "back": "0,3 + 0,03 + … = (3/10) / (1 − 1/10) = (3/10)/(9/10) = <b>1/3<\/b>.", "exam": true}, {"topic": "Reihen", "front": "Periodenzahl 0,1̄2̄ als Bruch", "back": "Periodenlänge 2 → q = 1/100. (12/100)/(99/100) = 12/99 = <b>4/33<\/b>.", "exam": true}, {"topic": "Reihen", "front": "Teleskopsumme Σₖ₌₁^∞ 1/(k(k+1))", "back": "1/(k(k+1)) = 1/k − 1/(k+1). Die Mitte hebt sich weg: sₙ = 1 − 1/(n+1) → <b>1<\/b>.", "exam": true}, {"topic": "Reihen", "front": "Σₖ₌₁^∞ 6/k² = ?", "back": "Konstante vorziehen: 6 · Σ 1/k² = 6 · π²/6 = <b>π² ≈ 9,87<\/b>.", "exam": true}, {"topic": "Reihen", "front": "Warnung: 1 + 2 + 4 + 8 + … = −1?", "back": "Unsinn! Die Reihe divergiert, mit divergenten Reihen darf man nicht wie mit normalen Summen rechnen.", "exam": true}, {"topic": "Konvergenzkriterien", "front": "Notwendiges Kriterium", "back": "Σ aₖ konvergent ⇒ aₖ → 0.<br>Also: aₖ geht <b>nicht<\/b> gegen 0 ⇒ divergent. Geht aₖ gegen 0, weiß man <b>noch nichts<\/b>.", "exam": true}, {"topic": "Konvergenzkriterien", "front": "Harmonische Reihe Σ 1/k", "back": "<b>Divergent<\/b> (→ ∞), obwohl 1/k → 0. Sie wächst nur sehr langsam: s₁₀ ≈ 2,93.", "exam": true}, {"topic": "Konvergenzkriterien", "front": "Σ 1/kᵖ – wann konvergent?", "back": "Genau für p &gt; 1. Σ 1/k² konvergiert (π²/6), Σ 1/k divergiert.", "exam": true}, {"topic": "Konvergenzkriterien", "front": "Potenzabstand-Regel bei Brüchen", "back": "Abstand = Nennergrad − Zählergrad.<br>&gt; 1 → konvergent (Σ (k+1)/(k³+2): Abstand 2).<br>≤ 1 → divergent (Σ k/(k²+5): Abstand 1).", "exam": true}, {"topic": "Konvergenzkriterien", "front": "Quotientenkriterium (Ergänzung)", "back": "L = lim |aₖ₊₁/aₖ|. L &lt; 1 konvergent, L &gt; 1 divergent, L = 1 keine Aussage. Gut bei k! oder xᵏ.<br>Σ 1/k!: L = lim 1/(k+1) = 0 → konvergent.", "exam": false}, {"topic": "Finanzmathe", "front": "Zinseszins: einmalige Zahlung", "back": "Kₙ = r · (1 + i)ⁿ.<br>1000 € zu 5 %: nach 2 Jahren 1000 · 1,05² = <b>1102,50 €<\/b>.", "exam": true}, {"topic": "Finanzmathe", "front": "Sparplan (Endwert): Formel", "back": "Eₙ = r · ((1 + i)ⁿ − 1) / i. Das ist eine endliche geometrische Reihe mit q = 1 + i.", "exam": true}, {"topic": "Finanzmathe", "front": "Sparplan: r = 100 €, i = 5 %, n = 3", "back": "100 · (1,05³ − 1)/0,05 = 100 · 3,1525 = <b>315,25 €<\/b>.<br>Probe: 110,25 + 105 + 100 = 315,25.", "exam": true}, {"topic": "Finanzmathe", "front": "Folienbeispiel: 100 € pro Monat, 0,25 % pro Monat, 60 Monate", "back": "E₆₀ = 100 · (1,0025⁶⁰ − 1)/0,0025 ≈ <b>6464,67 €<\/b> (Folie: ca. 6460 €). Eingezahlt 6000 €.", "exam": true}, {"topic": "Finanzmathe", "front": "Ewige Rente (Barwert)", "back": "B = r / i.<br>1000 € pro Jahr bei 4 %: 1000/0,04 = <b>25 000 €<\/b>.", "exam": true}, {"topic": "Finanzmathe", "front": "Warum beim Sparplan nur die endliche Formel?", "back": "Beim Sparplan ist q = 1 + i &gt; 1 → die unendliche Reihe divergiert. Bei der ewigen Rente ist q = 1/(1 + i) &lt; 1 → unendliche Formel erlaubt.", "exam": true}, {"topic": "Funktionen", "front": "Definitionsmenge, Wertemenge, Bild", "back": "D: erlaubte x. W: Zielmenge. Bild: Werte, die wirklich herauskommen.<br>x² auf ℝ: W = ℝ, Bild = [0, ∞).", "exam": true}, {"topic": "Funktionen", "front": "Größter Definitionsbereich: Rezept", "back": "Nenner ≠ 0, unter der Wurzel ≥ 0.<br>1/(x² − 1): D = ℝ \\ {−1, 1}.", "exam": true}, {"topic": "Funktionen", "front": "injektiv, surjektiv, bijektiv", "back": "injektiv: jeder Wert höchstens einmal getroffen. surjektiv: jeder Wert der Zielmenge mindestens einmal. bijektiv: genau einmal → Umkehrfunktion existiert.", "exam": true}, {"topic": "Funktionen", "front": "Verkettung (f ∘ g)(x)", "back": "f(g(x)): <b>zuerst g, dann f<\/b>. Die Reihenfolge ist wichtig.<br>g(x) = 1 − x², f = sin: g(sin x) = 1 − sin²x = cos²x.", "exam": true}, {"topic": "Funktionen", "front": "Definitionsbereich von f/g", "back": "Wo f und g beide definiert sind, <b>ohne<\/b> die Nullstellen von g.<br>√x / (x − 1): D = [0, ∞) ohne 1.", "exam": true}, {"topic": "Umkehrfunktion", "front": "Umkehrfunktion: was ist f⁻¹?", "back": "f⁻¹ macht f rückgängig: f⁻¹(f(x)) = x. Graph an y = x spiegeln. <b>Nicht<\/b> 1/f(x)!<br>Jede streng monotone Funktion hat eine Umkehrfunktion.", "exam": true}, {"topic": "Umkehrfunktion", "front": "Folie 62: f: [2, ∞) → ℝ, f(x) = x² − 4x + 1. f⁻¹?", "back": "(x − 2)² − 3 = y ⇒ x = 2 + √(y + 3).<br>f⁻¹(x) = <b>2 + √(x + 3)<\/b>. Probe: f(5) = 6, f⁻¹(6) = 5.", "exam": true}, {"topic": "Grenzwerte von Funktionen", "front": "Grenzwert bei 0/0: lim_{x→2} (x² − 4)/(x − 2)", "back": "Faktorisieren: (x − 2)(x + 2)/(x − 2) = x + 2 → <b>4<\/b>.", "exam": true}, {"topic": "Grenzwerte von Funktionen", "front": "Zahl/0: lim_{x→0⁺} 1/x und lim_{x→0⁻} 1/x", "back": "Von rechts +∞, von links −∞. Links ≠ rechts ⇒ lim_{x→0} 1/x existiert nicht.", "exam": true}, {"topic": "Grenzwerte von Funktionen", "front": "Standard-Grenzwert sin(x)/x für x → 0", "back": "<b>1<\/b> (Bogenmaß). Probe: sin(0,1)/0,1 ≈ 0,998.", "exam": true}, {"topic": "Grenzwerte von Funktionen", "front": "lim_{x→0} sin(1/x)", "back": "Existiert <b>nicht<\/b>: Der Sinus schwingt immer schneller zwischen −1 und 1 (Oszillation).", "exam": true}, {"topic": "Stetigkeit", "front": "Wann ist f in x̂ stetig?", "back": "Wenn lim_{x→x̂} f(x) = f(x̂). Anschaulich: Graph ohne Absetzen zeichnen.", "exam": true}, {"topic": "Stetigkeit", "front": "c so wählen, dass f stetig ist: f(x) = (x² + 2x − 3)/(x² + x − 2), f(1) = c", "back": "Kürzen: (x + 3)(x − 1)/((x + 2)(x − 1)) = (x + 3)/(x + 2). x = 1: c = <b>4/3<\/b>.", "exam": true}, {"topic": "Stetigkeit", "front": "Die 3 Unstetigkeitstypen", "back": "Sprungstelle (links ≠ rechts), Polstelle (|f| → ∞, z. B. 1/(x − 2) bei 2), Oszillationsstelle (sin(1/x) bei 0).", "exam": true}, {"topic": "Stetigkeit", "front": "Welche Funktionen sind stetig?", "back": "Polynome überall, p/q wo q ≠ 0, exp, ln, sin, cos auf ihrem Definitionsbereich. Summen, Produkte und Verkettungen stetiger Funktionen auch.", "exam": true}, {"topic": "ln- und e-Regeln", "front": "ln-Regeln", "back": "ln(a·b) = ln a + ln b · ln(a/b) = ln a − ln b · ln(aʳ) = r · ln a.<br>Beispiel: ln 8 = 3 · ln 2.", "exam": true}, {"topic": "ln- und e-Regeln", "front": "e und ln heben sich auf", "back": "e^(ln a) = a und ln(eᵃ) = a.<br>√(e^(3 ln 4)) = √(4³) = √64 = <b>8<\/b>.", "exam": true}, {"topic": "ln- und e-Regeln", "front": "Zusammenfassen: ln 2x + ln 2y − ln z − ln 4", "back": "= ln(2x · 2y / (4z)) = <b>ln(xy/z)<\/b>.", "exam": true}], "quiz": [{"topic": "Folgen: Begriffe", "q": "Welches Bildungsgesetz passt zu 2, 4, 8, 16, …?", "options": ["aₙ = 2ⁿ", "aₙ = 2n", "aₙ = n²", "aₙ = 2ⁿ⁻¹"], "correct": 0, "explain": "Jedes Glied ist das Doppelte: 2¹, 2², 2³, 2⁴. Bei 2n käme 2, 4, 6, 8 heraus."}, {"topic": "Folgen: Begriffe", "q": "Rekursiv: d₁ = 2, dₙ = dₙ₋₁ + 3. Was ist d₄?", "options": ["8", "11", "9", "14"], "correct": 1, "explain": "2 → 5 → 8 → 11. Arithmetische Folge mit d = 3."}, {"topic": "Monotonie & Beschränktheit", "q": "Was gilt für bₙ = 1 + 1/n?", "options": ["konstant", "nicht monoton, beschränkt", "streng fallend, beschränkt", "streng wachsend, unbeschränkt"], "correct": 2, "explain": "2; 1,5; 1,33; 1,25 … wird kleiner und bleibt zwischen 1 und 2."}, {"topic": "Konvergenz & Grenzwerte", "q": "Welche Aussage ist <b>falsch<\/b>?", "options": ["Monoton + beschränkt ⇒ konvergent.", "Der Grenzwert ist eindeutig.", "Jede beschränkte Folge ist konvergent.", "Jede konvergente Folge ist beschränkt."], "correct": 2, "explain": "Gegenbeispiel (−1)ⁿ: beschränkt, aber divergent. Für Konvergenz braucht es zusätzlich Monotonie."}, {"topic": "Konvergenz & Grenzwerte", "q": "lim (2n² − 3)/(n² + n + 1) für n → ∞ = ?", "options": ["∞", "2", "−3", "0"], "correct": 1, "explain": "Gleicher Grad → Leitkoeffizienten: 2/1 = 2."}, {"topic": "Konvergenz & Grenzwerte", "q": "lim (−5n + 1)/(4n² − 7) für n → ∞ = ?", "options": ["−∞", "−5/4", "1/4", "0"], "correct": 3, "explain": "Zählergrad 1 &lt; Nennergrad 2 → der Nenner wächst schneller → 0."}, {"topic": "Konvergenz & Grenzwerte", "q": "Was macht (−1)ⁿ · n für n → ∞?", "options": ["→ +∞ (bestimmt divergent)", "→ 0", "→ −∞", "unbestimmt divergent"], "correct": 3, "explain": "Der Betrag wird groß, aber das Vorzeichen wechselt ständig. Kein fester Grenzwert, auch nicht ±∞."}, {"topic": "Arithm./geom. Folgen", "q": "Arithmetische Folge a₁ = 3, d = 4. Was ist a₁₀?", "options": ["39", "40", "43", "35"], "correct": 0, "explain": "a₁₀ = 3 + (10 − 1) · 4 = 3 + 36 = 39. Typischer Fehler: 10 · 4 statt 9 · 4."}, {"topic": "Arithm./geom. Folgen", "q": "Geometrische Folge a₁ = 2, q = 3. Was ist a₈?", "options": ["13122", "4374", "1458", "48"], "correct": 1, "explain": "a₈ = 2 · 3⁷ = 2 · 2187 = 4374. Exponent ist n − 1 = 7, nicht 8."}, {"topic": "Reihen", "q": "Σₖ₌₁^∞ (½)ᵏ = ?", "options": ["2", "½", "∞", "1"], "correct": 3, "explain": "Start bei k = 1 → erstes Glied ½. ½/(1 − ½) = 1. Die 2 wäre der Wert ab k = 0."}, {"topic": "Reihen", "q": "Σₖ₌₀^∞ (−⅕)ᵏ = ?", "options": ["5/4", "5/6", "−5/6", "1"], "correct": 1, "explain": "Erstes Glied 1, q = −⅕: 1/(1 − (−⅕)) = 1/(6/5) = 5/6."}, {"topic": "Reihen", "q": "Σₖ₌₀^∞ 3 · (−½)ᵏ = ?", "options": ["2", "−2", "6", "3/2"], "correct": 0, "explain": "Erstes Glied 3, q = −½: 3/(1 + ½) = 3/(3/2) = 2."}, {"topic": "Reihen", "q": "Welcher Bruch ist 0,1̄2̄ = 0,121212…?", "options": ["1/8", "12/100", "4/33", "6/45"], "correct": 2, "explain": "Periodenlänge 2 → q = 1/100: (12/100)/(99/100) = 12/99 = 4/33."}, {"topic": "Reihen", "q": "Σₖ₌₁^∞ 1/(k(k+1)) = ?", "options": ["½", "∞", "2", "1"], "correct": 3, "explain": "Teleskopsumme: sₙ = 1 − 1/(n+1) → 1."}, {"topic": "Konvergenzkriterien", "q": "Die Summanden einer Reihe gehen gegen 0. Was folgt?", "options": ["Die Reihe konvergiert.", "Die Reihe hat den Wert 0.", "Die Reihe divergiert.", "Noch nichts – sie kann konvergieren oder divergieren."], "correct": 3, "explain": "Das notwendige Kriterium kann nur „divergent“ beweisen. Beispiel Σ 1/k: Summanden → 0, trotzdem divergent."}, {"topic": "Konvergenzkriterien", "q": "Welche Reihe ist <b>divergent<\/b>?", "options": ["Σ k/(k² + 5)", "Σ 1/(2k⁵)", "Σ (½)ᵏ", "Σ 1/k²"], "correct": 0, "explain": "Potenzabstand 2 − 1 = 1 → verhält sich wie 1/k → divergent. Die anderen konvergieren."}, {"topic": "Konvergenzkriterien", "q": "Konvergiert Σ (2k + 1)/(5k − 3)?", "options": ["Nur für große k", "Ja, gegen 2/5", "Nein, die Summanden gehen gegen 2/5 ≠ 0", "Ja, Abstand 1"], "correct": 2, "explain": "Die Summanden gehen gegen 2/5, nicht gegen 0 → notwendiges Kriterium verletzt → divergent. 2/5 ist der Grenzwert der Glieder, nicht der Reihe."}, {"topic": "Finanzmathe", "q": "Wie viel sind 1000 € nach 2 Jahren bei 5 % mit Zinseszins?", "options": ["1050,00 €", "1100,00 €", "1102,50 €", "1105,00 €"], "correct": 2, "explain": "1000 · 1,05² = 1000 · 1,1025 = 1102,50 €. 1100 € wäre ohne Zinseszins."}, {"topic": "Finanzmathe", "q": "Sparplan: jedes Jahr 100 € (Jahresende), 5 %, 3 Jahre. Endwert?", "options": ["315,25 €", "300,00 €", "331,01 €", "315,00 €"], "correct": 0, "explain": "100 · (1,05³ − 1)/0,05 = 315,25 €. Probe: 110,25 + 105 + 100."}, {"topic": "Finanzmathe", "q": "Eine Stiftung zahlt für immer 600 € pro Jahr, Zins 4 %. Barwert?", "options": ["15 000 €", "2 400 €", "24 000 €", "624 €"], "correct": 0, "explain": "Ewige Rente B = r/i = 600/0,04 = 15 000 €. Probe: 4 % von 15 000 € sind 600 €."}, {"topic": "Finanzmathe", "q": "Was ist falsch beim Einsetzen von 5 % in die Sparplanformel?", "options": ["q = 1 + i = 1,05", "i = 0,05", "i = 5", "1 + i im Exponenten n"], "correct": 2, "explain": "Prozent immer als Dezimalzahl: 5 % = 0,05. Mit i = 5 kommt Unsinn heraus."}, {"topic": "Funktionen", "q": "Größter Definitionsbereich von f(x) = 1/(x⁴ − 2x² + 1)?", "options": ["ℝ", "ℝ \\ {1}", "(1, ∞)", "ℝ \\ {−1, 1}"], "correct": 3, "explain": "Nenner = (x² − 1)² = 0 bei x = 1 und x = −1. Beide raus."}, {"topic": "Funktionen", "q": "(f ∘ g)(x) bedeutet …", "options": ["zuerst f, dann g", "f(x) · g(x)", "f(x) + g(x)", "zuerst g, dann f"], "correct": 3, "explain": "(f ∘ g)(x) = f(g(x)): Die innere Funktion g wird zuerst ausgerechnet."}, {"topic": "Umkehrfunktion", "q": "Hat f: ℝ → ℝ, f(x) = x² − 4x + 2 eine Umkehrfunktion?", "options": ["Ja, weil f stetig ist", "Nein, f ist nicht injektiv (f(0) = f(4) = 2)", "Ja, f⁻¹(x) = 2 + √(x + 2)", "Ja, f⁻¹ = 1/f"], "correct": 1, "explain": "Zwei x mit gleichem Wert → nicht injektiv. Erst auf [2, ∞) eingeschränkt ginge es."}, {"topic": "Grenzwerte von Funktionen", "q": "lim_{x→2} (x² − 4)/(x − 2) = ?", "options": ["existiert nicht (0/0)", "4", "2", "0"], "correct": 1, "explain": "0/0 heißt umformen: (x − 2)(x + 2)/(x − 2) = x + 2 → 4."}, {"topic": "Grenzwerte von Funktionen", "q": "lim_{x→∞} (2x² + 3x − 1)/(x² + 5) = ?", "options": ["2", "3", "∞", "−1/5"], "correct": 0, "explain": "Durch x² teilen: (2 + 3/x − 1/x²)/(1 + 5/x²) → 2."}, {"topic": "Stetigkeit", "q": "Für welches c ist f stetig? f(x) = (x³ − 2x² − 5x + 6)/(x³ − x) für x ≠ 1, f(1) = c", "options": ["c = −6", "c = 0", "c = −3", "c = 3"], "correct": 2, "explain": "Kürzen: (x − 3)(x + 2)/(x(x + 1)). Bei x = 1: (−2)·3/(1·2) = −3."}, {"topic": "ln- und e-Regeln", "q": "√(e^(3 ln 4)) = ?", "options": ["64", "8", "2", "12"], "correct": 1, "explain": "e^(3 ln 4) = e^(ln 4³) = 64, √64 = 8. 64 ist der Wert ohne Wurzel."}]}, "recht": {"cards": [{"topic": "Fall lösen", "front": "Die vier Fragen vor jeder Falllösung", "back": "Wer will was von wem woraus? Beispiel: V will 450 € Oktobermiete von M aus <b>§ 535 II BGB<\/b>. Ohne „woraus“ (Anspruchsgrundlage) ist es nur ein Wunsch.", "exam": true}, {"topic": "Fall lösen", "front": "Gutachtenstil: die vier Schritte", "back": "1. Obersatz („K <i>könnte<\/i> … aus § 433 I 1 haben“) 2. Voraussetzung/Definition („Dazu <i>müsste<\/i> …“) 3. Subsumtion („<i>Hier<\/i> …“) 4. Ergebnis („<i>Also<\/i> …“).", "exam": true}, {"topic": "Fall lösen", "front": "Gutachtenstil oder Urteilsstil: „K hat keinen Anspruch, weil kein Vertrag vorliegt.“", "back": "Urteilsstil: Ergebnis zuerst, Begründung mit „weil“. In der Klausur Gutachtenstil nur bei Problemen, Eindeutiges (z. B. 20-Jähriger ist volljährig) in einem kurzen Satz.", "exam": false}, {"topic": "Fall lösen", "front": "Anspruchsaufbau in drei Stufen", "back": "1. entstanden? (hindernd: §§ 105, 125, 134, 138) 2. nicht untergegangen? (Erfüllung § 362, Aufrechnung § 389, Anfechtung § 142) 3. durchsetzbar? (Einreden: Verjährung § 214, §§ 273, 320).", "exam": true}, {"topic": "Fall lösen", "front": "Einwendung vs. Einrede", "back": "Einwendung (z. B. Erfüllung, Geschäftsunfähigkeit) wirkt automatisch, das Gericht beachtet sie von selbst. Einrede (z. B. Verjährung, § 214 I) wirkt nur, wenn der Schuldner sich darauf beruft.", "exam": true}, {"topic": "Fall lösen", "front": "Musterfall Schaufensterkleid: Preisschild 500 €, Glück verlangt 1.500 €. Anspruch von Frau Müller?", "back": "Nein. Schaufenster = <i>invitatio ad offerendum<\/i>, das Angebot macht Frau Müller. Glücks „1.500 €“ ist Ablehnung + neues Angebot (§ 150 II). Kein Vertrag, also auch nichts anzufechten.", "exam": true}, {"topic": "Grundlagen", "front": "Rechtsfähigkeit (§ 1 BGB)", "back": "Fähigkeit, Träger von Rechten und Pflichten zu sein. Beginnt mit Vollendung der Geburt. Ein 3 Tage altes Baby ist rechtsfähig, aber geschäftsunfähig (§ 104 Nr. 1).", "exam": false}, {"topic": "Grundlagen", "front": "Verbraucher (§ 13) vs. Unternehmer (§ 14)", "back": "Es zählt der Zweck des einzelnen Geschäfts. Bäckerin kauft privat ein Sofa: Verbraucherin; Backofen für die Bäckerei: Unternehmerin. Eine GmbH ist nie Verbraucher.", "exam": true}, {"topic": "WE & Vertrag", "front": "Willenserklärung (Definition)", "back": "Willensäußerung, die auf einen rechtlichen Erfolg gerichtet ist. Ausdrücklich („Ich kaufe“) oder konkludent (Ware aufs Kassenband). Schweigen ist grundsätzlich keine WE.", "exam": true}, {"topic": "WE & Vertrag", "front": "Abgabe einer empfangsbedürftigen WE", "back": "Mit Wissen und Willen so auf den Weg gebracht, dass sie ohne weiteres Zutun den Empfänger erreicht. Kündigung im eigenen Postausgangskorb: noch nicht abgegeben.", "exam": false}, {"topic": "WE & Vertrag", "front": "Zugang (§ 130 I 1)", "back": "Die WE ist so in den Machtbereich des Empfängers gelangt, dass er unter normalen Umständen Kenntnis nehmen kann. Entscheidend ist die <b>Möglichkeit<\/b>, nicht das Lesen (Brief 10 Uhr, Empfänger im Urlaub: trotzdem zugegangen).", "exam": true}, {"topic": "WE & Vertrag", "front": "Brief um 23 Uhr in den Geschäftsbriefkasten – wann zugegangen?", "back": "Erst am nächsten Morgen zu Geschäftsbeginn. Wer am letzten Fristtag abends einwirft, ist zu spät (Skriptfall Zugang 1).", "exam": true}, {"topic": "WE & Vertrag", "front": "Empfangsbote vs. Erklärungsbote", "back": "Empfangsbote (erwachsene Familie, Sekretärin): Zugang mit Übergabe, Risiko trägt der Empfänger. Erklärungsbote (4-jähriges Kind, Pförtner ohne Auftrag): Risiko trägt der Erklärende.", "exam": true}, {"topic": "WE & Vertrag", "front": "Vertrag (Definition)", "back": "Zwei übereinstimmende, wirksame Willenserklärungen: Angebot (Antrag) und Annahme, §§ 145 ff. Das Angebot muss so bestimmt sein, dass ein „Ja“ genügt (Ware + Preis).", "exam": true}, {"topic": "WE & Vertrag", "front": "<i>invitatio ad offerendum<\/i>", "back": "Aufforderung, selbst ein Angebot abzugeben: Schaufenster, Prospekt, Katalog, Online-Shop. Grund: Bäcker mit 20 Brezeln will nicht an 50 Leute gebunden sein. Das Angebot macht der Kunde.", "exam": true}, {"topic": "WE & Vertrag", "front": "§ 150 BGB", "back": "Verspätete Annahme (I) oder Annahme mit Änderungen (II) = neues Angebot. Fred bietet 120 €, Fritz antwortet „für 130 €“: Ablehnung + neues Angebot über 130 €.", "exam": true}, {"topic": "WE & Vertrag", "front": "Unbestellte Ware (§ 241a)", "back": "Kein Anspruch gegen den Verbraucher. „Schweigen gilt als Annahme“ ändert nichts – Schweigen ist keine WE (CD für 15 €: kein Kaufpreisanspruch).", "exam": true}, {"topic": "WE & Vertrag", "front": "Formverstoß (§ 125) – Beispiel Grundstück", "back": "Formverstoß macht nichtig (§ 125 S. 1). Grundstückskauf braucht notarielle Beurkundung (§ 311b I 1); Handschlag-Kauf für 80.000 € ist nichtig. Heilung durch Auflassung + Grundbucheintrag (§ 311b I 2).", "exam": true}, {"topic": "Unwirksamkeit", "front": "Nichtigkeitsgründe", "back": "§ 105 (Geschäftsunfähiger), § 125 (Form), § 134 (gesetzliches Verbot, z. B. Schwarzarbeit), § 138 (Sittenwidrigkeit/Wucher). Nichtig = von Anfang an unwirksam, keine Anfechtung nötig.", "exam": false}, {"topic": "Unwirksamkeit", "front": "Prüfungsschema Anfechtung", "back": "1. Anfechtungsgrund (§§ 119, 120, 123) 2. Anfechtungserklärung (§ 143 I) 3. Frist (§ 121 bzw. § 124) 4. Folge: nichtig von Anfang an (§ 142 I), ggf. Vertrauensschaden (§ 122).", "exam": true}, {"topic": "Unwirksamkeit", "front": "Inhaltsirrtum vs. Erklärungsirrtum", "back": "Inhaltsirrtum (§ 119 I Alt. 1): richtiges Wort, falsche Bedeutung („Dutzend“ = 10 gedacht). Erklärungsirrtum (§ 119 I Alt. 2): versprochen/vertippt (11.000 statt 12.000 €).", "exam": true}, {"topic": "Unwirksamkeit", "front": "Eigenschaftsirrtum (§ 119 II)", "back": "Irrtum über verkehrswesentliche Eigenschaft = wertbildender Faktor (Echtheit, Alter). V verkauft „Picasso-Kopie“ für 1.000 €, es ist ein Original: V kann anfechten. Der Preis selbst ist keine Eigenschaft.", "exam": true}, {"topic": "Unwirksamkeit", "front": "Anfechtungsfristen", "back": "§§ 119, 120: unverzüglich = ohne schuldhaftes Zögern (§ 121 I). § 123 (Täuschung/Drohung): 1 Jahr ab Entdeckung (§ 124). Entdeckt 02.11.2026 → bis 02.11.2027, 24 Uhr.", "exam": true}, {"topic": "Unwirksamkeit", "front": "Vertrauensschaden (§ 122) – Fall Ferienwohnung", "back": "Wer wegen eigenen Irrtums anficht, ersetzt das negative Interesse. Paul: 4 € Porto + 600 € abgesagte Miete = 604 €; Obergrenze Erfüllungsinteresse 800 € ist eingehalten.", "exam": true}, {"topic": "Unwirksamkeit", "front": "Arglistige Täuschung durch Verschweigen (§ 123 I)", "back": "Möglich, wenn eine Aufklärungspflicht besteht. Gebrauchtwagenhändler verschweigt reparierten Unfall (200 €): K kann anfechten, Frist 1 Jahr (§ 124).", "exam": false}, {"topic": "Unwirksamkeit", "front": "Drei Altersstufen der Geschäftsfähigkeit", "back": "0–6: geschäftsunfähig, WE nichtig (§§ 104, 105). 7–17: beschränkt (§ 106). Ab 18: voll (§ 2).", "exam": true}, {"topic": "Unwirksamkeit", "front": "Lediglich rechtlich vorteilhaft (§ 107)", "back": "Nur, wenn der Minderjährige ausschließlich etwas bekommt. Geschenktes Fahrrad: wirksam. Saxophon (Wert 2.000 €) für 800 €: rechtlich nachteilig (Zahlungspflicht), wirtschaftlicher Vorteil zählt nicht.", "exam": true}, {"topic": "Unwirksamkeit", "front": "Einwilligung vs. Genehmigung", "back": "Einwilligung = vorher (§ 183). Fehlt sie: schwebend unwirksam (§ 108 I). Genehmigung = nachher, rückwirkend (§ 184 I); Verweigerung → endgültig unwirksam.", "exam": false}, {"topic": "Unwirksamkeit", "front": "Taschengeldparagraf (§ 110)", "back": "Wirksam, wenn der Minderjährige vollständig <b>bewirkt<\/b> (bezahlt) mit überlassenen Mitteln. Konsole 250 €: 160 € sofort + Raten → § 110 greift nicht.", "exam": true}, {"topic": "Unwirksamkeit", "front": "§ 108 II: Vertragspartner fordert die Eltern zur Erklärung auf", "back": "Genehmigung nur noch ihm gegenüber; eine vorher dem Kind gegenüber erklärte Verweigerung wird unwirksam. Schweigen 2 Wochen = verweigert (Skateboard-Fall).", "exam": true}, {"topic": "Vertretung", "front": "Voraussetzungen der Stellvertretung (§ 164)", "back": "1. eigene WE des Vertreters 2. im Namen des Vertretenen (Offenkundigkeit) 3. mit Vertretungsmacht 4. zulässig (nicht: Testament, Eheschließung). Folge: Vertrag mit dem Vertretenen.", "exam": true}, {"topic": "Vertretung", "front": "Vertreter oder Bote?", "back": "Vertreter hat Entscheidungsspielraum („gute Jacke, max. 100 €“). Bote überbringt fremde WE („Anzug Nr. 7 für 299 €“). 6-Jähriger mit genauem Einkaufszettel = Bote, Vertrag wirksam.", "exam": true}, {"topic": "Vertretung", "front": "Duldungs- vs. Anscheinsvollmacht", "back": "Duldung: Chef weiß, dass der Azubi für ihn bestellt, und zahlt wortlos. Anschein: Chef weiß es nicht, hätte es aber erkennen müssen. Beide Male gebunden, wenn der Dritte gutgläubig ist.", "exam": true}, {"topic": "Vertretung", "front": "Vertreter ohne Vertretungsmacht (§§ 177, 179)", "back": "Vertrag schwebend unwirksam (§ 177 I). Verweigert der Vertretene: Vertreter haftet – kannte er den Mangel, nach Wahl Erfüllung oder Schadensersatz (§ 179 I), sonst nur Vertrauensschaden (§ 179 II).", "exam": true}, {"topic": "Fristen", "front": "Fristberechnung (§§ 187 I, 188 II)", "back": "Ereignistag zählt nicht; Ende am gleichnamigen Tag um 24 Uhr. Zugang Fr 30.10.2026, 2 Wochen → Fr 13.11.2026, 24 Uhr.", "exam": true}, {"topic": "Fristen", "front": "Fristende am Wochenende (§ 193)", "back": "Ist eine WE abzugeben oder zu leisten und fällt der letzte Tag auf Sa, So oder Feiertag, gilt der nächste Werktag: Sa 12.12.2026 → Mo 14.12.2026.", "exam": false}, {"topic": "Fristen", "front": "Regelmäßige Verjährung (§§ 195, 199 I)", "back": "3 Jahre, Beginn mit Schluss des Jahres der Entstehung + Kenntnis. Anspruch vom 30.10.2026 verjährt mit Ablauf des 31.12.2029.", "exam": true}, {"topic": "Fristen", "front": "Was bewirkt die Verjährung?", "back": "Der Anspruch besteht weiter, der Schuldner darf die Leistung verweigern (Einrede, § 214 I). Wer trotzdem zahlt, kann nicht zurückfordern (§ 214 II).", "exam": false}, {"topic": "Schuldverhältnis", "front": "Trennungs- und Abstraktionsprinzip", "back": "Brezel kaufen = 3 Geschäfte: Kaufvertrag (§ 433) + 2 Übereignungen (§ 929). Die Übereignung ist auch wirksam, wenn der Kaufvertrag nichtig ist; Rückgabe dann über § 812.", "exam": true}, {"topic": "Schuldverhältnis", "front": "Stückschuld vs. Gattungsschuld", "back": "Stück: individuell (Einzelstück-Kleid). Gattung: nach Merkmalen (5 Zentner Kartoffeln), mittlere Art und Güte (§ 243 I); geht ein Sack kaputt, muss ein anderer geliefert werden.", "exam": false}, {"topic": "Schuldverhältnis", "front": "Konkretisierung (§ 243 II)", "back": "Holschuld: aussondern + bereitstellen. Bringschuld: beim Gläubiger anbieten. Schickschuld: ordnungsgemäß versenden. Danach Stückschuld.", "exam": true}, {"topic": "Schuldverhältnis", "front": "Aufrechnung (§§ 387–389)", "back": "Gegenseitigkeit, Gleichartigkeit, Gegenforderung fällig, Hauptforderung erfüllbar, Erklärung (§ 388). A schuldet 1.000 €, B schuldet 300 € → nach Aufrechnung nur noch 700 € (§ 389).", "exam": true}, {"topic": "Schuldverhältnis", "front": "Rücktritt vs. Kündigung", "back": "Rücktritt (§§ 346 ff.): Rückgewähr, ex tunc. Kündigung: Dauerschuldverhältnis endet nur für die Zukunft (ex nunc). Computer 1.500 €, 200 € Wertersatz → K bekommt ca. 1.300 € zurück.", "exam": false}, {"topic": "Störungen", "front": "Unmöglichkeit: Rechtsfolgen", "back": "Schuldner frei (§ 275 I), Gegenleistung entfällt (§ 326 I 1). Schadensersatz statt der Leistung nur bei Vertretenmüssen (§§ 280 I, III, 283), das vermutet wird (§ 280 I 2).", "exam": true}, {"topic": "Störungen", "front": "Anfängliche Unmöglichkeit: Gemälde verbrannte schon vor Vertragsschluss", "back": "Vertrag trotzdem wirksam (§ 311a I). V muss nicht liefern (§ 275 I), K nicht zahlen (§ 326 I). Schadensersatz nur, wenn V es kannte oder kennen musste (§ 311a II).", "exam": false}, {"topic": "Störungen", "front": "Schuldnerverzug (§ 286): Voraussetzungen", "back": "Fälliger, durchsetzbarer Anspruch · Nichtleistung trotz Möglichkeit · Mahnung (oder entbehrlich, § 286 II/III) · Vertretenmüssen (vermutet, § 286 IV; Geldmangel entlastet nie).", "exam": true}, {"topic": "Störungen", "front": "Wann ist keine Mahnung nötig? (§ 286 II)", "back": "Nr. 1 Kalenderdatum („bis 30.11.“) · Nr. 2 ab Ereignis berechenbar („10 Tage nach Lieferung“) · Nr. 3 ernsthafte Verweigerung · Nr. 4 besondere Gründe. „Zahlbar sofort“ reicht nicht.", "exam": true}, {"topic": "Störungen", "front": "30-Tage-Regel (§ 286 III) – Fliesenleger-Fall", "back": "Entgeltforderung: Verzug spätestens 30 Tage nach Fälligkeit + Rechnungszugang. Zugang 06.06. → Ende 06.07. → Verzug ab 07.07. Verbraucher nur bei Hinweis in der Rechnung.", "exam": false}, {"topic": "Störungen", "front": "Gläubigerverzug (§§ 293 ff.)", "back": "Schuldner bietet richtig an, Gläubiger nimmt nicht an – kein Verschulden nötig. Folgen: Schuldner haftet nur für Vorsatz/grobe Fahrlässigkeit (§ 300 I), Gegenleistung bleibt (§ 326 II).", "exam": true}, {"topic": "Störungen", "front": "Erfüllungsgehilfe (§ 278)", "back": "Schuldner haftet für Verschulden seiner Gehilfen wie für eigenes, ohne Entlastung. Gehilfe des Elektromeisters beschädigt das Dach → Erich zahlt Dach und Möbel.", "exam": false}, {"topic": "Störungen", "front": "c.i.c. (§§ 280 I, 311 II, 241 II)", "back": "Schon beim Anbahnen eines Vertrags gibt es Rücksichtspflichten. Kundin rutscht im Kaufhaus auf Obstrest aus → Arztkosten ersetzt. Vorteil ggü. § 823: § 278 ohne Entlastung, Verschulden vermutet.", "exam": true}, {"topic": "SE · AGB", "front": "Umfang des Schadensersatzes (§ 249)", "back": "Naturalrestitution, bei Sachschaden stattdessen Geld (§ 249 II 1), auch Folgeschäden. Rad: Reparatur 180 € + 20 € Bahnfahrt = 200 €.", "exam": false}, {"topic": "SE · AGB", "front": "Mitverschulden (§ 254)", "back": "Der Geschädigte trägt seinen Anteil. Wasserschaden 4.000 €, Anteil Eigentümer 25 % → 4.000 € · 75 % = 3.000 €.", "exam": false}, {"topic": "SE · AGB", "front": "Abtretung (§ 398)", "back": "Vertrag Alt- und Neugläubiger, Schuldner muss nicht mitwirken. Er behält alle Einwendungen (§ 404); zahlt er ahnungslos an den Altgläubiger, wird er frei (§ 407).", "exam": false}, {"topic": "SE · AGB", "front": "AGB-Prüfung: Reihenfolge", "back": "1. AGB? (§ 305 I) 2. Einbeziehung (§ 305 II) 3. Individualabrede (§ 305b), überraschend (§ 305c I) 4. Auslegung (§ 305c II) 5. Inhaltskontrolle § 309 → § 308 → § 307 6. Folge § 306.", "exam": true}, {"topic": "SE · AGB", "front": "Einbeziehung von AGB (§ 305 II)", "back": "Ausdrücklicher Hinweis <b>bei<\/b> Vertragsschluss + zumutbare Kenntnisnahme + Einverständnis. AGB auf der Rückseite des Lieferscheins: zu spät, nicht einbezogen.", "exam": true}, {"topic": "SE · AGB", "front": "Fitnessstudio-AGB (§ 309 Nr. 9, Nr. 13)", "back": "Erstlaufzeit 24 Monate: wirksam. Verlängerung um 12 Monate: unwirksam. 3 Monate Kündigungsfrist: unwirksam (max. 1 Monat). „Nur per Einschreiben“: unwirksam (max. Textform).", "exam": true}, {"topic": "SE · AGB", "front": "Rechtsfolge unwirksamer AGB (§ 306)", "back": "Vertrag bleibt im Übrigen wirksam, an die Stelle tritt das Gesetz. Keine geltungserhaltende Reduktion: „Jede Haftung ausgeschlossen“ fällt komplett weg.", "exam": false}, {"topic": "Unwirksamkeit", "front": "Saxophon-Fall (Skript S. 22): Hans (17) kauft ein Saxophon (Wert 2.000 €) für 800 €. Ergebnis laut offizieller Lösung?", "back": "Annahme rechtlich <b>nachteilig<\/b> (Zahlungspflicht), der wirtschaftliche Vorteil zählt nicht (§ 107). Ergebnis der offiziellen Lösung: <b>kein wirksamer Kaufvertrag<\/b>.", "exam": true}, {"topic": "Unwirksamkeit", "front": "DVD-Player-Fall: Max (17) bekommt 250 € für „einen DVD-Player“ und zahlt 249 €. Prüfreihenfolge laut offizieller Lösung?", "back": "§ 107 a) rechtlich vorteilhaft? (–) · b) Einwilligung? (–), weil bei der Geldübergabe noch kein <b>konkreter<\/b> Player feststand · § 110 (+): Mittel zu diesem Zweck überlassen und voll bezahlt ⇒ Vertrag wirksam, Huber hat einen Kaufpreisanspruch.", "exam": true}], "quiz": [{"topic": "Fall lösen", "q": "Welcher Satz ist im Gutachtenstil formuliert?", "options": ["„Der Anspruch besteht, denn V hat angenommen.“", "„Ergebnis zuerst: K bekommt die Kamera.“", "„K hat einen Anspruch, weil ein Vertrag vorliegt.“", "„K könnte gegen V einen Anspruch aus § 433 I 1 BGB haben.“"], "correct": 3, "explain": "Der Gutachtenstil beginnt mit einem Obersatz im Konjunktiv („könnte“). „Weil“ und „denn“ zeigen den Urteilsstil."}, {"topic": "WE & Vertrag", "q": "Lea bietet Tom ihr Fahrrad schriftlich für 200 € an, „Antwort bis Freitag“. Tom schreibt am Donnerstag: „Einverstanden, aber nur für 180 €.“ Vertrag?", "options": ["Ja, über 200 €, weil Tom vor Freitag geantwortet hat", "Ja, über 180 €", "Nein – das ist eine Ablehnung mit neuem Angebot über 180 € (§ 150 II)", "Ja, über 190 € als Mittelwert"], "correct": 2, "explain": "Eine Annahme mit Änderungen gilt als Ablehnung plus neues Angebot. Leas Angebot ist erloschen (§ 146)."}, {"topic": "WE & Vertrag", "q": "K sieht im Schaufenster eine Kamera für 399 € und sagt im Laden: „Ich kaufe sie.“ V hat sie schon an X verkauft. Vertrag zwischen K und V?", "options": ["Nein, weil Kaufverträge über 300 € schriftlich sein müssen", "Ja, V hat mit dem Schaufenster ein bindendes Angebot gemacht", "Ja, aber V kann wegen Irrtums anfechten", "Nein – das Schaufenster ist nur eine invitatio ad offerendum, V hat Ks Angebot nicht angenommen"], "correct": 3, "explain": "Erst K gibt das Angebot ab. V nimmt es nicht an, also kein Vertrag (Skriptfall Vertrag 1)."}, {"topic": "WE & Vertrag", "q": "Müller muss bis 30.06. kündigen und wirft die Kündigung am 30.06. um 23 Uhr in den Geschäftsbriefkasten des Vermieters. Rechtzeitig?", "options": ["Nein, eine Kündigung muss immer per Einschreiben kommen", "Ja, Einwurf vor 24 Uhr genügt immer", "Nein – sie geht erst am nächsten Morgen zu Geschäftsbeginn zu", "Ja, weil nur die Abgabe zählt"], "correct": 2, "explain": "Zugang erfordert die Möglichkeit der Kenntnisnahme unter normalen Umständen (§ 130 I 1); ein Büro leert nachts nicht den Briefkasten."}, {"topic": "WE & Vertrag", "q": "Ein Brief wird Dienstag um 10 Uhr in Ms Hausbriefkasten geworfen. M ist zwei Wochen im Urlaub. Wann ist er zugegangen?", "options": ["Erst nach Ms Rückkehr", "Erst wenn M ihn liest", "Am Dienstag", "Gar nicht, M war ja abwesend"], "correct": 2, "explain": "Entscheidend ist die Möglichkeit der Kenntnisnahme, nicht das tatsächliche Lesen. Der Urlaub ist Ms Risiko."}, {"topic": "WE & Vertrag", "q": "Müller gibt seine Kündigung der 4-jährigen Tochter des Vermieters. Das Kind wirft sie weg. Folge?", "options": ["Zugegangen – das Kind ist Empfangsbote", "Nicht zugegangen – das Kind ist Erklärungsbote, das Risiko trägt Müller", "Die Kündigung ist nichtig nach § 105", "Zugegangen, sobald das Kind sie annimmt"], "correct": 1, "explain": "Eine Vierjährige ist nicht zum Empfang ermächtigt; Verlust geht zulasten des Erklärenden (Skriptfall Zugang 2)."}, {"topic": "WE & Vertrag", "q": "A wirft Montag eine Kündigung ein. Dienstag 8 Uhr ruft er an und widerruft. Der Brief kommt Dienstag 11 Uhr an. Wirksam?", "options": ["Ja, ein Widerruf muss schriftlich sein", "Nein – der Widerruf ging vorher zu (§ 130 I 2)", "Ja, der Brief war schon abgegeben", "Nur wenn der Empfänger zustimmt"], "correct": 1, "explain": "Ein Widerruf hindert die Wirksamkeit, wenn er vorher oder gleichzeitig zugeht."}, {"topic": "WE & Vertrag", "q": "Die Schnellversand GmbH schickt K unbestellt eine CD für 15 €: „Wenn Sie nicht binnen 2 Wochen zurückschicken, gilt das als Annahme.“ K legt sie beiseite. Muss K zahlen?", "options": ["Nur die Hälfte, 7,50 €", "Ja, nach 2 Wochen gilt der Vertrag", "Ja, weil ein Rückumschlag beilag", "Nein – Schweigen ist keine Annahme, § 241a schließt Ansprüche aus"], "correct": 3, "explain": "Schweigen hat keinen Erklärungswert und kann vom Absender nicht einseitig umdefiniert werden (§ 241a)."}, {"topic": "WE & Vertrag", "q": "A verkauft B per Handschlag sein Grundstück für 80.000 €. Wirksam?", "options": ["Ja, aber nur bis 50.000 €", "Ja, Verträge sind formfrei", "Schwebend unwirksam bis zur Genehmigung", "Nein – ohne notarielle Beurkundung nichtig (§§ 311b I 1, 125)"], "correct": 3, "explain": "Grundstückskauf braucht den Notar; Heilung nur durch Auflassung und Grundbucheintrag (§ 311b I 2)."}, {"topic": "Unwirksamkeit", "q": "Autohändler A will 12.000 € schreiben, vertippt sich auf 11.000 €. Welcher Irrtum?", "options": ["Inhaltsirrtum, § 119 I Alt. 1", "Erklärungsirrtum, § 119 I Alt. 2", "Motivirrtum, keine Anfechtung", "Eigenschaftsirrtum, § 119 II"], "correct": 1, "explain": "Wer sich verschreibt oder vertippt, erklärt etwas, das er so gar nicht erklären wollte."}, {"topic": "Unwirksamkeit", "q": "B kauft eine „Vase aus der Ming-Dynastie“; sie stammt von 1990. Welcher Anfechtungsgrund?", "options": ["Keiner, das ist Motivirrtum", "Eigenschaftsirrtum, § 119 II", "Übermittlungsirrtum, § 120", "Erklärungsirrtum, § 119 I Alt. 2"], "correct": 1, "explain": "Alter und Echtheit sind verkehrswesentliche, wertbildende Eigenschaften."}, {"topic": "Unwirksamkeit", "q": "C kauft Geschenkpapier für eine Feier, die dann abgesagt wird. Kann C anfechten?", "options": ["Ja, nach § 119 II", "Nein – reiner Motivirrtum", "Ja, nach § 119 I Alt. 1", "Ja, innerhalb eines Jahres nach § 124"], "correct": 1, "explain": "Ein Irrtum nur über Beweggründe berechtigt nicht zur Anfechtung."}, {"topic": "Unwirksamkeit", "q": "Frau Maier ficht ihre Ferienwohnungsbuchung (800 €) wegen Verschreibens an. Paul hatte 4 € Porto und sagte für 600 € eine andere Familie ab. Wie viel Vertrauensschaden schuldet sie?", "options": ["604 €", "1.404 €", "4 €", "800 €"], "correct": 0, "explain": "§ 122 I: 4 € + 600 € = 604 €; die Obergrenze (Erfüllungsinteresse 800 €) ist nicht überschritten."}, {"topic": "Unwirksamkeit", "q": "Der 15-jährige Jonas bekommt ohne Wissen der Eltern von seinem Onkel ein Mofa geschenkt. Schenkung wirksam?", "options": ["Ja – lediglich rechtlich vorteilhaft (§ 107)", "Nur mit Genehmigung des Familiengerichts", "Nein, nichtig (§ 105)", "Nein, schwebend unwirksam (§ 108)"], "correct": 0, "explain": "Jonas bekommt nur etwas und muss nichts leisten; spätere Kosten sind nur wirtschaftliche Folgen."}, {"topic": "Unwirksamkeit", "q": "Paul (17) kauft eine Konsole für 250 €: 160 € aus Taschengeld sofort, Rest in Raten. Die Eltern sind dagegen. Rechtslage?", "options": ["Wirksam nach § 110", "Wirksam, weil Taschengeld zur freien Verfügung ist", "Wirksam in Höhe von 160 €", "Endgültig unwirksam – § 110 greift nicht, weil nicht vollständig bezahlt"], "correct": 3, "explain": "„Bewirkt“ heißt vollständig bezahlt. Ohne Einwilligung schwebend unwirksam, die Ablehnung der Eltern macht es endgültig."}, {"topic": "Unwirksamkeit", "q": "Max (17) bekommt 250 € von den Eltern, um sich einen DVD-Player zu kaufen, und zahlt 249 € bar. Huber fragt danach die Eltern, die schweigen. Rechtslage?", "options": ["Schwebend unwirksam", "Vertrag wirksam nach § 110", "Nach 2 Wochen Schweigen gilt die Genehmigung als verweigert", "Nichtig, weil Max minderjährig ist"], "correct": 1, "explain": "Die Einwilligung wird verneint, weil noch kein konkreter Player feststand. Aber § 110 greift: Max hat mit zweckgebunden überlassenen Mitteln voll bezahlt. Der Vertrag ist von Anfang an wirksam, § 108 II läuft ins Leere."}, {"topic": "Vertretung", "q": "Eine Mutter schickt ihren 6-jährigen Sohn mit einem genauen Einkaufszettel zum Bäcker. Vertrag?", "options": ["Nein, der Sohn ist geschäftsunfähig", "Schwebend unwirksam bis zur Genehmigung", "Ja, zwischen Mutter und Bäcker – der Sohn ist Bote", "Ja, zwischen Sohn und Bäcker"], "correct": 2, "explain": "Ein Bote überbringt eine fremde WE und braucht keine Geschäftsfähigkeit."}, {"topic": "Vertretung", "q": "V soll für B einen Kaffeevollautomaten kaufen, kauft aber in Bs Namen ein Smartphone bei X. B verweigert. Was kann X tun?", "options": ["Von V nach Wahl Erfüllung oder Schadensersatz verlangen (§ 179 I)", "Von B zahlen lassen, die Vollmacht reicht", "Nichts, der Vertrag ist für alle nichtig", "Nur von B Vertrauensschaden verlangen"], "correct": 0, "explain": "V handelte ohne Vertretungsmacht und kannte den Mangel; nach Verweigerung haftet er selbst."}, {"topic": "Vertretung", "q": "Ein Angestellter bestellt seit Monaten ohne Vollmacht im Namen des Chefs. Der Chef weiß es und zahlt jedes Mal. Ist der Chef gebunden?", "options": ["Ja – Duldungsvollmacht", "Ja – Anscheinsvollmacht", "Nein, es gibt keine Vollmacht", "Nein, der Angestellte haftet allein nach § 179"], "correct": 0, "explain": "Der Chef weiß vom Auftreten und unternimmt nichts; das ist der Fall der Duldungsvollmacht."}, {"topic": "Fristen", "q": "Die Aufforderung nach § 108 II geht den Eltern am Fr 30.10.2026 zu. Wann endet die Zwei-Wochen-Frist?", "options": ["So 15.11.2026, 24 Uhr", "Do 12.11.2026, 24 Uhr", "Fr 13.11.2026, 24 Uhr", "Mo 16.11.2026, 24 Uhr"], "correct": 2, "explain": "Der Zugangstag zählt nicht (§ 187 I); Ende am gleichnamigen Wochentag zwei Wochen später (§ 188 II)."}, {"topic": "Fristen", "q": "Ein Kaufpreisanspruch entsteht am 30.10.2026, der Verkäufer kennt den Käufer. Wann verjährt er?", "options": ["Am 30.10.2028", "Am 30.10.2029", "Am 31.12.2028", "Mit Ablauf des 31.12.2029"], "correct": 3, "explain": "3 Jahre (§ 195), Beginn mit Schluss des Jahres 2026 (§ 199 I)."}, {"topic": "Schuldverhältnis", "q": "A schuldet B 1.000 € (fällig). B schuldet A 300 € aus einem Darlehen, fällig erst in 3 Monaten. Wer kann heute aufrechnen?", "options": ["Nur A", "Beide", "Keiner", "Nur B"], "correct": 3, "explain": "Die Gegenforderung des Aufrechnenden muss fällig sein: As 300 € sind es nicht, Bs 1.000 € schon. B darf seine eigene Schuld vorzeitig erfüllen."}, {"topic": "Störungen", "q": "Vor der Übergabe brennt der verkaufte Gebrauchtwagen ohne Verschulden des V aus. Rechtsfolge?", "options": ["V muss nicht liefern, K nicht zahlen, kein Schadensersatz", "V schuldet Schadensersatz nach § 283", "V muss einen gleichwertigen Wagen liefern", "K muss zahlen, weil der Vertrag geschlossen war"], "correct": 0, "explain": "Stückschuld unmöglich → § 275 I; Kaufpreis entfällt nach § 326 I; ohne Vertretenmüssen kein Schadensersatz."}, {"topic": "Störungen", "q": "Fliesenleger S schickt eine Rechnung über 2.500 €, „zahlbar sofort“, Zugang beim Restaurantbetreiber B am 06.06. Keine Mahnung. Ab wann ist B in Verzug?", "options": ["Ab 06.06.", "Nie, ohne Mahnung kein Verzug", "Ab 07.07.", "Ab 07.06."], "correct": 2, "explain": "„Zahlbar sofort“ ist keine Mahnung; § 286 III: 30 Tage ab Zugang, Ende 06.07., Verzug ab 07.07."}, {"topic": "Störungen", "q": "Rechnung: „Zahlbar bis 30.11.2026“. Der Kunde zahlt nicht. Braucht es eine Mahnung für den Verzug?", "options": ["Nein – Kalenderdatum, § 286 II Nr. 1", "Nein, aber erst nach 30 Tagen", "Ja, aber nur bei Verbrauchern", "Ja, immer"], "correct": 0, "explain": "Ist die Leistungszeit nach dem Kalender bestimmt, ist die Mahnung entbehrlich."}, {"topic": "Störungen", "q": "Das Taxi soll dich um 6 Uhr zum Flug um 8 Uhr bringen und kommt um 9 Uhr. Was liegt vor?", "options": ["Gläubigerverzug", "Unmöglichkeit (absolutes Fixgeschäft)", "Schuldnerverzug", "Wegfall der Geschäftsgrundlage"], "correct": 1, "explain": "Die Fahrt zum Flug kann nicht sinnvoll nachgeholt werden; § 275 I, du musst nicht zahlen (§ 326 I)."}, {"topic": "Störungen", "q": "Bauer Paul soll Kartoffeln bringen. Hans sagt am Telefon: „Komm gar nicht, ich nehme sie nicht.“ Die bereitgestellten Kartoffeln werden gestohlen. Muss Hans zahlen?", "options": ["Nur die Hälfte", "Nein, Paul muss neue Kartoffeln bringen", "Ja – Annahmeverzug, Paul behält den Kaufpreisanspruch (§ 326 II)", "Nein, § 326 I"], "correct": 2, "explain": "Wörtliches Angebot genügt (§ 295), Leistungsgefahr ging über (§ 300 II), Gegenleistungsgefahr nach § 326 II."}, {"topic": "SE · AGB", "q": "Ein Möbelhaus druckt seine AGB auf den Lieferschein; beim Kauf im Laden war davon keine Rede. Gelten sie?", "options": ["Nein – kein Hinweis bei Vertragsschluss (§ 305 II Nr. 1)", "Ja, mit Annahme der Lieferung", "Nur gegenüber Verbrauchern", "Ja, AGB gelten immer"], "correct": 0, "explain": "Der Hinweis muss bei Vertragsschluss erfolgen; danach gilt das Gesetz (§ 306 II)."}]}, "bwl": {"cards": [{"topic": "Einführung", "front": "Produktionsfaktoren nach Gutenberg", "back": "Elementarfaktoren: ausführende Arbeit, Betriebsmittel (Maschinen, Gebäude), Werkstoffe. Dispositiver Faktor: Management (Planung, Organisation, Kontrolle).", "exam": false}, {"topic": "Einführung", "front": "Drei Werkstoffarten mit Beispiel (Möbelfabrik)", "back": "Rohstoff = Hauptbestandteil (Holz) · Hilfsstoff = Nebenbestandteil (Schrauben, Leim) · Betriebsstoff = geht nicht ins Produkt ein (Strom, Schmieröl).", "exam": true}, {"topic": "Einführung", "front": "Entscheidungsprozess nach Heinen", "back": "5 Phasen: Anregung → Suche → Auswahl → Vollzug → Kontrolle.", "exam": true}, {"topic": "Einführung", "front": "Regelkreis (Ulrich): Fehlzeiten-Beispiel", "back": "Führungsgröße (Soll) max. 3 % · Regelgröße (Ist) 15 % · Störgröße autoritärer Führungsstil · Regler Controller · Stellgröße: Vorgesetzten anders einsetzen.", "exam": false}, {"topic": "Einführung", "front": "Ökonomisches Prinzip", "back": "Maximalprinzip: Input fest, Output max. · Minimalprinzip: Output fest, Input min. · Optimumprinzip: bestes Verhältnis. „Mit minimalem Einsatz maximalen Ertrag“ ist unsinnig.", "exam": true}, {"topic": "Einführung", "front": "Strom im Industriebetrieb vs. Katzenfutter im Haushalt", "back": "Strom: Verbrauchsgut + Investitionsgut. Katzenfutter: Verbrauchsgut + Konsumgut. Entscheidend ist der Verwendungszweck; leere Felder mit Strich (Musterklausur 1c).", "exam": true}, {"topic": "Einführung", "front": "Produktivität, Wirtschaftlichkeit, Rentabilität", "back": "Produktivität = Output/Input (Mengen) · Wirtschaftlichkeit = Ertrag/Aufwand (Werte, Faktor, >1 Gewinn) · Rentabilität = Gewinn · 100 / Kapital (%).", "exam": true}, {"topic": "Einführung", "front": "Musterklausur 1b: p 300 €, k<sub>v<\/sub> 250 €, K<sub>fix<\/sub> 2 Mio., 120.000 Stück, 80.000 h, EK 20 Mio.", "back": "Umsatz 36 Mio., Kosten 32 Mio., Gewinn 4 Mio. → Wirtschaftlichkeit 36/32 = 1,125 · Arbeitsprod. 1,5 Stück/h · EK-Rentabilität 4/20 · 100 = 20 %.", "exam": true}, {"topic": "Einführung", "front": "Gesamtkapitalrentabilität", "back": "(Gewinn + FK-Zinsen) · 100 / GK. Beispiel: (80.000 + 20.000) · 100 / 1.000.000 = 10 %. Falle: FK-Zinsen nicht vergessen.", "exam": false}, {"topic": "Betrieb & Ziele", "front": "Vision vs. Mission", "back": "Vision = Bild der erreichbaren Zukunft („Wo wollen wir hin?“). Mission = Zweck des heutigen Handelns („Wozu sind wir da?“), unverzichtbar.", "exam": false}, {"topic": "Betrieb & Ziele", "front": "SMART-Ziel", "back": "Spezifisch, Messbar, Akzeptiert, Realistisch, Terminiert. Beispiel: „Umsatz im Online-Shop in Deutschland bis 31.12.2027 um 10 % gegenüber 2026 steigern.“", "exam": false}, {"topic": "Betrieb & Ziele", "front": "Schwellen der Mitbestimmung", "back": "Betriebsrat ab 5 AN · Wirtschaftsausschuss > 100 AN · Aufsichtsrat Drittelbeteiligung > 500 AN · paritätisch > 2.000 AN.", "exam": true}, {"topic": "Rechtsformen", "front": "Haftung bei OHG / Komplementär", "back": "Unbeschränkt (auch Privatvermögen), unmittelbar (Gläubiger direkt an jeden), solidarisch (jeder für alle Schulden).", "exam": true}, {"topic": "Rechtsformen", "front": "OHG-Gewinnverteilung seit 2024 (MoPeG)", "back": "Vertrag → Beteiligungsverhältnis/Wert der Beiträge → nach Köpfen. Die 4-%-Regel gilt nicht mehr. Nichts vereinbart, 100.000 € Gewinn, 2 Gesellschafter → je 50.000 €.", "exam": true}, {"topic": "Rechtsformen", "front": "Rechenschema KG-Gewinnverteilung", "back": "1. Zinsen (falls vereinbart, K · p · Tage / 36.000) 2. Tätigkeitsvergütung nur Komplementäre (monatlich × 12) 3. Rest nach Schlüssel.", "exam": false}, {"topic": "Rechtsformen", "front": "Musterklausur 2a: Gewinn 450.000 €, Komplementär C 10.000 €/Monat, Einlagen A 150 / B 300 / C 50 Tsd.", "back": "TV C = 120.000 €; Rest 330.000 € im Verhältnis 30/60/10 % → A 99.000 € · B 198.000 € · C 33.000 + 120.000 = 153.000 €.", "exam": true}, {"topic": "Rechtsformen", "front": "Haftung des Kommanditisten", "back": "Nur bis zur eingetragenen Haftsumme, unmittelbar nur für den nicht eingezahlten Teil: Haftsumme 50.000 €, eingezahlt 30.000 € → noch 20.000 €. Vor HR-Eintrag haftet er voll.", "exam": false}, {"topic": "Rechtsformen", "front": "GmbH: Mindesteinzahlung", "back": "Stammkapital mind. 25.000 €; vor Anmeldung 25 % je Anteil <b>und<\/b> insgesamt mind. 12.500 €. 25 % von 25.000 € (6.250 €) reichen nicht.", "exam": true}, {"topic": "Rechtsformen", "front": "GmbH-Stimmrecht (Übung 18)", "back": "1 € Nennbetrag = 1 Stimme. Bertrand 30.000 + Schneider 51.000 = 81.000 > Wehrle 69.000 → Schneider wird Geschäftsführer.", "exam": false}, {"topic": "Rechtsformen", "front": "UG: Zwangsthesaurierung", "back": "Jährlich 25 % des Jahresüberschusses (minus Verlustvortrag) in die gesetzliche Rücklage, bis über Kapitalerhöhung aus Gesellschaftsmitteln 25.000 € erreicht sind → Umfirmierung zur GmbH. Bsp.: (8.000 − 2.000) · 25 % = 1.500 €.", "exam": true}, {"topic": "Rechtsformen", "front": "Organe der AG", "back": "Vorstand = Leitungsorgan · Aufsichtsrat = Überwachungsorgan (bestellt Vorstand) · Hauptversammlung = Beschlussfassungsorgan (wählt AR). Merksatz: HV wählt AR → AR bestellt Vorstand.", "exam": true}, {"topic": "Rechtsformen", "front": "HR-Eintrag deklaratorisch vs. konstitutiv", "back": "Deklaratorisch (bestätigt nur): e. K., OHG, KG, Prokura. Konstitutiv (erzeugt): GmbH, AG, Kannkaufmann – die GmbH entsteht erst mit Eintrag.", "exam": false}, {"topic": "Rechtsformen", "front": "Mindestkapital AG / SE und Agio", "back": "AG und KGaA 50.000 €, SE 120.000 €. Agio = Ausgabebetrag − Nennwert: 1 Mio. Aktien à 1 €, ausgegeben zu 3 € → 2 Mio. € Kapitalrücklage.", "exam": false}, {"topic": "Kooperation & Konzentration", "front": "Kooperation vs. Konzentration", "back": "Kooperation: Vertrag, wirtschaftliche Selbstständigkeit teilweise erhalten (Kartell, Franchise, Joint Venture). Konzentration: einheitliche Leitung (Konzern, Fusion).", "exam": true}, {"topic": "Kooperation & Konzentration", "front": "Horizontal, vertikal, anorganisch", "back": "Horizontal: gleiche Stufe (Schuhfabrik + Schuhfabrik) · vertikal: aufeinanderfolgende Stufen (Schuhfabrik + Schuhhandel) · anorganisch: andere Branchen (Brauerei + Verlag).", "exam": true}, {"topic": "Kooperation & Konzentration", "front": "Konzern vs. Fusion", "back": "Konzern: rechtlich selbstständig, wirtschaftlich unselbstständig (einheitliche Leitung, § 18 AktG). Fusion: beides verloren (Aufnahme oder Neugründung).", "exam": false}, {"topic": "Kooperation & Konzentration", "front": "Kartellarten", "back": "Preis-, Mengen-/Quoten-, Konditionen-/Rabatt-, Submissions-, Gebietskartell. Grundsätzlich verboten (§ 1 GWB); erlaubt z. B. Mittelstandskartell (§ 3).", "exam": false}, {"topic": "Standort", "front": "Drei Zielkategorien von Standortentscheidungen", "back": "Wachstum (errichten/erweitern: neue Absatzmärkte) · Strukturveränderung (verlagern/vereinigen: Arbeitskosten, Wechselkurse, Steuern) · Schrumpfung (stilllegen: Kapazität, Sortiment verkleinern).", "exam": true}, {"topic": "Standort", "front": "Nutzwertanalyse: Ablauf", "back": "Kriterien festlegen → gewichten (Σ = 100) → Erfüllungsgrad je Standort (0–10, höher = besser) → Gewicht · Punkte → summieren → höchster Nutzwert gewinnt.", "exam": true}, {"topic": "Standort", "front": "Übung 26 (Maschinenbau-Werk): Ergebnis der NWA", "back": "Deutschland 555 · USA 660 · Tschechien 630 → USA hat den höchsten Nutzwert. Kritik: Gewichte und Punkte sind subjektiv.", "exam": true}, {"topic": "Rechnungswesen", "front": "Auszahlung, Ausgabe, Aufwand, Kosten", "back": "Auszahlung: flüssige Mittel · Ausgabe: Geldvermögen (inkl. Forderungen/Verbindlichkeiten) · Aufwand: Erfolg (GuV) · Kosten: betrieblicher Werteverzehr. Spende = neutraler Aufwand, keine Kosten.", "exam": false}, {"topic": "Rechnungswesen", "front": "Bilanzgleichung", "back": "AV + UV = Gesamtvermögen = Gesamtkapital = EK + FK. Aktiva nach Liquidität, Passiva nach Fälligkeit. Bsp.: AV 70.000 + UV 175.000 = 245.000 €.", "exam": false}, {"topic": "Rechnungswesen", "front": "Zweipunktverfahren (Musterklausur 3): (700 | 80.000 €), (1.400 | 150.000 €)", "back": "k<sub>v<\/sub> = 70.000 / 700 = 100 €/Stück · K<sub>fix<\/sub> = 80.000 − 100 · 700 = 10.000 € · K(15.000) = 10.000 + 1.500.000 = 1.510.000 €. Immer kleinste und größte Menge.", "exam": true}, {"topic": "Rechnungswesen", "front": "Deckungsbeitrag (Musterklausur 4)", "back": "A: 75 − 40 = 35 € · 3.500 = 122.500 € · B: 95 − 45 = 50 € · 3.000 = 150.000 € · 272.500 − K<sub>fix<\/sub> 275.000 = −2.500 € Betriebsergebnis.", "exam": true}, {"topic": "Rechnungswesen", "front": "Break-even-Menge", "back": "x<sub>BE<\/sub> = K<sub>fix<\/sub> / (p − k<sub>v<\/sub>). Übung 28h: 120.000 / (77 − 45) = 3.750 Stück, Umsatz 3.750 · 77 = 288.750 €.", "exam": true}, {"topic": "Rechnungswesen", "front": "Preisuntergrenzen", "back": "Kurzfristig = k<sub>v<\/sub>; langfristig = k<sub>v<\/sub> + K<sub>fix<\/sub>/x. Übung 28f: 60 € bzw. 60 + 115.000/7.000 = 76,43 €.", "exam": false}, {"topic": "Rechnungswesen", "front": "Make-or-buy (Übung 28g)", "back": "100.000 + 20x = 30x → kritische Menge 10.000 Stück. Bedarf 20.000 > 10.000 → Eigenfertigung (500.000 statt 600.000 €).", "exam": false}, {"topic": "Planung & Kontrolle", "front": "ROI nach DuPont (Musterklausur 5a): Umsatz 3 Mio., Kosten 2,7 Mio., AV 1,7 Mio., UV 0,7 Mio., EK 0,9 Mio.", "back": "Gewinn 300.000 € · Kapitalumschlag 3/2,4 = 1,25 (125 %) · Umsatzrentabilität 10 % · ROI = 10 % · 1,25 = 12,5 % · FK = 2,4 − 0,9 = 1,5 Mio. €.", "exam": true}, {"topic": "Planung & Kontrolle", "front": "Anforderungen an Kennzahlen (Musterklausur 5b)", "back": "Inhaltlich aktuell · kurzfristig verfügbar · grafisch aufbereitet · ad hoc erzeugbar (3 nennen).", "exam": true}, {"topic": "Kommt nicht dran (Kap. 7 Rest, 8, 10)", "front": "Top-down, Bottom-up, Gegenstrom", "back": "Top-down (retrograd): oben → unten, evtl. unrealistisch. Bottom-up (progressiv): unten planen, oben zusammenfassen. Gegenstrom: Rahmen von oben, Präzisierung von unten.", "exam": false}, {"topic": "Planung & Kontrolle", "front": "Balanced Scorecard: vier Perspektiven", "back": "Finanzen · Kunden · Prozesse · Mitarbeiter/Potenzial. Ursache-Wirkung: Mitarbeiter → Prozesse → Kunden → Finanzen.", "exam": false}, {"topic": "Kommt nicht dran (Kap. 7 Rest, 8, 10)", "front": "Five Forces (Porter)", "back": "Macht der Lieferanten · Macht der Kunden · neue Wettbewerber · Ersatzprodukte · Wettbewerbsintensität in der Branche.", "exam": false}, {"topic": "Kommt nicht dran (Kap. 7 Rest, 8, 10)", "front": "Instanz vs. Stabsstelle", "back": "Instanz: Leitungs- und Weisungsbefugnis. Stabsstelle: Leitungshilfe, nur beratend, kein Weisungsrecht.", "exam": false}, {"topic": "Kommt nicht dran (Kap. 7 Rest, 8, 10)", "front": "Leitungsspanne und Leitungstiefe", "back": "Spanne = Zahl der direkt unterstellten Stellen (Kaufm. Leiter mit 2 Abteilungsleitern → 2). Tiefe = Zahl der Hierarchieebenen.", "exam": false}, {"topic": "Kommt nicht dran (Kap. 7 Rest, 8, 10)", "front": "Einlinien-, Mehrlinien-, Stab-Linien-, Matrixorganisation", "back": "Einlinien: ein Weisungsweg, klar, aber lang · Mehrlinien: mehrere Vorgesetzte (Taylor) · Stab-Linien: Stäbe entlasten · Matrix: zwei Dimensionen, Kompetenzstreit möglich.", "exam": false}, {"topic": "Kommt nicht dran (Kap. 7 Rest, 8, 10)", "front": "Funktional vs. divisional", "back": "Funktional = nach Verrichtung (Einkauf, Produktion, Vertrieb). Divisional = nach Objekt (Produkte, Regionen), Sparten oft Profit Center.", "exam": false}, {"topic": "Materialwirtschaft", "front": "ABC-Analyse", "back": "A ≈ 20 % Menge / 80 % Wert · B ≈ 30 % / 10 % · C ≈ 50 % / 10 %. Ablauf: Wert = Menge · Preis, absteigend sortieren, kumulieren, einteilen.", "exam": true}, {"topic": "Materialwirtschaft", "front": "Musterklausur 7a: PP 25.000 t · 1.750 €, Gesamtwert 90 Mio. €", "back": "43,75 Mio. € / 90 Mio. € = 48,61 % → A-Gut. Gleichmäßiger Verbrauch + hohe Lagerkosten → JIT sinnvoll.", "exam": true}, {"topic": "Materialwirtschaft", "front": "Andler + Meldebestand (Musterklausur 6)", "back": "Bedarf 2 · 3.350 = 6.700; x<sub>opt<\/sub> = √(2 · 6.700 · 400 / (6.000 · 0,12)) ≈ 86 · Bestellungen ≈ 78 · Meldebestand = 50 + 9 · 3.350/130 ≈ 282.", "exam": true}, {"topic": "Materialwirtschaft", "front": "Meldebestand (Formel)", "back": "Sicherheitsbestand + Lieferzeit · Tagesverbrauch. Übung 42: 100 + 14 · 20 = 380 Stück. Hängt nicht von der Bestellmenge ab.", "exam": false}, {"topic": "Materialwirtschaft", "front": "Nachteile von Just-in-time (Musterklausur 7b)", "back": "Enge Lieferantenbindung/Abhängigkeit · hohe Preise · Störanfälligkeit (Stau, Streik) · Umweltbelastung durch mehr Verkehr.", "exam": true}, {"topic": "Materialwirtschaft", "front": "Lagerkennzahlen (Übung 50)", "back": "Umschlagshäufigkeit = Verbrauch / Ø Bestand = 331 / 41 ≈ 8 · Ø Lagerdauer = 360 / 8 = 45 Tage · Lagerzinssatz = 10 % · 45/360 = 1,25 %.", "exam": false}, {"topic": "Kommt nicht dran (Kap. 7 Rest, 8, 10)", "front": "Fertigungstypen nach Raum", "back": "Punkt (Werkstück bleibt: Hausbau, Autoreparatur) · Werkstatt (gleiche Maschinen zusammen: Dreherei) · Fließ (nach Ablauf: Automontage) · Gruppe (Kompromiss).", "exam": false}, {"topic": "Kommt nicht dran (Kap. 7 Rest, 8, 10)", "front": "Supply Chain Management", "back": "Koordination von Material-, Geld- und Informationsfluss über die ganze Lieferkette. Bsp.: Autohersteller teilt Produktionsplan in Echtzeit mit Sitzlieferant und Spedition.", "exam": false}, {"topic": "Marketing: Grundlagen", "front": "Bedürfnis → Bedarf → Nachfrage", "back": "Bedürfnis = Mangelgefühl + Wunsch · Bedarf = mit Kaufkraft befriedigbar · Nachfrage = am Markt wirksam.", "exam": false}, {"topic": "Marketing: Grundlagen", "front": "Bedürfnispyramide nach Maslow", "back": "Physiologisch → Sicherheit → sozial → Wertschätzung → Selbstverwirklichung. Dominant ist das nächste unbefriedigte Bedürfnis.", "exam": false}, {"topic": "Marketing: Grundlagen", "front": "Marketing-Grundhaltungen", "back": "Produktionsorientierung (verfügbar, billig) · Produktorientierung (beste Qualität) · Verkaufsorientierung (aggressiv, Nachkaufdissonanz) · Marketingorientierung (Kundennutzen, Beziehungen).", "exam": false}, {"topic": "Marketing: Analyse", "front": "SWOT-Analyse und ihre vier Strategien", "back": "S/W intern, O/T extern. SO: Stärken für Chancen nutzen · ST: Stärken gegen Risiken · WO: Schwächen abbauen für Chancen · WT: Bedrohung bei Schwächen abwehren.", "exam": true}, {"topic": "Marketing: Analyse", "front": "Marktanteil und Marktausschöpfungsgrad (Tische: MV 150 Mio., Miller 12 Mio., MP 187,5 Mio.)", "back": "Marktanteil = 12 · 100 / 150 = 8 % · MAG = Marktvolumen · 100 / Marktpotenzial = 150 / 187,5 = 80 %.", "exam": true}, {"topic": "Marketing: Analyse", "front": "Relativer Marktanteil", "back": "Eigener Marktanteil / Marktanteil des größten Konkurrenten, als Dezimalzahl. Miller 8 %, Konkurrent 10 % → 0,8. Stühle: 2 % / 28 % ≈ 0,07.", "exam": true}, {"topic": "Marketing: Analyse", "front": "Produktlebenszyklus: Phasen", "back": "Einführung (Gewinn negativ) → Wachstum (Absatz steigt schnell) → Reife/Sättigung (Gewinn hoch, Absatzspitze) → Rückgang (Kosten senken).", "exam": false}, {"topic": "Marketing: Analyse", "front": "BCG-Portfolio: vier Felder", "back": "Question Marks (wenig MA, starkes Wachstum: investieren oder aufgeben) · Stars (hoher MA, starkes Wachstum: ausbauen) · Cash Cows (hoher MA, stagnierend: abschöpfen) · Poor Dogs (desinvestieren).", "exam": true}, {"topic": "Marketing: Strategie", "front": "Ansoff-Matrix", "back": "Altes Produkt/alter Markt: Marktdurchdringung · altes Produkt/neuer Markt: Marktentwicklung · neues Produkt/alter Markt: Produktentwicklung · neu/neu: Diversifikation.", "exam": true}, {"topic": "Marketing: Strategie", "front": "Diversifikation: horizontal, vertikal, lateral", "back": "Horizontal: Fahrrad + Regenkleidung · vertikal: Schuhe + Rohleder · lateral (ohne Zusammenhang): Yamaha + Pianos.", "exam": false}, {"topic": "Marketing: Strategie", "front": "Segmentierungskriterien", "back": "Soziodemografisch (Alter, Einkommen, Wohnort) · psychografisch (Werte, Einstellungen, Motive) · verhaltensbezogen (Markentreue, Preisklasse, Einkaufsstätte).", "exam": false}, {"topic": "Marketing: Strategie", "front": "USP und Positionierung nach Kotler", "back": "Einzigartiger Vorteil in der Kundenwahrnehmung. Anforderungen: vor der Produktentwicklung festlegen · nur eine Eigenschaft herausstellen · nicht leicht kopierbar · langfristig.", "exam": false}, {"topic": "Marketing: Produkt", "front": "Grund- und Zusatznutzen am Beispiel Uhr", "back": "Grundnutzen: Uhrzeit anzeigen. Zusatznutzen funktional (wasserdicht), emotional (Design, Marke), sozial (Prestige einer Luxusmarke). Werbung betont den Zusatznutzen.", "exam": true}, {"topic": "Marketing: Preis", "front": "Skimming vs. Penetration", "back": "Skimming: hoch starten, dann senken (kurzfristige Erträge). Penetration: niedrig starten, schnelle Verbreitung im Massenmarkt.", "exam": false}, {"topic": "Marketing: Distribution", "front": "Reisender vs. Handelsvertreter: kritischer Umsatz", "back": "U = Fixkosten Reisender / (Provision HV − Provision R). Bsp.: 45.400 / (0,04 − 0,02) = 2,27 Mio. €; darunter Handelsvertreter, darüber Reisender günstiger.", "exam": true}, {"topic": "Marketing: Kommunikation", "front": "Tausenderkontaktpreis (TKP)", "back": "TKP = Kosten / (Nutzer · Zielgruppenanteil) · 1.000. A: 10.000 / (900.000 · 0,6) · 1.000 = 18,52 € · B: 7.000 / (500.000 · 0,7) · 1.000 = 20,00 € → A wählen.", "exam": true}, {"topic": "Marketing: Kommunikation", "front": "Push- vs. Pull-Strategie", "back": "Push: Hersteller → Händler (Anreize für Listung), Handel drückt Ware zum Kunden. Pull: Werbung beim Endkunden erzeugt Nachfragesog, Handel muss listen.", "exam": false}, {"topic": "Marketing: Kommunikation", "front": "AIDA", "back": "Attention → Interest → Desire → Action: Stufen, die Werbung beim Kunden auslösen soll.", "exam": false}, {"topic": "Marketing: Mix", "front": "Marketing-Mix (4P) am Beispiel Gartenmöbel", "back": "Product: wetterfestes Holz, Garantie · Price: Saisonpreise, Mengenrabatt · Place: eigener Onlineshop, Gartencenter · Promotion: Influencer, Messe.", "exam": true}, {"topic": "Marketing: Kontrolle", "front": "Werbegewinn und Werberendite", "back": "Werbegewinn = werbebedingter Mehrumsatz − Werbekosten · Werberendite = Mehrumsatz / Werbekosten · 100. Bsp.: 30.000 € Mehrumsatz, 10.000 € Kosten → 20.000 € bzw. 300 %.", "exam": false}, {"topic": "Rechnungswesen", "front": "Wer interessiert sich für das <b>externe<\/b> Rechnungswesen, und warum?", "back": "Eigenkapitalgeber (Verzinsung), Fremdkapitalgeber (Sicherheit von Kapital und Zinsen), Arbeitnehmer (sichere Jobs, Löhne), Lieferanten (Absatz, Lieferantenkredite), Kunden (sichere Beschaffung), Finanzbehörden (Steuer), Öffentlichkeit/Analysten/Presse (Güte), Gerichte (Beweismittel).", "exam": true}, {"topic": "Rechnungswesen", "front": "Wer nutzt das <b>interne<\/b> Rechnungswesen?", "back": "Aufsichtsgremien, Vorstand/Geschäftsführung, Management, Arbeitnehmer. Ziel: die betriebliche Leistungserstellung steuern (Kostenrechnung, Kalkulation, Kontrollrechnungen).", "exam": true}, {"topic": "Rechnungswesen", "front": "Nutzenschwelle: Was ist das, und wie rechnest du sie aus?", "back": "Andere Namen: Break-even-Point, Gewinnschwelle. Die Menge, ab der kein Verlust mehr entsteht: x = Kfix / (p − kv). Übung 28h: 120.000 / 32 = <b>3.750 Stück<\/b>, Umsatz 3.750 · 77 = 288.750 €.", "exam": true}, {"topic": "Klausurhinweise", "front": "Welche Kapitel kommen laut „Könnte drankommen“ <b>nicht<\/b> dran?", "back": "Kap. 8 Organisation und Kap. 10 Produktion ganz. Von Kap. 7 nur Kennzahlen und Balanced Scorecard. Bei den Rechtsformen nur Einzelunternehmen, OHG, KG, UG, GmbH, AG, GmbH & Co. KG.", "exam": true}], "quiz": [{"topic": "Einführung", "q": "Umsatz 36 Mio. €, Kosten 32 Mio. €. Wie hoch ist die Wirtschaftlichkeit?", "options": ["1,125", "0,889", "112,5 %", "4 Mio. €"], "correct": 0, "explain": "Wirtschaftlichkeit = Ertrag / Aufwand = 36 / 32 = 1,125; sie ist ein Faktor, keine Prozentzahl."}, {"topic": "Einführung", "q": "Filiale A: 100.000 € Gewinn bei 500.000 € EK. Filiale B: 200.000 € Gewinn bei 2 Mio. € EK. Welche ist rentabler?", "options": ["A mit 20 %", "B, weil der Gewinn doppelt so hoch ist", "B mit 10 %", "Beide gleich"], "correct": 0, "explain": "EK-Rentabilität A = 100/500 = 20 %, B = 200/2.000 = 10 %. Der absolute Gewinn sagt nichts über die Rentabilität."}, {"topic": "Einführung", "q": "Gewinn 80.000 €, Fremdkapitalzinsen 20.000 €, Gesamtkapital 1 Mio. €. Gesamtkapitalrentabilität?", "options": ["10 %", "6 %", "12,5 %", "8 %"], "correct": 0, "explain": "(80.000 + 20.000) · 100 / 1.000.000 = 10 %. Die FK-Zinsen werden zum Gewinn addiert."}, {"topic": "Einführung", "q": "„Mit 10 Stunden Lernen die bestmögliche Note erreichen“ ist ein Beispiel für …", "options": ["das Optimumprinzip", "das Maximalprinzip", "das Humanitätsprinzip", "das Minimalprinzip"], "correct": 1, "explain": "Der Input (10 h) ist fest, der Output wird maximiert."}, {"topic": "Rechtsformen", "q": "KG: Gewinn 450.000 €, Komplementär C bekommt 10.000 € Tätigkeitsvergütung pro Monat, Rest nach Einlagen A 150 / B 300 / C 50 Tsd. €. Wie viel erhält C insgesamt?", "options": ["45.000 €", "33.000 €", "153.000 €", "120.000 €"], "correct": 2, "explain": "TV 120.000 €; Rest 330.000 € · 10 % = 33.000 €; zusammen 153.000 € (Musterklausur 2a)."}, {"topic": "Rechtsformen", "q": "OHG mit zwei Gesellschaftern, 100.000 € Gewinn, im Vertrag nichts vereinbart, keine Beiträge bewertet. Verteilung (seit 2024)?", "options": ["Alles an den geschäftsführenden Gesellschafter", "Je 50.000 € nach Köpfen", "Nach Einlagen 2 : 1", "4 % auf die Einlagen, Rest nach Köpfen"], "correct": 1, "explain": "Seit MoPeG: Vertrag → Beteiligungsverhältnis → nach Köpfen. Die alte 4-%-Regel gilt nicht mehr."}, {"topic": "Rechtsformen", "q": "GmbH, Stammkapital 150.000 €. Wehrle übernimmt 69.000 € bar. Wie viel muss er mindestens vor der Anmeldung einzahlen?", "options": ["17.250 €", "6.250 €", "12.500 €", "69.000 €"], "correct": 0, "explain": "25 % je Anteil: 69.000 · 0,25 = 17.250 €; insgesamt kommen 37.500 € ≥ 12.500 € zusammen."}, {"topic": "Rechtsformen", "q": "Eine UG hat 8.000 € Jahresüberschuss und 2.000 € Verlustvortrag. Wie viel muss in die gesetzliche Rücklage?", "options": ["1.500 €", "2.000 €", "6.000 €", "500 €"], "correct": 0, "explain": "(8.000 − 2.000) · 25 % = 1.500 € (Zwangsthesaurierung, § 5a GmbHG)."}, {"topic": "Rechtsformen", "q": "Kommanditist mit 50.000 € Haftsumme hat 30.000 € eingezahlt (im HR eingetragen). Wie viel haftet er Gläubigern noch unmittelbar?", "options": ["50.000 €", "Unbeschränkt", "20.000 €", "0 €"], "correct": 2, "explain": "Unmittelbar haftet er nur für den nicht eingezahlten Teil der Haftsumme."}, {"topic": "Kooperation & Konzentration", "q": "Eine Schuhfabrik schließt sich mit einer Schuhhandelskette zusammen. Welche Richtung?", "options": ["Horizontal", "Anorganisch", "Diagonal-lateral", "Vertikal"], "correct": 3, "explain": "Aufeinanderfolgende Stufen derselben Branche = vertikal."}, {"topic": "Standort", "q": "Nutzwertanalyse: Kosten (Gewicht 60) und Qualifikation (Gewicht 40). Standort A: 8 und 5 Punkte, Standort B: 6 und 9 Punkte. Welcher gewinnt?", "options": ["A mit 680", "Unentschieden", "B mit 720", "A mit 13 Punkten"], "correct": 2, "explain": "A = 60 · 8 + 40 · 5 = 680; B = 60 · 6 + 40 · 9 = 720. Gewicht mal Punkte, nicht Punkte addieren."}, {"topic": "Rechnungswesen", "q": "Zweipunktverfahren: August 700 Stück/80.000 €, November 1.400 Stück/150.000 €. Wie hoch sind die variablen Stückkosten?", "options": ["114,29 €", "100 €", "70 €", "107,14 €"], "correct": 1, "explain": "k<sub>v<\/sub> = (150.000 − 80.000) / (1.400 − 700) = 70.000 / 700 = 100 €."}, {"topic": "Rechnungswesen", "q": "Mit k<sub>v<\/sub> = 100 € und K<sub>fix<\/sub> = 10.000 €: Gesamtkosten für 15.000 Stück?", "options": ["1.500.000 €", "160.000 €", "1.600.000 €", "1.510.000 €"], "correct": 3, "explain": "K = 10.000 + 100 · 15.000 = 1.510.000 € (Musterklausur 3)."}, {"topic": "Rechnungswesen", "q": "Produkt A: p 75 €, k<sub>v<\/sub> 40 €, 3.500 Stück. Produkt B: p 95 €, k<sub>v<\/sub> 45 €, 3.000 Stück. Fixkosten 275.000 €. Betriebsergebnis?", "options": ["+2.500 €", "+272.500 €", "−2.500 €", "−275.000 €"], "correct": 2, "explain": "DB A 122.500 + DB B 150.000 = 272.500 €; minus 275.000 € Fixkosten = −2.500 €."}, {"topic": "Rechnungswesen", "q": "Fixkosten 12.000 €, Preis 20 €, variable Stückkosten 14 €. Break-even-Menge?", "options": ["600 Stück", "1.200 Stück", "857 Stück", "2.000 Stück"], "correct": 3, "explain": "x<sub>BE<\/sub> = 12.000 / (20 − 14) = 2.000 Stück."}, {"topic": "Rechnungswesen", "q": "Eigenfertigung: K<sub>fix<\/sub> 100.000 €, k<sub>v<\/sub> 20 €. Fremdbezug: 30 € je Stück. Ab welcher Menge lohnt Eigenfertigung?", "options": ["Ab mehr als 10.000 Stück", "Ab mehr als 5.000 Stück", "Nie, Fremdbezug ist immer billiger", "Ab mehr als 3.333 Stück"], "correct": 0, "explain": "100.000 + 20x = 30x → x = 10.000. Darüber ist Eigenfertigung günstiger (Übung 28g)."}, {"topic": "Rechnungswesen", "q": "Was ist die kurzfristige Preisuntergrenze?", "options": ["Die Selbstkosten je Stück", "Die variablen Stückkosten", "Die Fixkosten je Stück", "Der Marktpreis der Konkurrenz"], "correct": 1, "explain": "Kurzfristig müssen nur die variablen Kosten gedeckt sein (db = 0); langfristig k<sub>v<\/sub> + K<sub>fix<\/sub>/x."}, {"topic": "Planung & Kontrolle", "q": "Umsatz 3 Mio. €, Gewinn 300.000 €, Gesamtkapital 2,4 Mio. €. ROI?", "options": ["12,5 %", "10 %", "8 %", "125 %"], "correct": 0, "explain": "ROI = Umsatzrentabilität 10 % · Kapitalumschlag 1,25 = 12,5 % (Musterklausur 5a)."}, {"topic": "Planung & Kontrolle", "q": "Gewinn 50.000 €, Umsatz 1 Mio. €, Gesamtkapital 500.000 €, EK 200.000 €. ROI?", "options": ["25 %", "5 %", "10 %", "200 %"], "correct": 2, "explain": "UR 5 % · KU 2 = 10 % = 50.000 / 500.000. Das EK ist für den ROI ein Ablenker (Übung 33)."}, {"topic": "Materialwirtschaft", "q": "Jahresbedarf 1.000 Stück, fixe Bestellkosten 50 €, Preis 100 €, Lagerkostensatz 10 %. Optimale Bestellmenge (Andler)?", "options": ["1.000 Stück", "32 Stück", "100 Stück", "10 Stück"], "correct": 2, "explain": "√(2 · 1.000 · 50 / (100 · 0,1)) = √10.000 = 100 Stück (Übung 43a)."}, {"topic": "Materialwirtschaft", "q": "Sicherheitsbestand 100 Stück, Lieferzeit 14 Tage, Tagesverbrauch 20 Stück. Meldebestand?", "options": ["280 Stück", "120 Stück", "1.400 Stück", "380 Stück"], "correct": 3, "explain": "Meldebestand = 100 + 14 · 20 = 380 Stück."}, {"topic": "Materi
